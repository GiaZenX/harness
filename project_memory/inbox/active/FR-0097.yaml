title: 'Recherche: welche Denktiefe (effort) fuer welche Rolle -- Planer (PM/Architekt/Designer)
  hoch fuer die Festlegung der Details, Bauer eher mittel, Pruefer hoch? Grundlage
  fuer Strom C (zwei Achsen)'
request_text: 'User 2026-09-28: ''Haben wir mittlerweile definiert welchen effort
  fuer was zu nutzen ist? Hab ein interessantes Video gesehen. Scheint so als waere
  wichtig dass der PM/Architekt/Designer eher auf xhigh laeuft um Details festzulegen
  und die worker eher auf Medium zu halten. Kannst ja eine Recherche hierzu starten.''
  The video (YouTube short @DIYSmartCode ''The Truth About Claude Code Effort Levels'',
  AI-generated, screenshots in the session) claims: same prompt on Opus 5.5 at low/medium/high/max
  took 1.5/4/11/39 min; with an interview->spec step the results became much more
  alike; on 370 attempts Fable 5.1 low vs max: passed 140->214, missed cases fell,
  but ''picked the wrong reading'' ROSE 25->47 and tokens tripled (73k->222k median);
  max catches missed cases but will not fix a wrong approach; rule of thumb low=sketch,
  medium=feature, high=bug/edge cases, max=hard end-to-end hand-off; ''build low/med,
  review yourself, verify high''.'
