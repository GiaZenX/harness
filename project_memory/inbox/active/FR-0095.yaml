id: FR-0095
title: 'Freigabe-Karte ruhig und lesbar: ''Freigabe erbeten fuer <Art>'', darunter
  die Liste der Eintraege (Id + deutscher Kurztitel), dazu eine vom PM formulierte
  Erklaerung, was das bedeutet -- keine Pruefsummen, Pfade, Request-Ids und englischen
  Feldtexte im Blickfeld'
request_text: 'User 2026-09-26: ''Die Freigaben wirken immer noch ziemlich ueberfordernd,
  ziemlich Reizueberflutung. Es waere einfach nur wichtig: Freigabe erbeten fuer,
  und dann steht unten aufgelistet, welche Tasks, Requirements oder was auch immer
  freigegeben werden, und auch noch eine vom PM selbst formulierte Nachricht, was
  das alles bedeutet.'' EXAMPLE of today''s card (this repo, 2026-09-25): the option
  text carries ''Gebunden an Pruefsumme abf3255a86e2... (Anfrage approvals/pending/<32
  hex>.yaml)'', the question an ''[APR-REQ:<32 hex>]'' token, and for a hole exception
  the English `limits` sentences cut at 160 characters. CONSTRAINT to keep: gate_approval
  compares the answered question character for character and mints only from the approving
  option -- the binding (request id, mint code, hash) must stay machine-checkable,
  but may move out of the READ text (e.g. only the short mint code in the label, the
  rest in the record). The PM''s note must be INSIDE what is signed (hashed), so the
  user signs the words he read, and marked as the PM''s words. MEASURED by the lead
  2026-09-26 in C:/Offline Repos/synaipse-unified/project_memory/approvals (kit 2026.09.13-6),
  2026-09-25 20:29 -> 2026-09-26 13:09: 16 minted approvals = 1 plan, 2 delivery,
  1 kit_update, 1 routine and 11 SCOPE -- one per item: CR-0001..CR-0009, BUG-0001,
  PR-0031; nine of them created 21:01:19-21:03:15, i.e. nine questions in two minutes.
  The kernel''s list-bound form covers only `plan` (the open ROOT goals, approvals.plan_goals),
  `verification` and `hole_exception` batches; a scope question over CRs/BUGs/new
  goals has no batch form, so the PM had no way to ask once. Earlier work on the card''s
  language: BUG-0073, BUG-0271 (both VERIFIED), FR-0090 (expiry date readable, TRIAGED).'
