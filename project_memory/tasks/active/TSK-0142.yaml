  NOT written by you: put the exact patch -- file, line, before/after -- under the
  heading ''Seam handoffs'' in your protocol and repeat it in your final message;
  the lead carries it to the owner. A red node in a suite you run that another stream''s
  in-progress edit causes is written down as ''foreign red'' with the node id and
  left alone'
- 'HOST RULES with three builders on one machine (DEC-0094/0095 (6), and the gen-4
  power-off events): ONE pytest at a time per builder, SMALL selections only -- a
  file or `-k`/node ids that a measured run finishes in under three minutes; never
