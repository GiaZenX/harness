  without .git under C:/Offline Repos/v2-testbed/_round-scratch/(this task id)/ with
  the arbiter''s line per row; clock read for every time you write; protocol as you
  go in project_memory/staging/(this task id)/protocol.md'
- 'forbidden_scope project_memory/** EXCEPTS project_memory/staging/(this task id)/;
  state writes through the kernel only: an EVD per closed hole (kind test, run_scope
  selection, the naming nodes) -- the kernel lock serialises the three streams, retry
  on a lock refusal; no transition of BUG items by you; the verification batch lines
  (<= 10 ids per line) for the lead at the end; a hole the attempt measures unclosable
