  authority -- the item and the code are'
- 'THE OTHER STREAMS run at the same time in the SAME working tree: A (kernel), C
  (tools and this repo''s own tests). Your allowed_scope is the whole of what you
  write. A fix that needs a line OUTSIDE it (a kernel rule that lands in a constitution,
