required_inputs:
- 'STREAM B (order flow) of order 7, base commit 35e929b. WORK IN YOUR WORKTREE C:/Offline
  Repos/v2-testbed/_worktrees/g7-dispatch on branch g7/dispatch (the lead created
  it); the main repo C:/Offline Repos/AgentAndSkills is read-only for you except its
  project_memory/staging/(this task id)/ and the kernel commands. Two other streams
  run at the same time in their own worktrees -- their files are in your forbidden_scope.
  SHARED FILES (git merges distinct hunks; touch ONLY your section, say every hunk
  in the protocol): team-kits/kernel/cli.py (A: request-approval; B: create-task/dispatch/ladder/checkpoint;
  C: doctor/update-kit/new doors), the kits'' project-manager / office-manager / research-lead
  SKILL.md and constitution/AGENTS.md (A: approval passages; B: order, cost-line and
  slicing passages; C: kit-update and memory passages), README.md command list, hooks/_compat.py
  and hooks/_kernel.py (add NEW functions, do not rewrite existing ones). Existing
  test files: add new test functions at the end or put new tests in a new file.'
- 'BUG-0313 (URGENT, field regression of TSK-0151): a child waiting on its own background
  run is read as stopped by gate_dispatch -> FAILED booking + a second concurrent
  builder in synaipse. Fix on the running path (the gate treats a pending background
  completion as alive, or the kits'' order line tells SUBAGENTS to run long commands
  in the foreground with a timeout -- whichever the gate can measure); the FR-0093
  order line in every kit corrected accordingly. BUG-0314 (lease dead ends: expired
  lease left IN_PROGRESS; foreground self-path child cannot book; swept lease with
  committed work). BUG-0324 (fail_class unreachable for the verifier). BUG-0322 (architect-step
  chicken-and-egg; stray SR parent; refusal names nothing). BUG-0315 (report._runs_no_file
  resolves the _gate.py launcher argument against the repo root). BUG-0321 (a later
  passing selection never supersedes an older failing one for a bug''s current verdict
  -- find the reader; if it is not in your files, say so and hand it to the merge).'
- 'BUG-0318 (the PM slices into tiny serial orders with a QA order per SR/CR, against
  DEC-0087/0088 and the skill''s own step 7; nothing notices; no parallel builders):
  fact lines (NOT refusals) at create-task for a second build order under the same
  goal and for a QA order on a one-output change, naming DEC-0087/0088; orders-per-goal
  and verifier share in the session brief; parallel candidates from check-scopes named
  in the brief. FR-0092 (every started agent''s VISIBLE name carries role + model
  + effort + stream letter, e.g. ''Frontend Developer · Opus xhigh · A''): the dispatch
  header hands the PM the exact description string to spawn with, and the spawn gate
  compares the description against it (refuse or fact line -- measure what the payload
  carries). DEC-0118 (on Claude the architecture class starts at XHIGH, ceiling xhigh;
  one-line switch back via provider_top) -- where the start effort is derived.'
- 'RULES: DEC-0100 (a bug closes on a test that NAMES it), DEC-0116 (structural contracts,
  the path that runs, no free-text readers), DEC-0121 (resolved paths; a new kernel
  command joins its registers -- status-writer bound, board regeneration list, command-surface
  listings; protocol as you go), DEC-0080 rule 2 (run every suite that READS a rule
  you change, each as its own selection, listed in the protocol), DEC-0102 (2)/(4).
  Kit hooks are mirrored x3 (dev/office/research) byte-identical unless KIT_SPECIFIC_HOOKS
  names the reason.'
- 'COST + PROCESS (FR-0093 as corrected by BUG-0313''s finding): long commands in
  the BACKGROUND with a completion wait are for YOU, not for any agent you might start;
  one pytest at a time; read files over 2,000 lines by section; NO stamp and NO full
  run in a stream (the merge does both, DEC-0121 (1)); red-first in a .git-less copy
  under C:/Offline Repos/v2-testbed/_round-scratch/(this task id)/; clock read for
  every time you write; protocol as you go in project_memory/staging/(this task id)/protocol.md
  (the MAIN repo''s staging, not the worktree''s).'
- 'STATE: through the MAIN repo''s kernel only (`PYTHONPATH=team-kits python -B -m
  kernel.cli --root "C:/Offline Repos/AgentAndSkills/project_memory" ...` from the
  main repo); an EVD per closed bug naming its node, recorded from the worktree''s
  run; no BUG transitions; no commit on feat/harness-v2, no push, no mint. Commit
  your work on YOUR stream branch in YOUR worktree (git commit there is yours; the
  merge takes the branch).'
