- 'FR-0062 + kernel/gaplog.py + tools/harvest_kit_gaps.py (AC-11: the harvest runs
  from this repo against the three installed projects under C:/Offline Repos/ -- read-only
  on them; its state file lives here)'
- 'HOST RULES: one pytest at a time, every run with a timeout, no CPU-saturating rig
  (four freezes measured); gate 5 live -- the full tools/ suite ONCE at the end with
