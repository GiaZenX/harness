  canonical state through the kernel only; the lead runs evidence / transitions /
  migrate-holes --reindex
expected_outputs:
- 'AC-1: ONE WRITER PER GOAL (DEC-0087 (1)): Given an approved goal, When the PM dispatches
  it, Then exactly one builder lease exists for it carrying the whole goal (PR + ACs
  + masterplan + architecture/product questions) and the PM''s own write scope is
  unchanged (gate_write_scope measured refusing a PM code write); a second builder
  needs check-scopes evidence of disjoint file sets on the lease (DEC-0087 (2)); red-first
  on the dispatcher'
- 'AC-2: TEAM SIZE DERIVED (DEC-0087 (2)): the presets question is gone from the entry
  interview (user/claude/CLAUDE.md + the PM skill), presets become the PM''s derivation
  with DEC-0048''s ''ask again when a role is missing'' as the escape; a structural
  test reads the entry file and the PM skill for a team-size question and is red on
  it'
- 'AC-3: TIERS DERIVED PER GOAL AND PER ORDER (DEC-0088 (1)-(5), the per-order tiers
  DEC): the TSK contract carries optional `rung` and `effort`; create-task accepts
  them; the dispatcher''s lease rung = max(ladder class/pin rung, order rung), effort
  = max(goal effort, order effort), floors and `top` kept, escalation from wherever
  the order starts; both on the lease, in the session brief and beside the order in
  check-scopes; a test refuses a rung outside the kit''s ladder vocabulary and an
  effort outside low|medium|high|xhigh; the PM duty text carries the user''s three-line
  rule and never asks the user for tiers'
- 'AC-4: VERIFICATION AT THE GOAL (DEC-0087 (3), DEC-0088 cadence (a)-(f)): the PM
  skill and constitutions describe the cadence (no verifier during the build; ONE
  round at the goal per AC; one rework + one short second round over failed ACs; a
  third round is a re-cut by finding class; small changes under a goal get no separate
  verifier; merge stays its own round); a reading test is red on any kit text that
  still orders a verifier after every rework; the retrospective step at the goal records
  wall-clock against measured-disjoint scopes (the solo-habit catcher)'
- 'AC-5: ENTRY (DEC-0087 (4)): the first-contact question is ''Mit Langzeit-Gedaechtnis
  fuer das Projekt (Projektakte, Entscheidungen, Beweise) -- oder erstmal frei?'';
  ''with'' installs the kit at once with the solo default; the product interview stays
  but shorter; measured on a scaffolded pilot; the German-report rule holds on that
  surface (FR-0048)'
- 'AC-6: THE EXPERIMENT (FR-0089): the same frontend task with the same brief run
  two ways -- (a) one Fable alone, (b) the kit in the light form -- measured on tokens,
  wall-clock, rounds and the USER''s quality verdict, recorded as EVD with the numbers;
  the kits'' builder default tier (Fable, or Opus with Fable for architecture/design)
  is decided from it as a DEC'
- 'AC-7: APPROVAL QUESTION IN GERMAN (BUG-0271, BUG-0073): build_question yields a
  German sentence with the kind in plain words from ONE table beside the enum (two-sided
  tripwire), the item''s title or German-labelled manifest values, no hash / request
  id / YAML path in the question text (moved into the compared option description);
  the gate still compares character for character (red-first: a tampered description
  refused); the PM''s value-language rule of BUG-0073 kept'
- 'AC-8: AUDITOR READ-ONLY ROUTE (BUG-0266/H184): the project-auditor is dispatched
  through a `routine` approval kind that binds a read-only manifest, runs from the
  session-start due reading without a code write, and its report lands as items through
  the kernel; measured end to end on a scaffolded pilot per kit'
- 'AC-9: WATCHER DUO (DEC-0089, DEC-0090; TSK-0134): claude-watcher / codex-watcher
  on the opus rung on both providers, report name with runner suffix, --due per watcher
  AND runner, radar/routine.json recording the four local routines as told with the
  report cadence as evidence, --describe printing the four Instructions texts; the
  four routines created at the next local session (two Claude Desktop tasks by asking
  Claude Desktop, two Codex app Automations by the user), the first cross-provider
  report as the evidence'
- 'AC-10: BUILT IN ITS OWN FORM (DEC-0087 (7)): this goal is delivered by ONE builder
  on the top rung with ONE verifier round at the goal (plus at most one mid-goal check,
  this goal being LARGE), the merge/integration its own round; the (g) table compares
  its tokens/rounds/wall-clock with generation 5''s per-stream numbers -- the first
  measurement of the form on itself'
- 'AC-11: ROLLOUT AND HARVEST: the three installed projects receive the stamp at their
  next session start (update-kit route), the kit-gap harvest (FR-0062) runs once from
  this repo as a recorded lead routine and its entries are triaged into items; what
  the harvest finds is the first input of the generation-6 retrospective'
- 'AC-12: HONEST TEAM AND TIER CHOICE (DEC-0092): a second concurrent build lease
  under one goal is refused without a check-scopes record of disjoint file sets; the
  spawn/dispatch gate prints the fact-based four-line checkpoint (disjoint sets, size
  signals, rung + floor, last-N distribution) before every builder start and never
  blocks on it; the session brief carries the distribution line; the retrospective
  step writes the habit verdict with numbers; the pilot rig (three orders of different
  size) runs at every stamp touching the ladder or PM texts; red-first on the two
  refusals; no free-text justification field anywhere'
- 'BUILT IN ITS OWN FORM (AC-10, DEC-0087 (7)): ONE builder (you, Fable high) with
  the whole goal; red-first per fix in a copy outside the repo; NO verifier during
  the build; ONE mid-goal check by the Opus verifier at the half (this goal is LARGE:
  you report ''half'' when the kernel contract + gate + checkpoint are built and measured,
  before the texts and the entry file); ONE verifier round at the goal against the
  twelve ACs; at most one rework + one short second round over failed ACs; the (g)
  table compares your tokens/rounds/wall-clock against generation 5''s per-stream
  rows -- the first measurement of the form on itself.'
- 'STAMP BEFORE THE FULL RUN: one release stamp across the three kits after the last
  change (tools/bump_kit_version.py), THEN the full tools/ suite ONCE with the delivery
