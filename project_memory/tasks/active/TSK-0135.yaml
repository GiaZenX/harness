  red a finding fixed red-first, then the suites that read the changed files, then
  ONE more stamp and ONE more full run.'
- 'PROTOCOL in project_memory/staging/(this task id)/protocol.md: per AC the measured
  line (test name, red-first mutation, run), the seams touched, new holes through
  the kernel (`capture BUG --hole`, H189+; the lead runs `migrate-holes --reindex`
