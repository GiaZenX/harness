expected_outputs:
- 'AC-1 BATCH VERIFICATION: `request-approval verification --batch BUG-a BUG-b ...`
  builds ONE pending request whose subject manifest lists every bug id with the evidence
  id that measured it; build_question renders a German sentence naming the count and
  the compared option text listing ''BUG-xxxx (EVD-yyyy)'' per bug; a bug without
  a passing test evidence naming it, or not TRIAGED/OPEN, is refused from the batch
  BY NAME at request time; the mint (gate_approval PostToolUse, user''s answer) walks
  each listed bug OPEN/TRIAGED -> APPROVED -> FIXED -> VERIFIED with the evidence
  as approval_ref/evidence ref and archives it; gate_approval still refuses a paraphrase
  or a tampered option (process test); red-first on the refusal, the walk, the archive;
  mirrored x3 where a kit file carries it; the PM skills'' bug-closing step names
  the batch form.'
- 'AC-2 THE RE-RUNS: tools/close_measured_pass.py reads survey-table.md, takes every
  MEASURED-PASS row whose item is still active, re-runs its named test node ONCE on
  the current tree (one at a time, timeout, log), records an EVD (kind test, result
  pass, run_scope selection, run-command = the node) on pass and NO evidence on fail
  (the row is listed as ''no longer passes'' in the protocol), then prints the batches
  (<= 25 ids each) as the exact `request-approval verification --batch ...` lines
  for the lead; a bug whose row names no test is listed for AC-3.'
- 'PROTOCOL in project_memory/staging/(this task id)/protocol.md: the rerun table
  (id, node, result, EVD), the batch lines for the lead, the red-first rows with the
  arbiter''s line, the (g) row (tokens from your counter, wall-clock read), the patch
  path `git diff 07691ba`, the EVD lines for the lead, the DEC-0086 revision proposal
  (one paragraph the lead captures); no commit, no push, no mint.'
- 'RUNS: tools/test_approvals_dispatch.py, test_kernel.py, test_report.py, test_close_measured_pass.py
  in full, test_hooks -k approval, test_hooks_v2 -k approval, one at a time; `python
  tools/bump_kit_version.py` once; ruff tools team-kits; validate.py.'
