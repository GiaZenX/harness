    at triage), with one TSK per PR; built into the kits with FR-0021'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0068
  type: DEC
  title: 'FR-0074 decided: ONE plan-level approval kind `plan` covers the confirmed
    goal list for the scope edge; delivery and acceptance stay per goal; what still
    asks is the irreversibility property in the kernel, not a list'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0069
  type: DEC
  title: 'H138 accepted as a named exception: the design-standard checks REPORT findings
    on a rendered draft (exit 3) and nothing refuses freezing it -- until the first
    measured case of a draft with findings being built or frozen anyway'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0070
  type: DEC
  title: 'Generation 3 verdict (DEC-0062 first cut, DEC-0063 rules): the cap holds
    for four of five streams, not for the seam-reading guard; the repeated finding
    class is the unrequested full suite run; the merge round found eleven findings
    no stream could see; three orchestrator failures cost more than any stream'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0071
  type: DEC
  title: 'BUG-0090 entschieden: die BESTAETIGENDE Kante liest eine ehrlich erklaerte
    Auswahl, der Merge nicht -- eine Ableitung, zwei Fragen, weil ein bestandener
    Teillauf ueber genau EIN benanntes Item etwas anderes belegt als ueber eine Lieferung'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0072
  type: DEC
  title: 'FR-0085 entschieden: die SR-Pflicht haengt an der KLASSE des Produktziels
    und wird dort verweigert, wo eine Lease entsteht (Kernel), nicht im Dispatch-Haken
    der Kits'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0073
  type: DEC
  title: 'FR-0087 entschieden: ein gemessenes, offenes Loch ist ein BUG mit einer
    statusabhaengigen Pflicht `limits` und einem Endzustand ACCEPTED_EXCEPTION, den
    nur eine nutzergemintete Freigabe geht -- kein eigener Typ; die Migration der
    140 Eintraege laeuft EINMAL durch den Kernel'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0074
  type: DEC
  title: 'H163 entschieden: die Architekturschritt-Pflicht (DEC-0072) gilt nur in
    einem Kit, dessen Vertrag den Typ SR kennt UND dessen Wurzeltyp die Abnahmekriterien
    nicht selbst traegt -- abgeleitet aus dem Kit-Vertrag, keine Ausnahmeliste'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0075
  type: DEC
  title: 'Rechnungs-Anwendung entschieden: ein eigenes Produkt mit dem Entwickler-Kit
    (Oberflaeche fuer den Nutzer UND Befehlsschnittstelle fuer die Buero-Rollen),
    nicht ein Skript im Buero-Kit; das Buero-Kit baut nur die Andockstelle'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0076
  type: DEC
  title: 'Modell-Leitern entschieden: DREI Sprossen je Anbieter -- Claude fable /
    opus / sonnet, Codex astra / sol / terra (kein Luna, keine haiku-Sprosse) -- Aufwand
    standardmaessig high, grosse Aufgaben xhigh; gebaut von PR-0010'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0077
  type: DEC
  title: 'Zwei Achsen statt Mischleiter: Stufe haengt an Rolle und Kit-Endpunkt, Aufwand
    an der Aufgabengroesse -- und die Eskalationsmechanik aus DEC-0034 wird JETZT
    gebaut (PR-0010), nach 26 Tagen ohne Item; Gen-5-Stufen: Fable oder Opus je Umfang,
    Pruefer Opus'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0078
  type: DEC
  title: 'Buero-Kit laeuft bewusst die niedrigere Leiter: kein fable ausser fuer den
    office-developer, sonst opus / sonnet mit Aufwand medium (Standard) / high (grosse
    Ziele) statt high / xhigh -- Verfeinerung von DEC-0047 und DEC-0077'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0079
  type: DEC
  title: 'DEC-0074 praezisiert: die Architekturschritt-Pflicht gilt genau dann, wenn
    das KIT (seine ausgelieferte Vorlage, nicht der lebende Projektbestand) eine Heimat
    fuer SR mitbringt UND der Ursprung des Auftrags seine Kriterien nicht selbst traegt
    -- ein lebendes Verzeichnis oder ein einzelner `capture SR` schaltet die Pflicht
    in einem Kit ohne SR nicht ein'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0080
  type: DEC
  title: 'Generation 4 verdict (DEC-0070 rules applied, DEC-0067 bundle at the goal,
    DEC-0068 plan approval): the measured cut held, the merge round found what no
    stream could see for the third time, the repeated finding class is ''a reader
    that reads less than its docstring claims'', four host power-offs came from an
    all-core load rig, and the lead repeated a refuted order sentence -- eight rules
    for generation 5'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0081
  type: DEC
  title: 'Stufen korrigiert: die Stroeme einer Generation laufen auf Opus (high),
    nur die MERGE-Runde auf Fable (high; xhigh sobald der Spawn es erreicht) -- Kostenentscheidung
    des Nutzers, ersetzt DEC-0077 (4) und DEC-0080 (8)'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0082
  type: DEC
  title: 'Schriftverkehr im Buero-Kit entschieden: ein beigebrachter Arbeitsablauf
    (Skript + Klartext-Anleitung, vom Buero-Manager ausgefuehrt und geprueft), keine
    eigene Rolle -- FR-0033 / PR-0009 AC-1'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0083
  type: DEC
  title: 'FR-0012 entschieden: eine Entscheidung sagt in einem Feld `work`, welche
    Items sie tragen (oder `none`), und der Validator nennt jede geltende Entscheidung,
    auf die kein Item zeigt -- Feld plus Zeiger-Erkennung (A)'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0084
  type: DEC
  title: 'Radar-Ausloeser entschieden: die Watcher laufen ueber eine CLAUDE-ROUTINE
    -- ''so wie auch der Project Auditor laufen sollte'' -- und ob der Auditor in
    den Kits ueberhaupt laeuft, wird zuerst gemessen; kein Windows-Task, keine Sitzungsstart-Pflicht
    des Leads als Mechanismus'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0086
  type: DEC
  title: 'Schliessweg eines reparierten Bugs entschieden: eine Nutzer-Muenzung (scope)
    je Bug, vom Lead gebuendelt vorgelegt -- der ausgelieferte Automat bleibt; die
    Kante TRIAGED -> FIXED fuer den bewiesenen Fall ist die Frage einer eigenen Runde
    (DEC-0051 (2))'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0087
  type: DEC
  title: 'Die leichte Arbeitsform ab Generation 6: der Orchestrator baut nicht selbst,
    er spawnt EINEN Bauer mit dem ganzen Ziel; Team-Groesse wird abgeleitet, nie gefragt;
    ein unabhaengiges Prueftor je Ziel statt Runde um Runde; die Einstiegsfrage heisst
    ''mit Langzeit-Gedaechtnis oder erstmal frei'''
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0088
  type: DEC
  title: 'Stufen und Prueftakt der leichten Arbeitsform (Zusatz zu DEC-0087): der
    Orchestrator leitet die Stufe selbst ab -- Qualitaet vor Kosten, aber keine unnoetigen
    Kosten --, und geprueft wird am Ziel: hoechstens zwei Prueferrunden je Ziel, keine
    nach einer Kleinaenderung'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0089
  type: DEC
  title: 'Radar-Ausloeser, dritte Runde (loest DEC-0085 ab): der Mechanismus IST die
    LOKALE Claude-Desktop-Routine (''Weekly harness radar'', freitags ~20:00, seit
    2026-06-30 durch den Sitzungsagenten angelegt) -- sie laeuft nachweislich; die
    Codex-Haelfte bekommt dieselbe Art Routine; die Cloud-Routine wird NICHT angelegt'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0090
  type: DEC
  title: 'Watcher-Duo: radar-watcher heisst kuenftig claude-watcher (Gegenstueck codex-watcher),
    beide auf der opus-Sprosse (Claude opus, Codex gpt-5.6-sol), und JEDER Watcher
    laeuft ueber BEIDE Anbieter -- vier lokale Routinen (zwei Claude-Desktop-Aufgaben,
    zwei Codex-App-Automationen), angelegt beim naechsten lokalen Neustart'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0091
  type: DEC
  title: 'Stufe je AUFTRAG (Zusatz zu DEC-0077 / DEC-0088): bei mehreren parallelen
    Bauern gibt der PM jedem Arbeitsauftrag seine eigene Sprosse und seinen eigenen
    Aufwand nach Umfang und noetigem Urteil -- sonnet / opus / fable mal high / xhigh
    -- als dritte Eingabe der Sprossen-Ableitung, nie unter dem Boden der Rolle'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0092
  type: DEC
  title: 'Ehrliche Team- und Stufenwahl (Zusatz zu DEC-0087/0088/0091): kein Begruendungs-Freitext,
    sondern ein Struktur-Gate (zweiter Bauer nur mit Bereichsabgleich), eine Verteilungszeile
    im Briefing, eine Rueckschau-Regel, ein Pilot-Rig -- und ein FAKTEN-Checkpoint
    des Spawn-Gates, der den PM vor jedem Start zum Nachdenken bringt statt ihn zu
    blockieren'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0093
  type: DEC
  title: 'Eigenstaendiger Abschluss von Generation 5 und Start von Generation 6 (Nutzerwort
    2026-09-10): Commit ohne Rueckfrage, Start der Gen-6-Arbeit ohne die Plan-Freigabe
    abzuwarten, die nur der Nutzer praegen kann -- alle Nutzer-Freigaben werden bei
    seiner Rueckkehr als EIN Buendel gestellt; kein Push ohne sein Wort; Updates in
    2-3 Saetzen'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0094
  type: DEC
  title: 'Retrospektive der Generation 5 (Nachfolger von DEC-0080): was der Schnitt,
    die Uebergaben und der Merge gemessen haben -- und die Regeln, die Generation
    6 daraus mitnimmt'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0095
  type: DEC
  title: 'Bauer-Standard OPUS (loest DEC-0088 (1) ''top rung'' ab): Fable ist als
    Dauerstufe nicht tragbar; Fable nur noch fuer den benannten Architektur-Schritt
    eines grossen Ziels und als Eskalationsziel nach einem gescheiterten Opus-Bau
    -- Orchestrator/PM, Bauer und Pruefer laufen auf Opus'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0096
  type: DEC
  title: 'Eskalation: erst AUFWAND, dann SPROSSE (Zusatz zu DEC-0034 Regel 2 / DEC-0095
    (4)): der erste Fehlschlag hebt den Aufwand auf derselben Sprosse (high -> xhigh),
    die Sprosse steigt erst nach wiederholtem Scheitern -- Fable wird beim dritten
    Fehlschlag erreicht, nicht beim ersten'
  status: VALID
  revision: 1
  approval_ref: null
- id: DEC-0097
  type: DEC
  title: 'Bau-Klasse: STANDARD und BODEN sind zwei Werte (Praezisierung zu DEC-0095
    (1) / DEC-0091 (2)): der Bau startet ohne Bitte auf opus, der Boden bleibt der
    Rollen-Pin (sonnet), und eine Bitte UNTER den Standard bis zum Boden ist erlaubt,
    wenn der Auftrag einen Test als Abnahme traegt -- sonst bliebe ''Sonnet fuer ganz
    kleine Sachen'' fuer Bau-Rollen unerreichbar'
  status: VALID
  revision: 1
  approval_ref: null
