id: PR-0008
title: 'G5-1 Bestandsbereinigung: every open BUG and wish of this repo measured against
  the running code and closed through the kernel or kept with its chain (FR-0058),
  plus a derivable notion of ''done'' so the stock cannot lie upward again'
class: normal
user_story: As the user who steers this project by its backlog, I want the 89 open
  bugs and 21 open wishes to be what is REALLY open -- each one measured against the
  code that ships today, closed through the kernel with the evidence that closes it,
  or kept with a measured chain -- so that the next generation is planned on a true
  stock and not on a list that grew for two months without anyone closing what was
  built.
problem: 'FR-0058 states it: delivered wishes and repaired bugs stay open. Measured
  2026-09-05: 89 BUG items active, 5 VERIFIED; 21 FR items active; most bugs date
  from the August pilots (P4-x lines, BUG-0001..0082) and several are known to be
  built since (kernel `update` exists while BUG-0001 says the surface has none; BUG-0062
  names the office timeouts that G4-1 reworked; BUG-0025/0033/0069/0088/0090/0091
  are fixed in generation 4 but not VERIFIED because no evidence line ran the confirming
  edge). Nothing derives ''done'' from the code -- a bug is closed only when a hand
  transitions it.'
goal: 'Every active BUG and FR carries a measured verdict after this round: VERIFIED/archived
  through the kernel with the evidence that measured it (a test named, red-first where
  a fix was made), or kept OPEN/TRIAGED with the chain that still reproduces today
  and the item it belongs to; the small old kernel contracts on the way are built
  (BUG-0023 empty expected_outputs refused; BUG-0022 the CR type reached or removed
  with reasons); and the kernel gains a derivable ''done'' reading -- a validator
  line that names an item whose confirming test or evidence exists while the item
  stands open.'
acceptance_criteria:
- id: AC-1
  text: 'FR-0058 (survey): Given the 89 active BUGs, When each is measured against
    the running code (its observed line re-run or its test executed), Then each carries
    one of three verdicts in the state -- VERIFIED and archived through the kernel
    with an Evidence item naming the test/measurement; still OPEN with the re-measured
    chain and date; or CANCELLED/superseded with the item that absorbed it -- and
    the round''s protocol lists all 89 with verdict and measured line; no verdict
    without a measurement'
- id: AC-2
  text: 'FR-0058 (wishes): Given the 21 active FRs, When each is triaged against what
    ships, Then delivered ones are MERGED with resulting_item, absorbed ones point
    at their goal, the deferred block (FR-0024, FR-0019, FR-0022, FR-0023, FR-0025,
    FR-0020) stays TRIAGED with the user''s ''needs planning'' note, and no FR remains
    whose source section describes something already built'
- id: AC-3
  text: 'FR-0058 (the derivable ''done''): Given an item that stands OPEN while its
    confirming evidence or named regression test exists and passes, When validate
    runs, Then it names the item as ''stock lies upward'' with the evidence/test it
    found -- a property derived from the items and the evidence store, not a list;
    red-first'
- id: AC-4
  text: 'BUG-0023: create-task and capture TSK refuse an empty expected_outputs list
    naming the field (both entrances, one rule); existing items with an empty list
    are named by the validator; red-first'
- id: AC-5
  text: 'BUG-0022: the CR type is either reached in a measured run (a change to something
    built produces a CR item through its automaton, and the PM texts say WHEN a CR
    applies instead of a PR replacement, with a test on the text-to-behaviour path)
    or removed with the reasons recorded -- no dead contract; the PR-replacement path
    stays for real re-orientations and records the replacement'
- id: AC-6
  text: 'Generation-4 leftovers closed through the kernel: BUG-0025, BUG-0033, BUG-0069,
    BUG-0088, BUG-0090, BUG-0091 VERIFIED against the merged tree with their evidence
    lines; BUG-0083..0086 and BUG-0089 archived; the seven G4 stream items archived'
- id: AC-7
  text: 'FR-0007 (comment discipline into the kits): the rule of DEC-0008 / SR-0008
    -- a comment carries the WHY and points at items; a property claim becomes a test
    the comment names; a named test must resolve; no sentence claims a check the code
    does not build -- stands in the three constitutions and in every implementing
    role definition (developer, bookkeeper, researcher roles as the kit''s contract
    names them) as a duty with its measured case, byte-identical where shared; the
    kits ship the mechanical half this repo has (a pointer sweep over the project''s
    own code and role texts: a named test or item that does not resolve is red), scaffolded
    and measured on a pilot per kit; what stays human (a claim naming no test) is
    said so in the text'
invariants:
- 'A verdict without a measurement is not a verdict: every closed item names the test
  or the re-run line that closed it'
- The kernel is the only writer of state; a bug is closed by a transition with evidence,
  never by editing a file
- 'Superseded means named: an item absorbed by another names it in resulting_item
  or supersedes'
out_of_scope:
- Building fixes for old bugs that still reproduce and are larger than a line -- they
  get their re-measured chain and stay open for a later goal
- The deferred block (backlog system, provider & environment) -- its own planning
  round
priority: high
