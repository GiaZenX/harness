id: BUG-0309
title: Der Preis-Leser der Stufentabelle liest nicht jede Preis-Schreibweise und meldet
  einige Nicht-Preise (Rest von TSK-0151 R2-3b, nach DEC-0102 (2) neu eingereicht
  statt ein drittes Mal verbreitert)
related_pr: PR-0012
observed: 'MEASURED 2026-09-25 (TSK-0151 verifier round 2, R2-3b; rework 3). **Mechanism.**
  `tools/test_model_ladder.py` `PRICE_RX` reads a price as an amount bound to money
  by an ADJACENT marker (a currency sign, a currency name derived from the Unicode
  `Sc` names directly after the amount, three capitals beside it) or an amount per
  a count of tokens. It was widened in rework 2 and rework 3 (R2-3a, optional figure
  after `per`). **Not read (measured on the reader):** ''15 US dollars'', ''15 Swiss
  francs'', ''usd 15'', ''fifteen dollars'', ''15 input / 75 output per 1M''. **Read
  although no price:** ''Codex CLI 0.131'' -> ''CLI 0.131'', ''GPT6'', ''API 2'',
  ''USE 4'' (three capitals + figure), ''2 marks'', ''4 colons'', ''1 currency'',
  ''3 mill'' (words a currency sign''s Unicode name carries), ''a 3/k split'' -> ''3/k'',
  ''1 / M'', ''5 per k'', ''8 / thousand'' (an amount before `per` or `/` and a bare
  size word, opened by R2-3a''s optional figure; verifier round 3, F3-1), ''per token
  context'' -> ''per token'', ''see docs/tokens.md'' -> ''/tokens'' (the slash of
  the same alternative, a path). **Chain.** A price written in one of the unread spellings
  into team-kits/model_tiers.yaml passes `test_the_tier_table_carries_no_price_and_says_what_each_rung_is_for_bug_0306`;
  a false hit turns that test red on honest text and forces a rewording. Today''s
  file: no hit (the node is green).'
expected: Either a reader that decides 'price' from a definition covering the unread
  spellings without the false hits, measured red-first on each spelling above, or
  DEC-0114 (3) held by another means than a prose reader (the class answer of DEC-0112).
repro: cd tools && python -B -c "import test_model_ladder as m; print([h.group(0)
  for s in ('15 US dollars','Codex CLI 0.131') for h in m.PRICE_RX.finditer(s)])"
  -- prints ['CLI 0.131'] only
severity: low
acceptance_criteria:
- id: AC-1
  text: each spelling named under observed is decided by the reader as a price or
    as prose the way the text means it, measured red-first, or the reader is retired
    for another holder of DEC-0114 (3)
source: project_memory/staging/TSK-0151/verify-round-2.md R2-3; project_memory/staging/TSK-0151/protocol.md
  section Rework 3
limits: Eine Preisangabe in einer seltenen Schreibweise (etwa '15 US dollars') wuerde
  der Test der Stufentabelle nicht bemerken; umgekehrt meldet er ein paar harmlose
  Woerter mit Zahl (etwa 'CLI 0.131') faelschlich als Preis, dann muss nur der Satz
  umformuliert werden. Kein Auftrag wird dadurch falsch gestartet oder abgelehnt.
