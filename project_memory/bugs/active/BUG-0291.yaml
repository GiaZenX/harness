id: BUG-0291
title: 'H40 neu aufgelegt (Ausnahme nie freigegeben): Vertragszitationen außerhalb
  der `.py`-Quellen von `.claude/hooks/` liest kein Stolperdraht (neu, TSK-0058)'
related_pr: PR-0012
observed: 'Migrated 2026-09-05 as H40 into BUG-0132 with status ACCEPTED_EXCEPTION
  and approval null -- the user never saw a question for it (measured 2026-09-12 over
  archive/bug/*). Original finding: **Mechanismus:** Der TSK-0058-Stolperdraht (`test_no_statement_here_cites_a_replaced_contract_on_its_own`)

  findet die Zitation eines abgelösten Vertrags in den literalen Strings und Kommentarblöcken
  der

  `.py`-Dateien von `.claude/hooks/` — und nur dort. Vertragsprosa lebt aber auch
  in der

  Registrierung (`.claude/settings.json`, `_comment`), in den Rollendefinitionen

  (`.claude/agents/*.md`), in `CLAUDE.md` und in `docs/`. Keine dieser Flächen liest
  ein Draht:

  eine dort stehende Lebendzitation eines archivierten Vertrags altert unbemerkt.
  Zweite,

  schmalere Grenze im selben Draht (gemessen, TSK-0058-Prüfung F4): eine Zitation,
  die erst zur

  **Laufzeit** aus Teilen zusammengesetzt wird (f-String, `%`-Formatierung), ist auch
  in den

  `.py`-Quellen unsichtbar — nur die implizite Literal-Konkatenation wird gefaltet
  und gefangen.'
expected: 'CLOSED red-first by stream C with a test that NAMES this bug id (DEC-0100);
  fix location: .claude/hooks/test_gates.py: the contract-citation tripwire widened
  to registration, roles, CLAUDE.md, docs. If the attempt measures it unclosable here,
  the downgrade carries the measurement and a plain-German sentence (never ''later'').'
repro: 'read BUG-0132 (status ACCEPTED_EXCEPTION, approval: null); the mechanism:
  docs/holes/H40.md'
severity: medium
