id: BUG-0240
title: Die Rückschau hat keinen Ereignis-Auslöser; der Pflichtenmelder kennt nur die
  Periode (neu, TSK-0123, FR-0084)
related_pr: PR-0003
observed: '**Mechanismus.** FR-0084 verlangt eine Rückschau, die an EREIGNISSEN hängt
  — eine Phase ist zu Ende,

  etwas wurde gemergt oder ausgeliefert, eine Befundklasse wiederholt sich, die Prämisse
  einer

  Entscheidung hat sich bewegt. Gebaut ist ein Takt: `_routine.audit_period_id` ist
  die ISO-Woche, und

  `_routine.routine_duties` beantwortet „ist der Lauf fällig" allein aus dem Datum
  und dem Laufprotokoll

  in `project_memory/.audit/hook_events.jsonl`. Kein Anlass geht in diese Antwort
  ein — weder macht er

  den Lauf fällig, noch räumt er ihn ab.'
severity: medium
hole_number: H158
source: docs/holes/H158.md
limits: 'die Rückschau hängt an Anlässen, gebaut ist ein Takt: `_routine.routine_duties`
  antwortet allein aus Datum und Laufprotokoll. Gemessen je Kit über zwei Projekten
  desselben Tages — eines leer, eines mit einem auf `DELIVERED` gelaufenen Ziel: ohne
  Laufprotokoll dieselbe Pflicht Wort für Wort, mit Laufprotokoll beide still (`tools/test_review_procedure.py::test_no_occasion_makes_the_audit_run_due_and_that_is_the_seam`).
  Die Verdrahtung liegt in `hooks/_routine.py` + `session_status.py`, dem verbotenen
  Bereich dieses Stroms. Begrenzt durch: Schritt UND Rollendefinition sagen die Grenze,
  beides gemessen'
