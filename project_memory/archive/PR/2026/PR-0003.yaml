id: PR-0003
title: Das V2-Harness ist auslieferbar
class: technical_enabler
problem: 'Der V2-Umbau hat eine Reihe gemessener Luecken hinterlassen, die einzeln
  klein und zusammen entscheidend sind: Waechter, die rohen Text statt der aufgeloesten
  Zeichenkette lesen, Felder ohne Schreiber, eine Ableitung, die nur direkte Aufrufe
  findet, und eine CI, die ihr Linter-Ergebnis nicht reproduziert. Sie leben bisher
  in Aufgabenlisten und Prosaabschnitten und haben deshalb keinen Stand.'
goal: 'Jede gemessene Luecke hat ein Item mit Stand: entweder geschlossen, oder als
  bewusst mitgelieferte Luecke entschieden. Vor einer Freigabe ist die Liste der offenen
  Punkte lesbar statt rekonstruierbar.'
acceptance_criteria:
- Kein bekannter Befund lebt ausschliesslich in Prosa oder einer Aufgabenliste.
- Jede offene Luecke ist entweder ein BUG mit Stand oder eine DEC, die sie bewusst
  in Kauf nimmt.
- doctor meldet keine Faehigkeit als unverified, ohne dass ein Item den Grund traegt.
- Der Pilot ist gefahren und seine Befunde sind eingearbeitet.
invariants:
- 'Ein Befund wird benannt, nicht geglaettet: wo eine Luecke bleibt, steht die Luecke
  da und nicht ein Satz, der Schutz behauptet.'
out_of_scope:
- Rueckwirkendes Nachtragen des gesamten V2-Umbaus als Backlog -- nur Befunde bekommen
  Items.
priority: high
status: ACCEPTED
