id: FR-0072
title: 'A humanizer skill for every kit: texts a role writes for people (product copy,
  letters, reports, chat replies) read as written by a person, not by an AI'
request_text: 'User wish 2026-09-02 during the FR survey, verbatim intent: wir brauchen
  generell noch sowas wie einen humanizer skill fuer alle kits. Weiss nicht welchen
  Agenten, aber es geht darum Texte so zu formulieren dass sie menschlich klingen
  und nicht nach KI; gibts da schon gute skills im Internet? Scope: a shared REFERENCE
  skill (FR-0071 model: one procedure skill per role, any number of shared references)
  that the text-writing roles open -- office product-editor, marketing-planner, the
  correspondence capability of FR-0033, research report-writer, and the PM for user-facing
  replies (CLAUDE.md already demands plain language for the user; this is the craft
  half of that rule). What exists in-house: the July adoption of frontend-design brought
  a UX-writing paragraph (errors do not apologise, verb consistency) into the designer
  skill; the value-language rule of TSK-0093; nothing about voice, rhythm, cliche
  avoidance for prose. To research first (Sonnet, read-only): well-regarded, LICENSED
  skills or style references for de-AI-ing text -- the tells (uniform sentence length,
  hedging stacks, listicle reflexes, em-dash overuse, closing summaries, empty intensifiers),
  German-language guidance in particular (the users texts are German), and whether
  any existing skill assumes direct user dialogue or memory (our specialists have
  neither). Then decide: vendor (with license duties) or write our own from measured
  tells. Per DEC-0056 the mechanism is a skill (prose), and the measured error is
  the user reading his own shop copy and hearing a machine -- name that as the test:
  a before/after on real product copy the user judges.'
