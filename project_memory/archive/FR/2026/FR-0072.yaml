created: '2026-09-02T07:35:56'
triage_result: 'RESEARCHED 2026-09-02 (Sonnet, read-only, sourced): ten GitHub candidates
  measured via gh api (license, size, activity); Anthropic skills repo holds nothing
  on prose voice beyond the frontend-design UX-writing paragraph already adopted;
  internal-comms/doc-coauthoring assume live user dialogue. VERDICT: write our own
  reference skill, do not vendor -- every read candidate (harshaneel/humanize MIT,
  Aboudjem/humanizer-skill MIT, blader/humanizer MIT 39k stars but Wikipedia-only
  sourcing, theclaymethod/unslop license contradictory, marmbiz/humanizer-de MIT,
  jurigis/avoid-ai-writing-multilingual MIT) assumes a multi-pass dialogue with the
  user that our roles never have, and the strongest are lists of 42-72 phrases that
  age with the next model. Build on measured PROPERTIES instead: sentence-length variance
  (burstiness), dash/colon density (Economist/McGill: GPT-4.1 at 3.28x human rate
  over 55,940 sentences), hedging stack depth, discourse-marker frequency, rule-of-three
  (Barrons count 50 -> 200+ in Fortune-500 filings), plus a German layer learned from
  marmbiz/jurigis: Nominalstil vs Verbalstil, Anglicisms, MISSING Modalpartikel (schon/mal/ja)
  as a German-only tell; KONVENS 2024 paper Irrgang et al. on German LLM text detectability
  located (full text not read). Wikipedia Signs of AI writing is CC BY-SA -- orientation
  only, not copy. No runtime linters (DEC-0056: a prose skill). The FR own test stands:
  before/after on the user real shop copy, judged by him.'
resulting_item: TSK-0111
source: 'MEASURED 2026-09-05 (TSK-0131, PR-0008 AC-2) against b7f282e: the skill this
  wish asked for ships in ALL THREE kits (team-kits/*/skills/humanizer/), and a scaffold
  of a dev pilot installs it (''[ok] skill: humanizer'' in the installer output of
  tools/test_pointer_sweep.py''s pilot run). What is still open is not this wish but
  the TASTE verdict on its output, which DEC-0080 records as a question for the user.
  Delivered by TSK-0111.'
