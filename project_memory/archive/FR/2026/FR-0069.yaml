id: FR-0069
title: 'A design BRIEF before any design work: read the existing repo first, then
  ask the user only what cannot be derived from it'
request_text: 'User request 2026-08-31, in the same breath as FR-0068: ''ausserdem
  ist vor dem Design immer wichtig fragen zu stellen was man erreichen will mit dem
  Design und worum es geht (worum es geht laesst sich meist aus einem bestehenden
  repo auslesen) aber einfach informationen usw sind wichtig da einfach einiges klarzustellen.''
  The rule he states is the valuable half and is stronger than a questionnaire: READ
  FIRST, ASK ONLY WHAT IS NOT DERIVABLE. What exists today, measured in the Canyon
  audit: exactly ONE user question before design work -- the design ambition (skills/project-manager/SKILL.md
  5(a0), recorded as a DEC; Canyon''s DEC-0001 shows it working). What is missing:
  purpose, audience, tone, what it must NOT become, existing brand assets, and the
  duty to derive from the repo before asking. Canyon shows the cost of the gap from
  the other side too: the PM turned a PROCESS rule (no hardcoded shop data, DEC-0002)
  into a VISIBLE design instruction (placeholder marking) and destroyed the draft
  -- his own DEC-0011 records it; a brief that separates ''what the design must achieve''
  from ''how the code must be written'' would have caught that. Design questions for
  the round, open: which brief fields are derivable (stack, existing palette/typography,
  product vocabulary, current site) vs must be asked; whether the brief is a typed
  artifact (a DEC, or fields on the design task) or prose in the ambition decision;
  and how it stays ONE user interaction rather than an interview -- the entry gate''s
  lesson is that a non-developer answers a few good questions well and a long list
  badly. Per DEC-0056 the mechanism must name the measured error it catches (this
  one is measured twice in Canyon: no brief beyond ambition, and a process rule leaking
  into the visual instruction) and its cost to the legitimate path.'
