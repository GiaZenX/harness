id: BUG-0222
title: Die BUILD-Hälfte der Standard-Härtung ist nicht gebaut, weil ihre beiden Wirtsdateien
  in ein fremdes Kit gespiegelt sind (neu, TSK-0119, FR-0077)
related_pr: PR-0003
observed: '**Mechanismus.** `FR-0077` verlangt die mechanisch prüfbaren Hälften; die
  Synthese verortet C1/C2/C3

  im schon gebooteten `browser_smoke()` und B3 (Farbliterale im Anwendungscode) auf
  dem Walker

  `kit_checks._frontend_sources()`. Beide Wirtsdateien liefern **dev-team und research-team

  byte-gleich** aus, `research-team/**` stand im `forbidden_scope` von TSK-0119, und
  eine einseitige

  Änderung bricht die Spiegelregel (`tools/test_hooks.py::test_shared_kit_files_identical`).

  Gebaut wurde deshalb die frühere Stelle: der gestagte DSN-Entwurf, dessen Renderer
  `dev-team`

  allein ausliefert.'
