id: BUG-0058
title: 'P4-2: idle dispatched specialist goes unnoticed -- PM waits turn after turn
  without checking'
observed: 'Pilot 4 half 2 (docs/pilot/2026-08-22-pilot-4-befunde.md): the dispatched
  backend-developer made 2 harmless tool calls and produced no file; the PM answered
  nine consecutive user turns with waiting phrases without a single follow-up call;
  the task stayed IN_PROGRESS with a living lease and empty staging. First runnable
  result NOT reached in 46 user actions. Measured on sonnet override; whether the
  shipped fable PM shows it is unmeasured.'
expected: The apparatus notices a background specialist that produces nothing (progress
  check on lease/staging age before another waiting answer) and re-drives or honestly
  fails the task instead of reporting it as running.
repro: Pilot 4 half 2 S4, transcript ferienwohnung-*.jsonl under v2-testbed/_round-scratch/TSK-0066/half2/
  -- dispatch, then nine waiting turns, zero follow-up calls; task IN_PROGRESS, no
  staging dir
severity: high
related_pr: PR-0001
acceptance_criteria:
- A dispatched task whose specialist has produced no staging output within a measurable
  bound is surfaced to the PM (and by the PM to the user) instead of being reported
  as running
- The re-measure runs on the shipped fable PM pin, not a model override
