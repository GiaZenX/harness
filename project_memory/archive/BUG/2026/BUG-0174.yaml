id: BUG-0174
title: Was die interne Sicht-Schleife für Design-Entwürfe NICHT bindet — offen, gemessene
  Grenzen (TSK-0099)
related_pr: PR-0003
observed: '**Anlass:** `BUG-0076`, live im echten Projekt des Nutzers (Canyon, 2026-08-30,
  Kit 2026.08.24-7):

  der PM legte dem Nutzer zweimal eine Design-Fassung vor, die niemand je gerendert
  hatte. Beide

  Runden wurden an Dingen abgelehnt, die nur Pixel zeigen; danach hat der NUTZER selbst
  die interne

  Screenshot-Prüfung angefordert. Gemessen am ausgelieferten Kit: jede Screenshot-Pflicht
  hing an

  „after implementation", die Entwurfsphasen sagten nur „iterate with the user", und
  die Rolle

  Product-Designer hatte gar kein Kommando-Werkzeug. Die Runde baut `gate_design_sighted`
  (dev-team,

  `PreToolUse(AskUserQuestion)` + `SubagentStop`), `scripts/kit_design_render.py`
  und gibt dem

  Designer `Bash`.'
severity: low
hole_number: H82
source: docs/holes/H82.md
limits: Die Regel „kein Entwurf zum Nutzer, den niemand angesehen hat“ ist gebaut
  und gemessen; die Reste sind Fragen, wie weit eine Schutzregel einer Rolle hineinreden
  darf.
