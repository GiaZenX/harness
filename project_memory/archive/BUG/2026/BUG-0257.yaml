id: BUG-0257
title: Der Zeiger-Sweep kann eine ILLUSTRATION nicht von einem Zeiger unterscheiden
  -- und den Bestand eines fremden Stores nicht vom eigenen
related_pr: PR-0008
observed: 'MECHANISM: `kernel.report.pointer_sweep` reads a backtick span and asks
  two questions -- does this test node resolve in the tree, does this item id resolve
  in THIS store. A span that teaches by example (''write it as `tests/perf/test_pricing.py::test_p95`'')
  and a span reporting about ANOTHER project''s store (a pilot log naming that pilot''s
  `PROC-0001`) have exactly the shape of a citation that rotted, and no property of
  the span separates them. MEASURED 2026-09-05 over the kit''s own source repository:
  26 findings, of which 17 are of those two kinds (14 item ids of a pilot''s or a
  fixture''s store; 3 example test nodes) and 9 genuinely dead (DEC-0001 x7 -- the
  id BUG-0020 deleted from this store -- and tools/conftest.py::V1_MONOLITHS x2).
  SEPARATED FROM THIS ITEM AND CLOSED IN THE SAME ROUND (verifier round 1, B1/R2):
  the OTHER noise class the first cut had, kit-installed material inside the project,
  is not this one. It was measured on fresh scaffolds -- 39 (dev) / 27 (office) /
  30 (research) findings with no line of the project''s own code, all inside `.agents/`,
  `.codex/`, `scripts/` and office `tools/` -- and closed by `installed_kit_paths`;
  the clean pilots now answer rc 0 with 0 findings. What remains of that class is
  the script directories, which have their own item (BUG-0265, H183).'
expected: 'A sweep whose findings are all actionable, or a way for a document to say
  ''this span is an example, not a pointer'' that is not a magic word a writer has
  to remember. Neither is built: the obvious escape (a marker in the span) is the
  sort of spelling this repository keeps paying for, and the obvious narrowing (skip
  records under docs/) would silence the two genuinely dead classes above, which live
  in exactly those files.'
repro: PYTHONPATH=team-kits python -B -m kernel.cli --root project_memory sweep-pointers
  -- in the kit's source repository; read the finding list and count the pilot-store
  ids.
severity: low
limits: Ein Beispiel in einem Text und ein echter Verweis auf einen Test sehen genau
  gleich aus. An der Zeichenfolge selbst ist kein Unterschied zu erkennen, also kann
  keine Prüfung die beiden trennen.
acceptance_criteria:
- id: AC-1
  text: A run of sweep-pointers over a project reports only pointers somebody in that
    project can act on -- measured as the share of findings that are neither an illustration
    nor another store's id
- id: AC-2
  text: Whatever separates the two is a property, not a marker word a writer must
    remember, and it is measured red-first
hole_number: H175
