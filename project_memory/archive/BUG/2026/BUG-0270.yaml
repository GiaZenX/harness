id: BUG-0270
title: Der Zeiger-Sweep dieses Repos liest team-kits/ und docs/, nicht tools/ -- 39
  Testzeiger in den eigenen Suiten pruefen nichts
related_pr: PR-0008
observed: 'MEASURED 2026-09-06 (TSK-0131, closing round, self-found). `tools/test_repo_hygiene.py::_texts_that_answer_for_a_claim`
  walks two trees -- measured with its own reader: top-level directories read = [''docs'',
  ''team-kits''], 480 citations judged by `test_every_test_pointer_this_repo_writes_resolves`.
  Over `tools/*.py` a further 39 `<file>::<test>` citations stand that this reader
  never opens; 4 of them resolve at nothing today, and all four are fixture strings
  inside `tools/test_pointer_sweep.py` (illustrations, the class H175 describes).
  THE OCCASION: this round''s own docstring in `tools/test_migrate.py` answered for
  a property with `redfirst.py::receipt-filter-drops-every-decision` -- a rig case
  in the round scratch, which is deleted at round close. No check in this repo could
  have said so, and the shape would not even have been read as a pointer (the reader
  wants a node id whose name starts with `test_`). The docstring was corrected by
  hand in the same round to name the sibling test that really holds the claim.'
expected: The sweep's subject is the PROPERTY its summary line states -- a file of
  this repo that answers for a claim by naming a test -- and the suites under `tools/`
  are such files, so a citation there that resolves at nothing is red like every other.
repro: Read the loop `for top in ("team-kits", "docs")` in `_texts_that_answer_for_a_claim`
  (tools/test_repo_hygiene.py) and count `_test_citations` over `tools/*.py` with
  the same reader.
severity: low
limits: Der Rundgang, der Verweise auf Tests prüft, liest die Testdateien dieses Projekts
  selbst nicht mit. Ihn zu erweitern setzt voraus, dass man ein BEISPIEL von einem
  echten Verweis unterscheiden kann -- und genau das kann niemand (siehe BUG-0257).
  Erweitert man ihn trotzdem, melden vier Beispiele einen Fehler, den es nicht gibt.
acceptance_criteria:
- id: AC-1
  text: A test pointer written in tools/*.py that names no existing test is reported,
    measured red-first with a citation planted in a suite file
- id: AC-2
  text: A fixture string that illustrates the reader (tools/test_pointer_sweep.py)
    is not reported -- the distinction H175 asks for, measured on those four spans
hole_number: H187
