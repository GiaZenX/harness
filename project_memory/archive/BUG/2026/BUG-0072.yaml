id: BUG-0072
title: Kit script einvoice_extract.py returns a non-reconciling net from a real idealo
  ZUGFeRD/CII invoice -- wrong figure would pass silently without the bookkeeper's
  cross-check
related_pr: PR-0003
observed: 'Live use 2026-08-29, the user''s real office project, their store''s BUG-0001
  (project_memory/bugs/active/BUG-0001.yaml there, severity high): scripts/einvoice_extract.py
  -- a KIT TEMPLATE (office-team/templates/repo/scripts/einvoice_extract.py) -- read
  the embedded ZUGFeRD/CII XML of idealo invoice 21263100 and returned net=14.28 while
  tax=40.70 and gross=254.90 were correct. The document states 420 clicks x 0.51 EUR
  = 214.20 net + 19% = 254.90. 14.28 = 28 x 0.51 -- the extractor plausibly read ONE
  line item''s partial quantity or a wrong element instead of the document total.
  The project''s bookkeeper caught it only because the triple did not reconcile, read
  the PDF by hand and booked correct values. The extractor returned the broken triple
  WITHOUT any error -- a wrong figure passes silently wherever nobody cross-checks.'
expected: The extractor returns the document-total net (the value reconciling net
  x (1+vat) = gross within cent tolerance) from CII line/total structures, and FAILS
  LOUDLY when the triple it extracted does not reconcile -- a non-reconciling result
  is a refusal with the three figures named, never a silent return. Fix lands in the
  kit template so every project inherits it via the (now installer-refreshed or pending-list)
  update path; the project-side question 'are earlier booked e-invoices affected'
  (their AC-B2) stays with their office-developer, but the kit fix should name the
  affected extraction path precisely enough that their sweep is mechanical.
repro: Run the kit's einvoice_extract.py against the invoice named in their BUG-0001
  repro (archive/.../2026-08-11_idealo_214,20+40,70_EUR.pdf) or a CII fixture with
  the same multi-line structure; compare returned net against the document.
severity: high
acceptance_criteria:
- id: AC-1
  text: 'red-without-fix: a CII fixture shaped like the idealo case (multi-quantity
    line items) makes the current extractor return the wrong net; the fixed one returns
    the reconciling total'
- id: AC-2
  text: 'the reconciliation guard: any extracted triple with net x (1+vat) != gross
    (cent tolerance, rounding rules named) is a loud failure naming all three figures,
    tested in both directions'
- id: AC-3
  text: the fix is in the kit template and the report names the extraction-path change
    precisely enough that a project-side sweep of already-booked e-invoices is mechanical
