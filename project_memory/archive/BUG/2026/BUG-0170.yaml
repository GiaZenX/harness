id: BUG-0170
title: Ein Startmodus, der die Projekteinstellungen nicht lädt, entfernt den ganzen
  Durchsetzungsapparat — offen, von innen nicht schließbar (TSK-0094)
related_pr: PR-0003
observed: '**Der Mechanismus, in einem Satz** (so formuliert der Prüfer, und so gehört
  er gelesen —

  `--restricted` ist nur die Schreibweise, an der es auffiel): **jeder Client-Startmodus,
  der die

  Projekteinstellungen nicht lädt, entfernt alle vier Registrierungsflächen eines
  Kits, während die

  Dateiwerkzeuge im Projekt schreibfähig bleiben.**'
severity: medium
hole_number: H78
source: docs/holes/H78.md
limits: Es gibt eine Startart von Claude Code, bei der die Projekteinstellungen gar
  nicht geladen werden -- dann sind alle Schutzregeln dieses Projekts aus. Dagegen
  kann das Projekt von innen nichts bauen, denn es läuft dann gar nicht mit.
