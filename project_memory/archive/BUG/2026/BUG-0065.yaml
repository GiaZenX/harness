id: BUG-0065
title: 'gate_ledger_valid: a closing paren ends no word -- a command substitution
  smuggles a write into scripts/ past the protected-dir check'
related_pr: PR-0001
observed: 'Verifier round 2 of TSK-0083, measured through the FULL registered hook
  chain of a scaffolded office project, identical at HEAD (pre-existing): echo with
  a command substitution wrapping ''tar -xf evil.tar -C scripts/'' followed by git
  commit -> rc 0; a subshell wrapping ''cp evil.py scripts/'' followed by git commit
  -> rc 0; backtick form rc 0. Controls without the paren: the same tar and cp lines
  -> rc 2. Mechanism: _SUBSTITUTION_OPEN_RX replaces only the OPENING of a substitution;
  the closing paren stays glued to the target word, and both closers of _PROTECTED_DIR_RX
  accept only whitespace, quote characters, semicolon, pipe, ampersand or end -- a
  paren ends no word for this reader while the shell executes the substitution. The
  gate comment names exactly this tar form as closed.'
expected: 'A write whose target word is terminated by a closing paren (command substitution,
  subshell, process substitution) is judged like the same write without the paren:
  the protected-dir check sees the target, the chain refuses before the commit.'
repro: 'Scaffolded office project, registered PreToolUse chain: echo with command
  substitution around ''cp evil.py scripts/'' then git commit -> rc 0 at HEAD bbf4084
  and after the TSK-0083 rework; control without paren -> rc 2. Measurement rig: v2-testbed/_round-scratch/TSK-0083/verify/cases_r2c.json'
severity: high
acceptance_criteria:
- The four measured rc-0 lines refuse (rc 2) while prose parentheses in arguments
  (a summary containing '1,19 (ok)') stay allowed -- both directions measured as real
  hook processes
- The fix carries a test that is red without it, red seen in a clone outside the repo
- The gate comment that claims the tar form closed either becomes true or is corrected
