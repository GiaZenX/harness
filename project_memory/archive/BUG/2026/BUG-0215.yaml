id: BUG-0215
title: Eine Antwort autorisiert jetzt N Ziele statt eines (neu, TSK-0117, FR-0074)
related_pr: PR-0003
observed: '**Mechanismus.** Bis zu dieser Runde war jede item-gebundene Freigabe an
  GENAU EIN Item gebunden:

  `approvals.assert_apr_in_force` verglich `apr["item"]` mit der Id des Vorgangs,
  und ein `scope`-Ja

  konnte nichts anderes freigeben. Die Plan-Freigabe (`approvals.PLAN_KIND`) bricht
  diese Bindung

  absichtlich: ihr Subjekt ist eine LISTE, und ein einziger Klick lässt jedes Ziel
  darin die Kante

  `DRAFT -> APPROVED` gehen. Damit hängt die Breite der Erlaubnis nicht mehr an der
  Frage, sondern

  an der Zahl der offenen Ziele im Speicher zum Zeitpunkt der Frage.'
severity: medium
hole_number: H132
source: docs/holes/H132.md
limits: Eine Plan-Freigabe kann beliebig viele Ziele auf einmal freigeben; dafür nennt
  die Frage jedes Ziel beim Namen, und ändert sich eines, fällt nur dieses heraus.
  Eine Obergrenze würde Projekte mit vielen Zielen von jeder Plan-Freigabe ausschließen.
