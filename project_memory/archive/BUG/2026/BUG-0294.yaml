limits: 'die Konformitätsbefunde von `kit_design_render.py` verweigern nichts: der
  Renderer meldet sie mit **rc 3** und schreibt `review/render.json` trotzdem, und
  `gate_design_sighted` liest genau diesen Datensatz — der Haken fragt „wurde gerendert“,
  nicht „ist er in Ordnung“. Gemessen: Entwurf mit Kontrast 1,92:1 → Renderer rc 3,
  Haken **rc 0**. Begrenzt durch: Rückgabewert + gedruckter Befund, die drei Rückgabewerte
  einzeln in der `product-designer`-SKILL-Zeile, und die ENFORCEMENT-Zeile, die das
  Nicht-Urteil ausdrücklich sagt. Kein Gate, weil `DEC-0056` (b) für diese Fehlklasse
  keinen gemessenen Fall kennt. Der Nutzer hat die Ausnahme am 2026-09-03 erteilt
  (`DEC-0069`) („melden reicht vorerst“); sie FÄLLT beim ersten echten Fall, in dem
  ein Entwurf MIT Befunden trotzdem gebaut oder eingefroren wurde'
