id: BUG-0026
title: record_deposit_of laesst den Digest weg, waehrend die Abhilfe den Leser die
  Quelle kuerzen heisst -- ein echter Datensatz kann spurlos verschwinden
related_pr: PR-0001
observed: 'Kopie-Pilot TSK-0026 2026-08-11 (docs/pilot/2026-08-11-copy-migration-tsk0026.md),
  echte synaipse-KOPIE, echte Prozesse, Engine aus HEAD c188d5f. team-kits/kernel/migrate.py:358
  (record_deposit_of), Aufrufstelle :2012-2019, Anspruch :274-309 (deposit_of) und
  docs/POST_V2_WISHLIST.md:1490-1496. Fuer einen UEBERGROSSEN Datensatz druckt der
  Trockenlauf: ''COPY it ... to staging/v1-deposit--... Then shorten the record in
  the V1 file itself ... re-run''. Damit aendert sich die Quelle -- das hebt die Praemisse
  auf, aus der deposit_of seine Sicherheit ableitet (''the original stays where it
  is''). overflow_deposit_of (:333) legt fuer genau diesen Fall den sha256 in den
  Namen; record_deposit_of nicht. Gemessene Kette: ADR-0013 dry-run ''21440 bytes/292
  lines'' + Abhilfe; Leser kopiert (Ablage 10556 B), kuerzt den Datensatz zu wenig;
  dry-run erneut ''18155 bytes/244 lines'', DIESELBE Anweisung, DASSELBE Ziel; Leser
  folgt erneut (Ablage 8952 B). 1604 Bytes des Originaldatensatzes stehen danach in
  KEINER Datei mehr. In-Session-Kette. Die gedruckte Zahl ist die Groesse des ITEMS,
  nicht des Datensatztextes, also kann der Leser den Schnitt nicht ausrechnen und
  kuerzt iterativ -- der Normalfall. Kommentar :2007-2011 und WISHLIST :1490 behaupten
  fuer record_deposit_of den Schutz, den nur overflow_deposit_of baut.'
expected: Die Datensatz-Ablage traegt den Digest im Namen (wie overflow_deposit_of),
  sodass zwei verschiedene Kuerzungen zwei verschiedene Ablagen erzeugen und nichts
  ueberschrieben/verloren wird -- ODER die Aufrufstelle fragt _is_occupied/_occupant_digest
  (:616/:627) und druckt bei abweichenden Bytes den Konflikt statt der Abhilfe. Kommentar
  und WISHLIST werden auf das eingeengt, was der Code baut.
repro: Arbeitskopie eines Projekts mit einem uebergrossen Datensatz (synaipse ADR-0013).
  migrate --dry-run -> Abhilfe befolgen (kopieren + Datensatz zu wenig kuerzen) ->
  migrate --dry-run erneut -> dieselbe Anweisung, dasselbe Ziel -> erneut befolgen
  -> Bytes des Originals sind weg.
severity: high
acceptance_criteria:
- id: AC-1
  text: Zwei verschiedene Kuerzungen desselben Datensatzes erzeugen zwei verschiedene
    Ablagen, keine ueberschreibt -- gemessen an echten Bytes
- id: AC-2
  text: 'Ein Test wird ohne den Fix rot: die iterative Kette verliert heute Bytes,
    danach nicht mehr (extern belegt)'
- id: AC-3
  text: Kommentar :2007-2011 und WISHLIST :1490 nennen nur den Schutz, den der Code
    baut -- keine Behauptung breiter als der Bau
status: VERIFIED
