id: BUG-0009
title: Lebenszyklus-Ereignisse zwischen zwei Items werden nicht verlinkt
related_pr: PR-0003
severity: medium
repro: 1. Ein FR nach TRIAGED und dann nach CONVERTED transitionieren und fragen,
  welches Item daraus entstanden ist. 2. Eine Entscheidung durch eine neuere abloesen
  und fragen, welche sie abgeloest hat.
expected: Wo ein Zustandswechsel eine Verbindung zwischen zwei Items STIFTET, haelt
  der Zustand diese Verbindung fest -- so wie derives_from und related_pr die Herkunft
  festhalten. Sonst endet die Spur genau an der Stelle, an der die interessante Frage
  beginnt.
observed: 'Zweimal dieselbe Klasse, beide am 2026-08-04 gemessen. (a) FR: alle drei
  Endzustaende CONVERTED, MERGED, REJECTED sind Endstationen, aber kein Pflichtfeld
  nennt das Ergebnis. Der Kommentar in backlog_types sagt ausdruecklich, CONVERTED
  heisse ''becomes a PRD'' -- welcher PRD, steht nirgends. Es gibt eine statusabhaengige
  Pflicht FR.triage_result ab TRIAGED, aber der Vertrag zwingt sie nicht, ein Item
  zu NENNEN. (b) DEC hat ueberhaupt keinen Automaten und verlangt title, context,
  decision, consequences, source -- kein Feld fuer ''loest ab''. Die Abloesung ist
  das EINZIGE Lebenszyklus-Ereignis, das eine Entscheidung hat, und sie laesst sich
  nur in Prosa im context ausdruecken, also nicht abfragen. Praktische Folge: niemand
  kann fragen ''welche Entscheidungen gelten noch'' oder ''was wurde aus diesem Wunsch''.'
acceptance_criteria:
- Ein FR im Zustand CONVERTED oder MERGED nennt das Item, in das es aufgegangen ist;
  validate setzt das durch.
- Eine DEC kann eine aeltere ausdruecklich abloesen, und die abgeloeste ist als solche
  erkennbar, ohne dass jemand Prosa liest.
- Je ein Test wird rot, wenn die Verlinkung fehlt.
- Die Frage 'welche Entscheidungen gelten noch' ist aus dem Zustand beantwortbar --
  gemessen, nicht behauptet.
status: VERIFIED
