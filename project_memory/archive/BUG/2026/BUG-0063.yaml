id: BUG-0063
title: 'Ultrareview bug_001: _ENTRY_POINT_RUN_RX trailing lookahead scans the whole
  tail -- honest argument prose with '' -m''/'' -c''/'' -e'' re-refuses the P4-12
  shape'
related_pr: PR-0001
observed: 'Cloud ultrareview 2026-08-23 on bbf4084, reproduced locally against the
  shipped module: gate_ledger_valid._ENTRY_POINT_RUN_RX ends in a negative lookahead
  for a whitespace-preceded -c/-e/-m word that scans EVERYTHING after scripts/harness.py
  up to the next newline. Measured: python scripts/harness.py evidence --summary ''fixed
  the -m flag handling in scripts/ledger_add.py'' -- entry-point match None, _writes_protected
  True; the same line without '' -m '' is False. Same lookahead class in _LEDGER_ADD_RUN_RX
  one pattern above.'
expected: The c/e/m payload guard binds to interpreter options BEFORE the script (which
  _INTERPRETER_OPTIONS already refuses); a -c/-e/-m word AFTER the script name is
  an argument the script's own parser owns, not an interpreter payload, so argument
  prose carrying those words passes the exemption exactly as P4-12 requires.
repro: import gate_ledger_valid as g; g._writes_protected(line with --summary containing
  ' -m ' and naming scripts/ledger_add.py) -> True; without ' -m ' -> False. Measured
  2026-08-23 on HEAD bbf4084.
severity: medium
acceptance_criteria:
- The reproduced line (and the -c/-e variants) passes the exemption while a genuine
  interpreter payload before the script (python -c ..., python -m scripts.harness)
  stays refused -- both directions measured, test red without the fix
- The same defect class in _LEDGER_ADD_RUN_RX is fixed or its absence measured
- Mirrors byte-identical or KIT_SPECIFIC_HOOKS names the reason
source: cloud ultrareview 2026-08-23 (origin/feat/harness-v2..bbf4084), finding bug_001
