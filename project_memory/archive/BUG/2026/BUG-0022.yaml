id: BUG-0022
title: 'Der CR-Typ wird nie erreicht: Aenderungen am schon Gebauten laufen als PR-Ersatz
  plus TSK'
related_pr: PR-0001
observed: 'Pilot Runde 4 (RPG mit UI, 2026-08-11, docs/pilot/2026-08-11-runde4-rpg-auswertung.md):
  eine DEC-0031-Persona, gebaut um Change Requests auszuloesen, kritisierte zweimal
  konkret Sichtbares am gebauten Spiel (leerer Waffen-Slot, roter Ablegen-Knopf).
  Beide Male entstand KEIN CR: changes/active/ ist nach zwei Sitzungen leer, grep
  nach ''^id: CR-'' findet nichts im Pilotzustand. Stattdessen ersetzte der PM den
  PR (PR-0001 -> PR-0002 -> PR-0003, Vorgaenger archiviert) und legte SR-0009/SR-0011/TSK-0005
  an. Schon TSK-0029 (Tradingbot) zeigte CR-Items nur in der PLANUNGSphase; eine Aenderung
  an GEBAUTEM erreichte den Typ noch nie.'
expected: Eine Aenderung an etwas bereits Gebautem laeuft als CR-Item durch dessen
  Automaten (DRAFT -> APPROVED -> APPLIED), statt die Produktwurzel zu ersetzen. Der
  PR-Ersatz-Weg verliert die Historie der Aenderung als eigenes Item und macht den
  CR-Typ zu totem Vertrag.
repro: Kit installieren, Vorhaben bis zu lauffaehigem Stand bauen lassen, dann als
  Nutzer eine konkrete Aenderung am Gebauten verlangen (UI-Detail). Beobachten, ob
  ein CR-Item entsteht oder der PR ersetzt wird.
severity: medium
acceptance_criteria:
- id: AC-1
  text: Ein Aenderungswunsch am Gebauten erzeugt in einem echten Lauf ein CR-Item,
    gemessen am Pilotzustand
- id: AC-2
  text: Die Verfassung/das Playbook des PM sagt, WANN CR statt PR-Ersatz gilt, und
    ein Test misst die Regel am laufenden Text-zu-Verhalten-Weg oder der CR-Typ wird
    mit Begruendung entfernt (kein toter Vertrag)
- id: AC-3
  text: Der PR-Ersatz-Weg bleibt fuer echte Neuausrichtungen moeglich und dokumentiert
    den Ersatz im Zustand
status: VERIFIED
revision: 1
