id: BUG-0246
title: Ein Modulname in Backticks wird als Testzitat in ein Loch-Item geschrieben
  (neu, TSK-0126, DEC-0073)
related_pr: PR-0003
observed: '**Mechanismus.** `tools/migrate_holes.cited_tests` sammelt jede Backtick-Spanne,
  deren letztes

  Glied nach `::` oder `.` mit `test_` beginnt. Ein Modul heisst in diesem Repo nach
  demselben Muster wie ein Test, also

  erfuellt schon sein blosser Name die Bedingung. Die Spanne landet als `regression_tests`
  im Item,

  und erst der Richter danach merkt, dass mehr als ein Test auf den Namen hoert.'
severity: medium
hole_number: H164
source: docs/holes/H164.md
limits: '`tools/migrate_holes.cited_tests` liest jede Backtick-Spanne als Testzitat,
  deren letztes Glied mit `test_` beginnt — ein MODULname erfuellt das. Gemessen in
  einer `.git`-losen Kopie des gemergten Baums (`_round-scratch/TSK-0126/migrated_judges.py`):
  die Spanne test_gates (hier bewusst ohne Auszeichnung) in der Prosa von `H159` wurde
  als `regression_tests` in das Item geschrieben, und `.claude/hooks/test_gates.py::test_every_test_a_hole_names_is_one_that_exists`
  meldete danach „names test_gates, and 2 tests answer to it“ — 1 failed, 6 passed;
  nach der Korrektur der Prosa 7 passed. Der Fund kommt also NACH dem Schreiben des
  Items, und der Lauf ist idempotent (`tools/test_migrate_holes.py::test_a_second_run_over_the_same_document_writes_nothing`),
  also repariert ein zweiter Lauf ihn nicht. Begrenzt durch: der Richter ist fail-closed
  und laut, die Merge-Runde faehrt die Migration erst als Probelauf gegen eine Kopie,
  und in dieser Generation ist die einzige betroffene Spanne vor dem schreibenden
  Lauf korrigiert (152 von 152 Eintraegen gruen). NICHT begrenzt: dieselbe Schreibweise
  in einem spaeteren Eintrag'
regression_tests:
- tools/test_migrate_holes.py::test_a_second_run_over_the_same_document_writes_nothing
