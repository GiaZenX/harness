id: BUG-0158
title: '`shell_readings` sagt „jede Lesart" zu und liefert nur die POSIX-Lesart —
  offen, Loch, vorbestehend (benannt TSK-0083)'
related_pr: PR-0003
observed: '**Mechanismus:** `_compat.shell_readings` verspricht im eigenen Kommentar
  „EVERY reading an

  ordinary shell could give the text" und führt `_ESCAPE_CHARS = (''\\'', ''`'')`.
  Gebaut ist nur die

  POSIX-Backslash-Lesart. PowerShells Fluchtzeichen — der Backtick — wird von keiner
  Lesart

  aufgelöst, also sieht jeder Leser, der auf `shell_readings` aufsetzt, einen Pfad,
  den die Shell

  so nie zusammensetzt. Das betrifft **jedes** Gate, das über diese Funktion urteilt,
  nicht nur

  das Ledger-Gate; sichtbar wurde es dort.'
severity: medium
hole_number: H66
source: docs/holes/H66.md
limits: '`_compat.shell_readings` sagt „jede Lesart, die eine gewöhnliche Shell dem
  Text geben könnte" zu und liefert nur die POSIX-Backslash-Lesart; PowerShells Backtick
  als Fluchtzeichen wird von keiner Lesart aufgelöst. `copy-item evil.py scr` + Backtick
  + `ipts/ ; git commit -m x` ist rc 0, die Kontrolle ohne Backtick rc 2. Betrifft
  jedes Gate, das über `shell_readings` urteilt, nicht nur das Ledger-Gate'
