id: BUG-0178
title: Was die Bestandsklassifikation NICHT sieht — offen, gemessene Grenzen (TSK-0101)
related_pr: PR-0003
observed: '**Anlass:** `FR-0044`/N13. Der Installer klassifizierte den vorgefundenen
  Bestand gar nicht; die

  Seitenkontrolle vom 2026-08-16 konnte den No-write-Nachweis nicht führen, weil ihr
  ein echter

  V1-Bestand fehlte (§5.6). Die drei Feldkopien unter `C:/Offline Repos/v2-pilot`
  SIND welche —

  gemessen 2026-09-01: alle drei tragen `.claude/kit_version` und `.claude/team_kit_roles.txt`
  wie ein

  V2-Projekt (der Vor-Kernel-Installer schrieb beide, `git show 9e4419b~1:team-kits/scaffold_team.sh`),

  und keine einzige Datei liegt im Bereich des Kernels. Was der Leser in ihnen findet,
  als

  Datensatz für alle Leser dieser Zahl: **synaipse 632** V1-Backlog-Datensätze in
  7 Monolithen

  (`tasks.yaml` 264, `system_requirements.yaml` 224, `decisions.yaml` 69, `feature_requests.yaml`
  48,

  `product_requirements.yaml` 17, `change_requests.yaml` 6, `bugs.yaml` 4), **portfolio
  285** in

  denselben 7, **BuyPlugGo 16** in `process_definitions.yaml`. Die Gegenmessung mit
  dem Installer VOR dieser

  Runde, gegen dieselbe synaipse-Kopie: rc 0, 128 neue Dateien, 64 geänderte, eine
  gelöschte

  (`.claude/hooks/auto_dashboard.py`), `.claude/kernel` installiert — über einen Zustand,
  den kein

  V2-Kommando lesen kann und in den danach kein Werkzeug mehr schreiben darf. Nach
  der Runde: alle

  drei rc 1, Baum-Hash vorher/nachher identisch (1602 / 4010 / 2590 Dateien).'
severity: low
hole_number: H86
source: docs/holes/H86.md
limits: Die Erkennung alter Datensätze hat drei gemessene Grenzen; sie zu schließen
