id: BUG-0054
title: architecture_refs is hashed in the delivery manifest and has no producer --
  a second freeze_architecture leaves the approval in force
related_pr: PR-0001
observed: 'TSK-0069 side check N3a (live, measured with a counter-probe that CAN fail):
  a second freeze_architecture (and freeze_wireframe) -> approvals.assert_apr_in_force
  says STILL IN FORCE, root revision stays 1. Counter-probe in the same mechanism:
  freeze_design writes design_refs, the field is in _SCOPE_FIELDS, and the approval
  dies. Cause: the delivery manifest hashes architecture_refs (kernel/approvals.py:329-337)
  but freeze_architecture (kernel/staging.py:223-268) never writes the field -- it
  writes only the companion item. The code concedes it itself (approvals.py:544-548:
  NO command on this surface produces any of them) without an item and without a test.'
expected: 'The freeze records the frozen revision in the root item''s architecture_refs;
  the EXISTING hash mechanics then bite and clause E16 is met. An ordinary fix: the
  field is already in the manifest -- no hash redefinition, no living approval dies,
  it merely gains a writer. The same intake covers planned_tasks, risks, system_requirements
  (delivery) and delivered_commit, evidence_refs (acceptance).'
repro: 'Freeze architecture twice against an APPROVED root; assert_apr_in_force still
  passes -- probe_e16.py as a test with pytest.raises(ApprovalError) after the second
  freeze: green-false today, red without the fix.'
severity: medium
acceptance_criteria:
- id: AC-1
  text: freeze_architecture writes the frozen revision into the root's architecture_refs;
    a second freeze invalidates the approval (red-without-fix via the E16 probe)
- id: AC-2
  text: the other producer-less hashed fields named in approvals.py:544-548 are either
    given writers in the same stroke or carried as named residues with reasons
