id: BUG-0070
title: 'add-filing-rule refuses to CREATE the rules list it may append to -- an old-stock
  filing_plan.yaml sends the non-developer user into a text editor (BUG-0041 dead-end
  class, live find #2)'
related_pr: PR-0003
observed: 'Live use 2026-08-29, the user''s REAL office project (OneDrive/4-BuyPlugGo,
  kit 2026.08.24-16): the PM ran the sanctioned add-filing-rule path with a minted
  approval (APR-0003) and hit: ''filing_plan.yaml carries 0 top-level rules: key(s);
  this kernel appends to exactly one and refuses to guess which.'' The chain: (1)
  the project''s filing_plan.yaml predates the rules mechanism (July-era kit) and
  carries no rules: key; (2) the kit update deliberately never touches project_memory,
  so it never retrofits the key; (3) gate_write_scope refuses every agent write under
  project_memory, so the PM cannot add the line; (4) the kernel command only APPENDS
  to an existing top-level rules list -- refusing to guess between SEVERAL lists is
  right, but with ZERO lists there is nothing to guess and it still refuses. Net:
  the only hands allowed to write ''rules: []'' are the user''s, and the PM had to
  ask him to open the file in an editor -- the BUG-0041 dead-end class (prose promises
  a route the gates forbid; the remainder lands in the user''s editor), second live
  occurrence after BUG-0068. Eleven documents stood read and verified, nine filing-ready,
  ALL blocked on that one hand-typed line.'
expected: 'The sanctioned path covers the empty case: add-filing-rule creates the
  top-level rules: list when the plan carries NONE (unambiguous -- there is nothing
  to guess), keeps refusing when it carries more than one, and says which it appended
  to when it carries exactly one. Alternatively (or additionally) the kit update names
  old-stock plans without a rules: key in its pending/migration surface so the gap
  is retrofitted on update instead of discovered at first filing approval. Either
  way: no user-typed editor line on the sanctioned path.'
repro: 'Scaffold or copy an office project whose filing_plan.yaml has no top-level
  rules: key; mint the approval; run add-filing-rule -- the kernel refuses with the
  0-keys message; no agent may write the file; the PM escalates to the user''s editor.'
severity: medium
acceptance_criteria:
- id: AC-1
  text: 'add-filing-rule with a plan carrying ZERO top-level rules: keys creates the
    list and appends the rule, measured end to end on an old-stock copy outside the
    repo; red-without-fix reproduces today''s refusal'
- id: AC-2
  text: the >1-keys refusal stays (red test), and the =1 path is unchanged (existing
    tests stay green)
- id: AC-3
  text: the refusal/creation message promises only what the code builds; if the update-flow
    half is also built, the pending surface names an old-stock plan without the key
status: VERIFIED
revision: 1
