id: BUG-0180
title: Der Rollback ist byte-gleich nur über die aufgezeichnete Menge, und ältere
  Sicherungen tragen keine — offen, gemessen (TSK-0101)
related_pr: PR-0003
observed: '**Anlass:** `FR-0041`/N8, zweite Hälfte. Der Installer schrieb seine Sicherungen
  seit jeher nach

  `.claude/backups/<stempel>`, aber kein Befehl spielte sie zurück, und die Sicherungsliste
  und die

  Wiederherstellungsliste im Skript waren zwei getrennte Aufzählungen. Jetzt ist es
  EINE Menge

  (`RESTORABLE` / `$restorable`), die Sicherung schreibt sie als `RESTORE_SET` IN
  die Sicherung, und

  der Rollback spielt die Menge, die die damalige Sicherung aufgezeichnet hat.'
severity: low
hole_number: H88
source: docs/holes/H88.md
limits: 'der Rollback ist byte-gleich nur über die aufgezeichnete Menge; ältere Sicherungen
  tragen keine und werden mit Grund verweigert statt geraten, und die Rückstandsliste
  des NEUEN Kits überlebt seine Rücknahme. (a3) neu und nachgemessen: ein ABSOLUTES
  Wort in der `RESTORE_SET` wird von den Zwillingen verschieden beantwortet (rc 0
  bzw. rc 1 über eine unbehandelte Ausnahme), kein Zwilling schreibt außerhalb. (a4)
  GESCHLOSSEN in TSK-0104: eine Manifestzeile, die weder in `RESTORABLE` steht noch
  eine Kopie in der Sicherung hat, wird vor dem ersten Löschen verweigert (beide Zwillinge,
  rot-zuerst); Rest: ein fremdes Manifest nur aus `RESTORABLE`-Pfaden bleibt ununterscheidbar,
  und über den Kopie-Zweig auch eine `KEPT_ONLY`-Datei (`.claude/settings.local.json`)
  mit der älteren Kopie überschreibbar'
regression_tests:
- tools/test_kitupdate.py::test_neither_twin_replays_a_snapshot_that_points_out_of_the_repository
- tools/test_kitupdate.py::test_a_rollback_restores_the_previous_bundle_byte_for_byte
- tools/test_kitupdate.py::test_an_aborted_install_puts_the_trust_record_back_with_the_bundle
- tools/test_kitupdate.py::test_neither_twin_replays_a_manifest_line_it_does_not_own
