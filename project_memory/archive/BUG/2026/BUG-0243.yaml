id: BUG-0243
title: Der Schwestertest von Gate 1 misst seine eigene Dimensionierung mit (neu, TSK-0125,
  BUG-0033)
related_pr: PR-0003
observed: '**Mechanismus.** `.claude/hooks/test_gates.py::test_gate1_answers_before_its_registration_however_long_the_line_takes_to_read`

  baut seine Zeile mit `_a_line_too_long_to_read_in(...)` **innerhalb** der Spanne,
  die es stoppt und

  gegen die registrierte Frist hält — dieselbe Form, die beim Gate-3-Zwilling dazu
  führte, dass der

  Knoten auf diesem Host **solo** rot war (4,54–4,62 s gegen eine 4,50-s-Registrierung,
  während

  derselbe Gate-Prozess mit außerhalb gebauter Zeile 3,26–3,31 s brauchte).'
severity: medium
hole_number: H161
source: docs/holes/H161.md
limits: '`.claude/hooks/test_gates.py::test_gate1_answers_before_its_registration_however_long_the_line_takes_to_read`
  baut seine Zeile INNERHALB der Spanne, die es gegen die registrierte Frist haelt
  -- dieselbe Form, die den Gate-3-Zwilling auf diesem Host solo rot machte. Nicht
  mitgeaendert, weil dieser Strom in `test_gates.py` genau EINEN Test aendern darf.
  Begrenzt durch die Messung: die Dimensionierung kostet hier 0,03-0,04 s gegen 1,03-1,19
  s beim Zwilling, schiebt den Knoten also heute nicht ueber seine Frist'
