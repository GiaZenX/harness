id: BUG-0086
title: 'Kernel: the task-origin check falls OPEN on ambiguous parentage -- an item
  with two parents gets _root_of None and dispatch skips the root comparison, in every
  kit (verifier B2 / H95)'
related_pr: FR-0029
observed: 'Stream D verifier 2026-09-01, scaffolded research project via scripts/harness.py:
  EXP-0004 with two parents under RQ-0001 -> _root_of = None; create-task under RQ-0002
  --derives-from EXP-0004 -> rc 0 TSK-0004 DRAFT; validate 0 errors. Control: single-parent
  EXP-0005 under RQ-0002 -> rc 1 (refused correctly). Cause: report.py:934-941 returns
  parents[0] only when len(parents) == 1 else None, and dispatch.py:176-177 tests
  origin_root truthiness before comparing -- None means skip. Not research-specific:
  every type whose parent field may be a list (SR.derives_from) hits it in every kit.
  Does NOT vanish with the H92 fix (verifier closed H92 in a clone; this path stayed
  rc 0). A task judged against another root criteria is exactly what _assert_task_origin_matches_root
  was written to prevent.'
expected: 'Ambiguity fails CLOSED: an origin with several parents must hang from the
  task root through EVERY parent (or the check refuses with the ambiguity named),
  and validate reports it. Fix together with the H92 bug since both live in the same
  two functions.'
repro: See observed; verifier rig _round-scratch/TSK-0103/vrig/proj.
