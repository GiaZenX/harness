id: BUG-0231
title: Eine Naht kann noch immer breiter sein als das, was zwei Aufträge wirklich
  teilen (neu, TSK-0117 Nacharbeit 1, DEC-0062)
related_pr: PR-0003
observed: '**Mechanismus.** `kernel.scopes` subtrahiert die deklarierte Naht, bevor
  es ein Paar beurteilt, und

  verweigert seit der Nacharbeit eine Deklaration, die einem der beiden Aufträge **keine**
  eigene

  Ownership übrig lässt (`owns_anything_outside`). Das fängt den Totalfall (`**`,
  oder eine Liste

  aller Einträge). Es fängt NICHT die Zwischenstufe: eine Naht, die mehr abdeckt als
  das, was die

  beiden wirklich gemeinsam haben, solange jedem noch irgendein Pfad bleibt.'
severity: medium
hole_number: H148
source: docs/holes/H148.md
limits: 'eine deklarierte Naht darf breiter sein als das, was zwei Aufträge wirklich
  teilen. `kernel.scopes.owns_anything_outside` verweigert nur den Totalfall — eine
  Naht, die einem der beiden Aufträge KEINE eigene Ownership lässt. Mit `check-scopes`
  als Prozess gemessen: `**` auf beiden → rc 2 („NOT A SEAM … owning nothing of its
  own“), `docs/**` bei zwei Aufträgen, die nur `docs/**` besitzen → rc 2, `team-kits/**`
  bei Aufträgen mit eigenem Rest → **rc 0**, die echte Naht `team-kits/*/VERSION`
  → rc 0. Begrenzt durch: beide Aufträge müssen sie deklarieren, sie ist mit dem Arbeitsauftrag
  eingefroren, und jede zugedeckte Zeile wird einzeln gedruckt. NICHT geschlossen,
  weil die naheliegende Regel („nicht mehr als die tatsächliche Schnittmenge“) die
  legitime Glob-Naht `team-kits/*/VERSION` verbieten würde. ZWEITE Restklasse, gemessen:
  `pair_seam` schneidet Zeichenketten, `_matches` vergleicht Dateimengen — `docs/`
  und `docs/**` sind demselben Prädikat dieselbe Menge und der Naht zwei Nahtangaben,
  also rc 2 mit der gewöhnlichen OVERLAP-Meldung statt eines Hinweises auf die Schreibweise.
  Fail-closed, kein Loch — eine schlechtere Auskunft'
