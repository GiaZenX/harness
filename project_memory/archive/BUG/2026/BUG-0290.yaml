id: BUG-0290
title: 'H39 neu aufgelegt (Ausnahme nie freigegeben): Endzustände, die dieses Repo
  nicht ehrlich erreichen kann: TSK `DONE`, BUG `VERIFIED` (neu, TSK-0055)'
related_pr: PR-0012
observed: 'Migrated 2026-09-05 as H39 into BUG-0131 with status ACCEPTED_EXCEPTION
  and approval null -- the user never saw a question for it (measured 2026-09-12 over
  archive/bug/*). Original finding: **Mechanismus:** zwei Kernel-Wächter setzen Bedingungen
  voraus, die nur ein installiertes Kit

  erfüllt, und dieses Repo betreibt bewusst keins (DEC-0003). Erstens verweigert

  `state.py::_transition_locked` jeden direkten Übergang IN einen lease-gestützten
  Zustand

  (`dispatch.assert_lease_backed_transition_locked`); die TSK-Kette führt über `LEASED`
  und

  `IN_PROGRESS`, also sind `DONE` und `VALIDATED` ohne echtes Dispatch unerreichbar.
  Zweitens bindet

  `approvals.APPROVAL_TRANSITIONS` die Kante `BUG TRIAGED→APPROVED` an eine Freigabe
  in Kraft;

  gemünzt wird die über den PostToolUse-Haken der Kits auf der AskUserQuestion-Antwort.
  **Bis

  TSK-0098 führte die Registrierung dieses Repos nur die eigenen Gates**, und die
  gedruckte Abhilfe

  der Verweigerung („Frage weiterreichen, die Antwort münzt") hatte hier keinen Zuhörer;
  seit

  TSK-0098 steht der Haken der Kits auf beiden AskUserQuestion-Ereignissen — wirksam
  ab dem nächsten

  Sitzungsstart, siehe den Absatz am Ende dieses Eintrags.'
expected: 'CLOSED red-first by stream C with a test that NAMES this bug id (DEC-0100);
  fix location: tools/ + .claude/hooks/test_gates.py: which end states this repo reaches
  today, measured. If the attempt measures it unclosable here, the downgrade carries
  the measurement and a plain-German sentence (never ''later'').'
repro: 'read BUG-0131 (status ACCEPTED_EXCEPTION, approval: null); the mechanism:
  docs/holes/H39.md'
severity: medium
acceptance_criteria:
