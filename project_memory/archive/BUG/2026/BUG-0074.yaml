id: BUG-0074
title: freeze-* empties the ENTIRE staging folder of the task -- three unfrozen wireframes
  deleted alongside the one being frozen (dev-team live find, data loss)
related_pr: PR-0003
observed: 'Live use 2026-08-29, the user''s real dev project (Canyon_3.4.0, dev-team
  kit): freezing a wireframe cleared project_memory/staging/TSK-0001/ WHOLE -- WFR-0002/0003/0004.drawio.svg,
  still unfrozen work, were deleted together with the frozen one''s staging copy.
  Recoverable ONLY because a chore commit (6226326) happened to carry them; the PM
  restored them via its write tool from the commit and reported the behaviour as a
  defect. gate_write_scope behaved correctly throughout (refused the shell restore,
  allowed the tool route). The freeze command treating the task''s staging directory
  as ''consumed'' is a silent-deletion class: staging/ is the ONE tool-writable area
  under project_memory, so whatever lies there is by definition work no other route
  holds.'
expected: 'A freeze consumes exactly the artifact it freezes (moves/records it) and
  leaves every other file in the task''s staging area untouched; if the design intent
  was ''freeze closes the proposal area'', that is a DIFFERENT contract and must (a)
  be said in the command''s output BEFORE acting, (b) refuse when unconsumed files
  would be lost, or (c) archive rather than delete. Red-without-fix: stage several
  artifacts, freeze one, the others must survive (or the command must refuse loudly).'
repro: Dev project, several WFR files in staging/<TSK>/, run the freeze on one of
  them; the staging folder is emptied.
severity: high
acceptance_criteria:
- id: AC-1
  text: freezing one artifact leaves the task's other staging files byte-identical,
    measured end to end on a scaffolded project; red-without-fix reproduces the wipe
- id: AC-2
  text: if any path still clears the area, it refuses or archives first and says so
    before acting -- no silent deletion of the one tool-writable workspace
- id: AC-3
  text: all three freeze commands (architecture, design, wireframe) measured, not
    just the one that bit -- same code path or not is a finding, not an assumption
status: VERIFIED
