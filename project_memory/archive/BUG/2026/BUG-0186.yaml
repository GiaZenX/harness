id: BUG-0186
title: Der gerenderte Forschungsbericht hatte keinen Schreibweg, während der Merge
  auf ihm bestand — Weg gebaut (TSK-0106), Verfassungszeile offen
related_pr: PR-0003
observed: '**Mechanismus:** Die research-Verfassung §6 gibt `reports/EXP-*.{tex,pdf,html}`
  und

  `reports/fzulg_application_RQ-*.md` dem **Report-Writer**; §17 macht den gerenderten
  Bericht zur

  Vollständigkeitsbedingung eines Experiments. Der Merge hängt daran:

  `report._check_experiment_reports` (`report.py:1543-1560`) meldet als **error**,
  was in `ANALYZED`

  steht und **leere** `evidence_refs` hat, und `gate_memory_complete` liest den Validator
  auf der

  Merge-Zeile. Gleichzeitig verweigert `gate_write_scope` jeden Werkzeug-Schreibzugriff
  unter

  `project_memory/` und macht für dieses Fach keine Ausnahme — §0 der Verfassung sagt
  das

  ausdrücklich.'
severity: medium
hole_number: H94
source: docs/holes/H94.md
limits: der Schreibweg existiert und ist gemessen (`freeze-report`, `staging.freeze_report`);
  begrenzt wird der Rest dadurch, dass §6/§17 den Befehl nicht NENNEN — ein Report-Writer
  muss ihn heute von der Kernel-Hilfe erfahren. Seam-Item für Stream E, sonst nichts
  offen
