id: BUG-0041
title: 'A preset change after install is a dead end for non-developers: no writer
  for project_config.yaml, the remedy is Notepad plus terminal plus restart'
related_pr: PR-0003
observed: 'Pilot 3 (B4): the entry session wrote preset: duo without asking (B2);
  when the persona needed the designer role, the PM had to send a non-technical user
  to edit project_config.yaml in Notepad, run the scaffold in a terminal and restart
  -- she failed at step one (''diesen Ordner gibt''s bei mir gar nicht'', ''einen
  Terminal-Button seh ich nirgends''). Measured catch: the PM de-escalated to a decision
  (pilot project''s DEC-0001: continue without the designer). Mechanism: after install,
  gate_write_scope refuses every tool write under project_memory/ incl. project_config.yaml,
  and the scaffold is human-only -- the reported gap lands with the one person who
  cannot operate it. Same family as BUG-0016/0017 (the entry window''s structural
  dead ends).'
expected: 'A preset/role change in a running project has a walkable path for a non-developer:
  a kernel command the PM may drive (approval-gated where it changes enforcement),
  or an explicit, honest ''this needs a technical hand'' flow that does not pretend
  Notepad+terminal is a user path. The interview asks the preset question it claims
  to confirm (closes B2 in the same stroke).'
repro: 'Kit project as a non-developer persona: ask for a role the preset lacks ->
  the PM''s only remedy today is manual file edit + scaffold + restart.'
severity: high
acceptance_criteria:
- 'AC-1: a measured, walkable preset-change path exists for the PM (kernel command
  or equivalent), approval-gated where enforcement changes'
- 'AC-2: the entry interview asks and records the preset (B2 closed, red-without-fix
  on the missing question)'
- 'AC-3: the old dead-end remedy no longer appears in any shipped text (measured over
  the kits)'
- 'AC-4: full suite green, stamps moved'
source: TSK-0027 pilot 3, findings B4+B2; pilot project's DEC-0001 documents the lived
  de-escalation
