id: BUG-0236
title: Die Migrationstuer schreibt einen Endzustand ohne die Evidenz, die die Kante
  verlangt (neu, TSK-0122)
related_pr: PR-0003
observed: '**Mechanismus.** `state.capture_migrated_hole` schreibt einen Loch-Datensatz
  direkt in den Status,

  den sein Urteil schon hatte. Fuer ein geschlossenes Loch ist das `VERIFIED` — ein
  Status, den die

  gewoehnliche Kante nur mit einer nutzergeminteten Freigabe UND einer bestandenen
  Test-Evidenz

  erreicht (`state._assert_confirmed`, `approvals.APPROVAL_TRANSITIONS`). Die Tuer
  geht an beidem

  vorbei.'
severity: medium
hole_number: H154
source: docs/holes/H154.md
limits: 'die Migrationstuer `state.capture_migrated_hole` schreibt einen ENDZUSTAND
  -- `VERIFIED` darunter -- ohne die bestaetigende Evidenz, die `state._assert_confirmed`
  auf der gelaufenen Kante verlangt, und ohne die Freigabe, die davor steht. Begrenzt
  durch vier gebaute Bolzen: sie schreibt nur einen Koerper mit `hole_number` (das
  Feld verweigert `capture` einem Aufrufer), nur einen Status, den der Automat hat,
  einen terminalen ausschliesslich in den ARCHIVBAUM -- wo `report.validate_state`
  nicht urteilt und kein Gate eine Autorisierung liest --, und eine bereits vergebene
  Nummer wird zurueckgegeben statt ueberschrieben, was einen zweiten Lauf wirkungslos
  macht. Gemessen an einer Kopie des Repos: jeder Eintrag der Liste geschrieben, zweiter
  Lauf unter einer Sekunde und rc 0 ohne eine einzige Aenderung, Dokument byte-identisch,
  `validate` danach ohne einen einzigen zusaetzlichen Befund. Rot ohne den Fix: `tools/test_state.py::test_the_migration_door_writes_a_hole_and_refuses_everything_else`.
  ZWEITE Restklasse, gemessen (Pruefung Runde 1, F20): der Speicherleser `state._iter_every_stored_item`
  schluckt eine Leseausnahme, also verschwindet ein Loch-Item mit kaputtem YAML lautlos
  aus allen drei Pruefern — gemessen an H156 mit zerstoertem YAML: `.claude/hooks/test_gates.py::test_every_hole_states_a_verdict_and_an_unclosed_one_names_its_limit`
  rc 0. Fuer ein AKTIVES Item meldet `report.validate_state` die unlesbare Datei;
  fuer ein ARCHIVIERTES meldet es niemand. Begrenzt durch: die Datei liegt unter git,
  ihr Verschwinden aus dem Index ist ein Diff, und der Index wird aus dem Speicher
  regeneriert — ein geloeschtes Loch faellt beim naechsten `--reindex` als fehlende
  Zeile auf'
regression_tests:
- tools/test_state.py::test_the_migration_door_writes_a_hole_and_refuses_everything_else
- .claude/hooks/test_gates.py::test_every_hole_states_a_verdict_and_an_unclosed_one_names_its_limit
