id: BUG-0192
title: Eine Evidenz, die ihren Laufumfang GAR NICHT erklärt, zählt weiter als Volllauf
  (neu, TSK-0106, FR-0040)
related_pr: PR-0003
observed: '**Mechanismus.** `EVD` trägt seit dieser Runde ein Laufprotokoll (`run_command`
  + `run_scope`,

  `backlog_types.RUN_SCOPES`), und `report._delivery_evidence` lässt einen PASS, der
  sich als

  `selection` erklärt, nicht mehr als Merge-Beleg durch. Das Feld ist OPTIONAL, und
  daran hängt der

  Rest: eine Evidenz, die nichts erklärt, wird behandelt wie vor der Änderung. Ein
  Teillauf, der

  schweigt, öffnet also weiterhin einen Merge.'
severity: medium
hole_number: H108
source: docs/holes/H108.md
limits: 'eine Evidenz, die GAR KEINEN Laufumfang erklärt, zählt weiter wie bisher
  — die Erklärungspflicht lässt sich auf einem unveränderlichen Typ nicht nachträglich
  erzwingen. Begrenzt: neue Evidenz kann die Erklärung tragen (`--run-scope`), und
  ein erklärter Teillauf öffnet keinen Merge mehr; der Rest ist eine Vertragsentscheidung
  (erfasst als `DEC-0061`, VALID)'
regression_tests:
- test_report.test_a_pass_from_a_partial_run_is_not_merge_evidence_and_a_fail_still_is
