id: BUG-0089
title: 'kernel `update` refuses a frozen work-order field with the remedy ''transition
  the task back to DRAFT'' -- but the TSK automaton forbids READY -> DRAFT (allowed:
  CANCELLED, LEASED); the printed remedy cannot be walked'
related_pr: FR-0074
observed: '2026-09-02, TSK-0107 (READY): `kernel.cli --root project_memory update
  TSK-0107` with a body changing expected_outputs prints ''TSK-0107 is READY -- its
  work-order fields (expected_outputs) are frozen outside DRAFT ... Remedy: transition
  the task back to DRAFT to re-plan it, or CANCEL it and create a new one''. `transition
  TSK-0107 DRAFT` then prints ''illegal transition TSK: READY -> DRAFT (allowed from
  READY: CANCELLED, LEASED)''. The first half of the remedy is a sentence about an
  edge that does not exist.'
expected: 'Either the automaton owes a READY -> DRAFT edge for visible re-planning
  (then the refusal is right and the edge is missing), or the refusal names only the
  walkable remedy (cancel + new item). In both cases the remedy text is DERIVED from
  AUTOMATA (the edges that exist from the item''s current state), not written as prose
  beside it -- the same defect class as every enumeration CLAUDE.md names: the sentence
  outlived the table.'
repro: 'In any state directory with a READY TSK: pipe `{"expected_outputs": ["x"]}`
  into `python -B -m kernel.cli --root <state> update <id>`; read the remedy; run
  `transition <id> DRAFT`; observe the illegal-transition refusal.'
acceptance_criteria:
- the refusal of a frozen-field update names only transitions that exist from the
  item's current state, read from AUTOMATA at refusal time
- a test plants a state whose automaton has no DRAFT edge and asserts the remedy does
  not name DRAFT (red without the fix)
- 'if a READY -> DRAFT edge is added instead: it is in AUTOMATA, the update refusal
  still derives from it, and the index/brief rollups treat the returned item as re-planned,
  not as new'
severity: low
source: 'project_memory/staging/generation-2-streams.md, log 2026-09-02 16:5x; lead
  path taken: TSK-0107 kept as the historical order, TSK-0113 carries the re-cut work
  order'
