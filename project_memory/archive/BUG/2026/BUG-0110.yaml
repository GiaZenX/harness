id: BUG-0110
title: Das Repo als Operand eines Kopier- oder Archivbefehls gilt als Schreibzugriff
  (TSK-0008, korrigiert TSK-0011)
related_pr: PR-0003
observed: '**Mechanismus:** ob eine Stufe lesend ist, beantwortet die Klassifikation
  der **Kits**

  (`gate_write_scope._stage_is_read_only`), und `cp`, `robocopy`, `xcopy` und `tar`
  sind dort nicht

  lesend — zu Recht, denn sie schreiben ihr Ziel. Gate 1 sammelt daraufhin **alle**
  Wörter der Stufe.

  Der Eintrag hieß bis 2026-08-05 „das Repo als **Quelle**"; das war zu eng. Betroffen
  ist **jeder**

  Operand, der einen geschützten Baum berührt — auch das **Ziel**: `cp -r docs ..`
  hat keine

  geschützte Quelle, und der Zielpfad ist ein **Vorfahre** des Repos. Diese zweite
  Hälfte ist H19.'
severity: low
hole_number: H18
source: docs/holes/H18.md
limits: 'an OVER-refusal, not a hole: nothing gets through, a read-only line is turned
  away. `cp`, `robocopy`, `xcopy` and `tar` are not read-only to the kits'' own classification
  -- rightly, they write their target -- so gate 1 collects EVERY word of such a stage,
  source and target alike. What it costs is a refused copy whose operand names a protected
  tree. The way round it is measured and cheap: spell the copy as a Python script
  under the round''s scratch root (`C:/Offline Repos/v2-testbed/_round-scratch/<TSK-ID>/`),
  which CLAUDE.md prescribes anyway, or run it from a shell outside the session.'
status: ACCEPTED_EXCEPTION
