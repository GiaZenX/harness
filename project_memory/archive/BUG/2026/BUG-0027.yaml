id: BUG-0027
title: Die gedruckte READY-Zeile der Migration laesst die Flags weg, mit denen der
  Plan gebaut wurde
related_pr: PR-0001
observed: 'Kopie-Pilot TSK-0026 2026-08-11. team-kits/kernel/migrate.py:2545 baut
  ''READY: python scripts/harness.py migrate --plan %s'' allein aus plan_digest(plan);
  build_plan nahm field_map und archive_year entgegen, die in den Plan-Digest eingehen.
  Die eine Copy-Paste-Zeile nennt keines der Flags. Gemessen (portfolio, echter Prozess):
  READY-Zeile woertlich -> rc 2 ''this run is not the run the dry run presented ...
  cannot tell you WHICH of them moved''. Kein Schaden (Digest faengt es), aber die
  Zeile ist immer falsch, sobald ein Flag im Spiel war (2 von 3 Kopien). tools/test_migrate.py
  hat keine Zusicherung ueber den Inhalt dieser Zeile.'
expected: Die READY-Zeile ist ausfuehrbar wie gedruckt -- sie nennt die Flags (--archive-year,
  jedes --map), aus denen build_plan gerufen wurde, oder wird aus derselben Quelle
  gebaut wie die --map-Remedy im selben Bericht.
repro: migrate --dry-run mit --archive-year und/oder --map gegen ein Projekt, das
  sie braucht -> die gedruckte READY-Zeile woertlich ausfuehren -> rc 2.
severity: medium
acceptance_criteria:
- id: AC-1
  text: Die gedruckte READY-Zeile laeuft wie kopiert, auch wenn Flags im Spiel waren
    -- gemessen an einem echten Lauf
- id: AC-2
  text: Ein Test sichert den Inhalt der READY-Zeile gegen die Plan-Bauflags -- rot
    ohne Fix
