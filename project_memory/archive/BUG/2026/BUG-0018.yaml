id: BUG-0018
title: harness.py capture verstuemmelt Nicht-ASCII auf der Windows-Default-Codepage,
  und die Unveraenderlichkeit treibt daraus Wurzelitem-Drift
related_pr: PR-0001
observed: 'Gemessen 2026-08-09/10 in den Pilotlaeufen. Der Einstiegsagent hat den
  Bug SELBST dokumentiert: pilot-1-vokabeltrainer/project_memory/decisions/active/DEC-0001.yaml
  title ''harness.py capture corrupts non-ASCII (German umlauts) on this Windows shell'';
  sein Workaround war PYTHONUTF8=1 PYTHONIOENCODING=utf-8. Der erste Versuch trug
  im Rohbyte-Strom ein doppelt kodiertes u-Umlaut (die UTF-8-Bytes von ''fuer'' ein
  zweites Mal durch Latin-1 gejagt).


  FOLGE ueber die Unveraenderlichkeit (L2): ein verstuemmeltes Feld laesst sich nicht
  korrigieren, also wird ein neues Wurzelitem gepraegt. Die Einstiegsdatei verlangt
  GENAU EIN Wurzelitem, nummeriert -0001. Gemessen endet pilot-1 auf PR-0003 aktiv
  (0001/0002 archiviert), pilot-2 auf PR-0002 aktiv -- Drift weg von -0001, deren
  Ursache die capture/supersede-Runden aus dem Encoding-Workaround sind. Ein Nutzerprojekt
  startet damit mit ein bis zwei toten Items.


  Die Endzustaende sind nur deshalb sauberes UTF-8, weil DERSELBE Lauf den Bug fand
  und umging. Ein Nutzer, dessen Agent den Workaround nicht entdeckt, bekommt Korruption
  in kanonischem Zustand.'
expected: harness.py capture schreibt Nicht-ASCII korrekt, unabhaengig von der Codepage
  der aufrufenden Shell -- ohne dass der Aufrufer PYTHONUTF8/PYTHONIOENCODING setzen
  muss. Damit entfaellt zugleich die Wurzelitem-Drift, weil kein Encoding-Workaround
  eine supersede-Runde ausloest.
repro: 'Auf einem Windows-Host mit nicht-UTF-8-Default-Codepage: capture PR mit einem
  title, der einen Umlaut enthaelt. Danach die Rohbytes des erzeugten Items pruefen:
  enthalten sie doppelt kodierte oder Ersatzzeichen-Bytes?'
severity: high
acceptance_criteria:
- id: AC-1
  text: Ein capture mit Umlaut im title erzeugt auf der Windows-Default-Codepage sauberes
    UTF-8 in der Item-Datei -- gemessen an den Rohbytes, ohne dass der Aufrufer eine
    Encoding-Umgebungsvariable setzt
- id: AC-2
  text: Ein Test wird ohne den Fix rot und faehrt capture wirklich mit nicht-ASCII-Inhalt,
    statt den Quelltext zu durchsuchen
- id: AC-3
  text: Geprueft ist, ob weitere kernel-Schreibwege (evidence, transition, freeze)
    denselben Codepage-Defekt haben
- id: AC-4
  text: 'Die daraus folgende Wurzelitem-Drift ist adressiert: nach dem Fix entsteht
    bei einem Umlaut-Projekt genau ein -0001, kein supersede-Zyklus'
