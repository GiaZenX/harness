id: BUG-0207
title: Eine Löschung mit einer FLAGGE kommt am Archiv-Wächter vorbei — seit TSK-0116
  nur noch, wenn sie im ZIEL löscht (TSK-0113, FR-0050)
related_pr: PR-0003
observed: '**Mechanismus, wie er bis TSK-0116 stand.** `guard_fs_tripwire` hat zwei
  Regeln: eine Löschung

  unter `inbox/` oder `archive/` und eine Bewegung AUS `archive/` heraus. Beide fragten
  nach einem

  Lösch-VERB (`DELETE_VERBS`) am Kopf der Stufe. Ein Befehl, der seine Treffer über
  eine

  FLAGGE entfernt, trägt keines: die Zeile beginnt mit `find`, mit `tar` oder mit
  `python`, und

  die Löschung steht in einem Argument. Seit TSK-0116 gibt es kein `DELETE_VERBS`
  mehr; was an

  seine Stelle trat und was davon übrig bleibt, steht zwei Absätze weiter.'
severity: low
hole_number: H123
source: docs/holes/H123.md
limits: 'die Flaggen-Form ist größtenteils GESCHLOSSEN: seit TSK-0116 liest die Regel
  ein zerstörendes Wort an JEDER Stelle einer Aufrufung, also auch in einer Flagge
  — `find archive -name x.pdf -delete` und `tar --remove-files … archive/…` sind am
  Piloten gegen alle acht registrierten Office-Haken von **ALLOW** auf **rc 2** gemessen.
  OFFEN bleibt genau eine Teilklasse: eine Flagge, die im ZIEL statt in der Quelle
  löscht (`robocopy … /MIR`, `rsync --delete inbox/ archive/2026/`). Der Grund ist
  die REIHENFOLGE der Lesungen — `_filing` erkennt beide als Kopierer, der Kopier-/Bewegungszweig
  beantwortet die Aufrufung und kehrt zurück, bevor nach einem zerstörenden Wort gesucht
  wird. Begrenzt durch: die Klasse steht namentlich im Kopf des Wächters, Verfassung
  und Rollentext zeigen dorthin statt die Wand absolut zu behaupten; die Reihenfolge
  selbst ist beidseitig gemessen (`tools/test_hooks.py::test_a_filing_move_with_a_source_deleting_copier_flag_is_judged_as_a_move`)'
