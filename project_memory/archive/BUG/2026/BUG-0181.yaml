id: BUG-0181
title: Ohne `git` kann die Vier-Augen-Buchung alte von neuen Zeilen nicht unterscheiden
  und tritt zurück (neu, TSK-0102, FR-0065)
related_pr: PR-0003
observed: '**Mechanismus.** `gate_second_booking` urteilt nur über Ledger-Zeilen,
  die noch nicht in `HEAD`

  stehen. Das ist die Migrationsantwort: ein echtes Buch trägt Zeilen, die vor dieser
  Schicht gebucht

  wurden, und ein Mechanismus, der jede davon verweigert, ist schlechter als keiner
  (`FR-0065` sagt

  genau das). Die Grundlinie ist damit nichts Aufgezähltes und nichts, was sich prägen
  ließe — der

  einzige Weg nach `HEAD` ist ein Commit, und der Commit ist einer der Momente, an
  denen dieses Gate

  steht. Wo `git` aber gar nicht antwortet — nicht installiert, oder ein Verzeichnis,
  das kein

  Arbeitsbaum ist —, gibt es diese Unterscheidung nicht.'
severity: low
hole_number: H89
source: docs/holes/H89.md
limits: Ohne die Versionsverwaltung (git) kann die Buchungsprüfung nicht unterscheiden,
  welche Zeilen im Kassenbuch schon vorher dastanden und welche neu sind. Sie tritt
  dann zurück, statt sicherheitshalber alles abzulehnen.
