id: BUG-0305
title: 'Über-Verweigerung der Schreiben-und-Ausführen-Regel: eine reine LESE-Stufe
  mit unbekanntem Kommandowort (`sudo -u me cat tools/ci.sh ; bash tools/ci.sh`) gilt
  als Schreiber, und der Satz behauptet ''this line WRITES tools/ci.sh'''
related_pr: PR-0012
observed: 'MEASURED 2026-09-13 (TSK-0150 verify round 2, real hook processes in all
  three kits; pre-existing at stamp -5, so not a regression of the F2 fix): `sudo
  -u me cat tools/ci.sh ; bash tools/ci.sh` -> rc 2 with ''this line WRITES tools/ci.sh
  and RUNS it in the same call'', likewise `nice -n 19 wc -l tools/ci.sh ; bash tools/ci.sh`
  and `env -i grep -n x tools/ci.sh ; bash …`. Mechanism: the operands of a stage
  whose command word is UNKNOWN (an option after a prefix word) count as WRITTEN even
  when every other word of the stage is read-only; a later stage running the same
  file triggers a refusal whose sentence is factually false. Direction: over-refusal
  (fail-closed). The docstrings of `_the_command_word_is_unknown` (gate_write_scope.py
  x3) and the everyday-twins comment in tools/test_hooks.py claim ''nothing on an
  everyday line'' -- refuted by this line.'
expected: Either the unknown-command-word stage counts as RUN only (not WRITTEN) when
  its remaining words are all classified read-only, red-first with the three lines
  above rc 0 and `sudo -u root tee run.sh <<'EOF' … ; bash run.sh` still rc 2; or
  the two docstrings and docs/holes/H219.md state the over-refusal exactly.
repro: 'in a scaffolded pilot: sudo -u me cat tools/ci.sh ; bash tools/ci.sh -> gate_write_scope
  rc 2 (the line writes nothing).'
severity: low
acceptance_criteria:
- 'AC-1: the three read-only lines are rc 0 while the tee line stays rc 2, measured
  as processes in all three kits'
- 'AC-2: no sentence in the gate or the test claims ''nothing on an everyday line''
  beyond what is measured; H219.md carries the class (not a count of lines)'
source: staging/TSK-0150/verify-round-2.md (new finding)
limits: 'Eine Zeile, die eine Datei nur liest (z. B. `sudo -u me cat tools/ci.sh`)
  und sie danach startet, wird fälschlich abgelehnt, weil der Vorsatz `sudo -u` das
  eigentliche Kommandowort verdeckt. Begrenzt: es geht nichts durch, die Zeile lässt
  sich ohne den Vorsatz sofort ausführen; die Meldung sagt allerdings etwas Falsches
  („schreibt“).'
hole_number: H220
