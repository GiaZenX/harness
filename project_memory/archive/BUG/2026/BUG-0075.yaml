id: BUG-0075
title: 'The document write route exists but the roles that OWN documents are not routed
  onto it -- measured live: the product-editor staged prose in a .md and asked the
  user to paste it into content_guidelines.yaml'
related_pr: BUG-0071
observed: 'Live in the user''s real office project on 2026-08-30, one day after apply-proposal
  shipped (office 2026.08.30-14). The product-editor reworked the source-evidence
  rule for product claims, wrote it as PROSE into staging/<TSK>/claims_policy.proposed.md,
  and told the user: ''Einfuegen: die ueberarbeitete Quellen-Regel liegt in claims_policy.proposed.md
  -- sie ersetzt den bisherigen Abschnitt in content_guidelines.yaml.'' Two defects
  in one message: (1) the role invented a NEW document beside the kit document its
  own constitution section 6 assigns to it, so a second authority for the same rule
  would stand next to content_guidelines.yaml and nothing in the project reads the
  new one; (2) it sent the user back into the text editor -- the exact dead end BUG-0071
  closed the day before. Measured cause: of the six roles that OWN a kit document
  in section 6, FOUR never hear of apply-proposal at all (bookkeeper, compliance-researcher,
  marketing-planner, records-clerk: 0 hits each in their role files). The fifth, product-editor,
  carries it only inside the NOT CONTAINED security paragraph, where it reads as a
  warning about what web text can reach rather than as the instruction ''this is how
  you write your document''; and the phrase there (''stage a whole kit document as
  it should stand'') did not land either -- what was staged was prose, not the YAML
  as it should stand.'
expected: 'A role that owns a kit document knows, from its own definition, that the
  way it changes that document is: stage the document AS IT SHOULD STAND, same file
  name, parseable, and ask the manager for apply-proposal. It never proposes a new
  file beside a kit document, and it never asks the user to paste.'
repro: 'grep -c apply-proposal in the office kit''s six document-owning role files:
  office-manager 1, product-editor 1 (inside the NOT CONTAINED paragraph), bookkeeper
  0, compliance-researcher 0, marketing-planner 0, records-clerk 0. Live message from
  the user''s project quoted in observed.'
severity: high
acceptance_criteria:
- id: AC-1
  text: 'the instruction is a PROPERTY of owning a kit document, derived rather than
    enumerated: a test reads section 6''s ownership table and the role files and fails
    when an owner carries no route -- both directions, so a role that stops owning
    a document also stops needing it'
- id: AC-2
  text: the route says the SHAPE (the document as it should stand, same name, must
    parse) and that a new file beside a kit document is not a proposal; measured red-first
    against the live case
- id: AC-3
  text: 'the round weighs and records what happens to a change apply-proposal deliberately
    refuses (a replacement or a deletion, as in the live case): today that stays the
    user''s own editor step, and the round decides whether the role must SAY so or
    whether a route is owed -- the answer is recorded either way, no third state'
- id: AC-4
  text: the same derivation runs for dev-team and research-team, whose kit documents
    have owners too
status: VERIFIED
