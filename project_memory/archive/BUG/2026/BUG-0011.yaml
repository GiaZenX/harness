id: BUG-0011
title: Ein Satz, der die Abwesenheit des Kit-Markers behauptet, LOEST DIE UEBERGABE
  AUS
related_pr: PR-0003
severity: high
repro: '1. In eine `./CLAUDE.md` den Satz schreiben: ''Dieses Repo traegt bewusst
  KEINEN agents-and-skills:team-kit-Marker.'' 2. Eine Sitzung in diesem Verzeichnis
  starten. 3. Die globale Einstiegsdatei entscheidet ueber die Uebergabe an einen
  Projektmanager allein daran, ob `./CLAUDE.md` die Zeichenkette ENTHAELT.'
expected: Ein Repo ohne Kit wird nicht als Kit-Projekt gelesen -- schon gar nicht
  wegen eines Satzes, der genau das verneint.
observed: 'Anfuehrungszeichen und Verneinung sieht die Regel nicht. Ich habe diesen
  Satz am 2026-08-04 selbst in die CLAUDE.md dieses Repos geschrieben; ein Umsetzer
  fand ihn beim Bauen der vier Gates und hat ihn entfernt. Waere er stehen geblieben,
  haette sich dieses Repo ab der naechsten Sitzung als Projektmanager eines Projekts
  gemeldet, das keines ist -- und die gesamte lokale Arbeitsweise waere durch die
  Uebergaberegel ersetzt worden. Die allgemeine Form: eine Regel, die auf VORKOMMEN
  einer Zeichenkette prueft, wird von jedem Text ausgeloest, der ueber diese Zeichenkette
  SPRICHT. Das trifft Dokumentation, Fehlermeldungen und Tests gleichermassen.'
acceptance_criteria:
- Die Uebergaberegel unterscheidet ein Vorkommen des Markers von einer Erwaehnung
  -- oder die globale Datei sagt ausdruecklich, dass ueber den Marker nirgends geschrieben
  werden darf, und ein Test misst das.
- Ein Test misst, dass eine CLAUDE.md ohne Kit nicht als Kit-Projekt gelesen wird,
  auch wenn sie den Marker erwaehnt.
- Geprueft ist, wo sonst im Harness auf blosses Vorkommen einer Zeichenkette geprueft
  wird -- gemessen, nicht vermutet.
status: VERIFIED
revision: 1
