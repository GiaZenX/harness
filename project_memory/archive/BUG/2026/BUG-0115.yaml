id: BUG-0115
title: Ein unerreichbarer Pfad kostet die Beurteilung, nicht mehr die Frist (neu,
  TSK-0011)
related_pr: PR-0003
observed: '**Mechanismus:** eine Dateisystemfrage zu einem nicht erreichbaren Host
  kostet auf diesem Host

  42,1 s und lässt sich nicht abbrechen. Seit TSK-0011 ist die **Wartezeit** begrenzt:
  `_harness`

  liest die Frist aus der Registrierung und verweigert, wenn eine Frage nicht rechtzeitig

  zurückkommt. Der Rest, der bleibt: eine Zeile, deren Kandidaten das Budget aufbrauchen,
  wird

  **verweigert statt beurteilt** — und sie braucht dafür bis zu vier Fünftel der registrierten
  Zeit.'
severity: low
hole_number: H23
source: docs/holes/H23.md
limits: 'the DEADLINE half is closed and only the judgement is spent: `_harness.Deadline`
  reads the registered `timeout` out of `.claude/settings.json` and refuses BEFORE
  the provider can kill the hook -- which matters because a killed hook is read as
  ''hook error, carry on'', i.e. as an ALLOW (measured 2026-08-05: five candidates
  on unroutable UNC hosts, rc 0 after 211.3 s against a registered 120). What remains
  is that a line whose candidates spend the budget is REFUSED instead of judged, and
  it may take up to four fifths of the registered time to say so. Fail-closed in both
  halves: the answer is never an allow.'
status: ACCEPTED_EXCEPTION
