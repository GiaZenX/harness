id: BUG-0049
title: gate_subagent_output's one-retry pass-through logs 'still missing nothing'
  -- misleading message, and a second consecutive violation would pass unblocked
related_pr: PR-0003
observed: 'Pilot 3 (B13), measured against the hook source (.claude/hooks/gate_subagent_output.py
  of the pilot project, shipped by the kit): on stop_hook_active the hook logs gave_up
  and exits 0 -- a deliberate one-retry pass-through (endless-loop protection). In
  all 8 measured cases the log line said ''still missing NOTHING'', i.e. the retry
  HAD delivered the summary -- the block worked, the message misleads. A second consecutive
  violation would pass unblocked (not hit in this run).'
expected: The gave_up line states what happened ('retry delivered' vs 'giving up with
  X still missing'); the deliberate pass-through is named in the hook's docstring
  with its reason, and the hole list carries it if it stays.
repro: 'Kit project: a subagent ends without the summary contract, retries with it
  -> audit says ''still missing nothing''.'
severity: low
acceptance_criteria:
- 'AC-1: the message is state-accurate (red-without-fix on the misleading line)'
- 'AC-2: the pass-through is either kept-and-named (docstring + hole list) or closed
  by decision'
- 'AC-3: mirrors identical'
source: TSK-0027 pilot 3, finding B13 (hook-source measurement in the verification
  round)
