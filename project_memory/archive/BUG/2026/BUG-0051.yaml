id: BUG-0051
title: gate-suite shell arbitration picks a shell that cannot see this filesystem
  once WSL answers
related_pr: PR-0001
observed: 'test_the_measurement_sandbox_leaves_a_child_shell_no_directory_word_that_names_another_tree
  is red on this host since a WSL distro exists: the caller takes the FIRST bash on
  PATH that runs `true` -- the WSL launcher in System32, which now succeeds (Ubuntu
  + docker-desktop registered, both Stopped, measured 2026-08-15) -- and that shell
  resolves paths inside the WSL filesystem, so the INHERITED control never damages
  the decoy (''no line reached ... not-mine-inherited'', test_gates.py:3104). Suite
  1 failed, 241 passed. The _posix_shells docstring itself says ''which of them sees
  this filesystem is measured by the caller, not assumed here'' -- this caller never
  measures it, so the defect was latent until the host grew a distro.'
expected: the arbiter is a shell MEASURED to see this repo's filesystem (a probe against
  a file the test itself writes, not a hardcoded path and not 'runs true'); with the
  WSL launcher first on PATH the test arbitrates with Git Bash and is green, and the
  control still really damages the decoy so the test stays red-capable for a genuine
  sandbox regression.
repro: On a host with a registered WSL distro (wsl.exe --list --verbose shows one),
  run the single failing test of the repo gate suite -- AssertionError at test_gates.py:3104,
  reproduced in isolation in 5s on 2026-08-15. The WSL launcher answering rc 0 on
  -c true while standing first on PATH is the trigger condition.
severity: high
acceptance_criteria:
- id: AC-1
  text: shell arbitration in test_gates.py selects only a shell measured to see this
    repo's filesystem, as a property probed at selection time, not a path list
- id: AC-2
  text: the failing test is green on this host with the WSL launcher first on PATH,
    and red-capable is shown in a clone by restoring the old selection and watching
    the control fail again
- id: AC-3
  text: every other _posix_shells caller in test_gates.py either arbitrates by the
    same property or is named unaffected with the measured reason
status: VERIFIED
revision: 1
