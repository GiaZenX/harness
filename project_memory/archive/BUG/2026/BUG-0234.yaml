related_pr: PR-0003
observed: '**Mechanismus.** „Diese Zeile fährt die ganze erklärte Fläche" ist als
  Eigenschaft gebaut, mit

  genau einer unvermeidbaren Aufzählung: welche Optionen der Läufer so liest, dass
  die Zeile die

  Fläche NICHT mehr ganz fährt (`options_that_narrow` in `tools/test_surface.json`,
  beim Kit-Haken im

  `INV` mit `scope: test_surface`). Keine Eigenschaft des TEXTES entscheidet das.'
severity: medium
hole_number: H152
source: docs/holes/H152.md
limits: Eine Option, die einen Testlauf verkleinern soll, aber gar nichts trifft,
  lässt die Schutzregel durch. Um das zu erkennen, müsste sie vorher einmal die ganze
  Testsammlung durchzählen -- genau die Kosten, die sie sparen soll. Die versehentlich
  getippte Variante ist zu; die verbleibende muss jemand absichtlich hinschreiben.
