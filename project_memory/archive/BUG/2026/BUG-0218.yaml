id: BUG-0218
title: Der Zeugen-Halbteil der Überlappungsprüfung ist eine Stichprobe, keine Sprache
  (neu, TSK-0118, FR-0021)
related_pr: PR-0003
observed: '**Mechanismus.** Die Überlappungsprüfung (seit TSK-0120 nur noch `kernel.scopes`)
  fragt

  „gehört dieser Pfad beiden Aufträgen?“ mit

  EINEM Prädikat (`gate_write_scope._matches`) über ZWEI Universen: die Dateien, die
  der Baum heute

  trägt, und je einen Zeugen pro Scope-Eintrag. Ein Zeuge entsteht, indem jeder Wildcard-Lauf
  durch

  EIN Platzhalter-Segment ersetzt wird (`src/**` wird `src/_`). Das deckt den häufigen
  Fall — zwei

  Aufträge, die dasselbe noch leere Verzeichnis beanspruchen — und es deckt nicht
  die Sprache: wo

  sich zwei Muster nur in einer Region schneiden, in die kein so gebildeter Pfad fällt,
  sieht die

  Zeugen-Hälfte nichts.'
severity: low
hole_number: H135
source: docs/holes/H135.md
limits: 'die Zeugen-Hälfte der Überlappungsprüfung ist eine STICHPROBE, keine Sprache:
  `witnesses` füllt jeden Wildcard-Lauf mit EINEM Platzhalter-Segment, also findet
  sie eine Überlappung nur dort, wo ein so gebildeter Pfad im anderen Scope liegt.
  Zwei Aufträge, die sich nur in einer Region überlappen, in die kein Zeuge fällt,
  und deren Dateien es heute noch nicht gibt, kommen durch. Gemessen (`_round-scratch/TSK-0118/probe_h135.py`,
  beide Aufträge durch den Kernel erfasst): `a/*x` gegen `a/y*` — **rc 0** bei leerem
  `a/`, **rc 2**, sobald `a/yx` im Baum liegt. Begrenzt durch: die Baum-Hälfte fängt
  denselben Fall ab dem ersten passenden Dateinamen, das Werkzeug verweigert in keinem
  Projekt etwas (Werkstatt-Instrument), und der Schnitt ist nach `DEC-0062` ohnehin
  ein Urteil ohne Gate'
status: VERIFIED
