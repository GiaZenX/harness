id: BUG-0082
title: 'The kits'' gate_write_scope misses a glob-expanded path to the enforcement
  layer: `python .cla*de/hooks/gate_approval.py` is rc 0 where the literal spelling
  is rc 2'
related_pr: BUG-0075
observed: 'Measured 2026-08-31 by the TSK-0098 verifier against the SHIPPED kit gate
  (team-kits/dev-team/hooks/gate_write_scope.py) in a scaffolded proxy project: the
  literal line naming the enforcement layer is refused (''this command names the enforcement
  layer in a pipeline that can write''), but the same line with a glob metacharacter
  in the directory name -- `python .cla*de/hooks/gate_approval.py` -- is rc 0. The
  shell expands it, the gate reads the literal token, and the protected name is never
  spelled. The same class was found in this repo''s own gate 1 in the same round (H80''s
  reopening: glob AND parameter expansion both bypass the start position) and is being
  closed there; the kit half is untouched because team-kits/ was that round''s forbidden_scope.
  NOT measured on the kit side: whether the line then actually mints (the verifier
  stopped at the gate verdict). The workshop-side chain WAS measured end to end to
  a real APR, so the class is proven live, not theoretical.'
expected: A word whose path-like part this reader cannot resolve -- parameter expansion
  ($..., ${...}, $(...)), glob metacharacters (*?[), brace expansion -- is Unplaceable
  and refused fail-closed, the same answer the tilde prefix already gets. The kit
  gate reaches the same verdict for the literal and the expanded spelling.
repro: 'Send both spellings to the KIT''s `gate_write_scope` as a real hook process.
  RE-MEASURED 2026-09-06 (TSK-0131) against b7f282e: `python .claude/hooks/gate_approval.py
  < payload.json` rc 2 (refused), and the glob-expanded twin `python .cla*de/hooks/gate_approval.py
  < payload.json` rc 0. REPRODUCES exactly as observed: the enforcement-layer reader
  does not see a path the shell expands.'
severity: low
