triage_result: 'Downgraded 2026-08-31 on the user''s explicit steer, and the steer
  is right: this class -- forging an approval by driving the approval hook by hand
  -- has no external attacker. The actor would be the agent itself or the lead, inside
  a repo only the user operates. It is a self-discipline property, not a breach path,
  and three rounds of attack/counter-attack on the workshop twin bought no comfort
  the user can feel. Kept OPEN and honest, not closed: the shape that fixes it is
  recorded in TSK-0098''s protocol chapter 12 (_UNRESOLVED + _unresolved_at + the
  position compare in _candidates, ~20 lines, no dependency on the workshop) and is
  cheap to lift whenever a kit round touches gate_write_scope anyway. Do NOT schedule
  a round of its own for it.'
