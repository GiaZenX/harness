id: BUG-0208
title: Die Fristenmeldung liest eine Uhr, die keinem Feld dieses Kits gehört (neu,
  TSK-0113, FR-0034)
related_pr: PR-0003
observed: '**Mechanismus.** `_duties.briefing` nimmt `datetime.date.today()` der lokalen
  Maschine, einmal je

  Sitzungsstart, und vergleicht jede Frist gegen diesen einen Wert. Die Zeitzone des
  Geschäfts steht

  in keinem Feld des Kits, und die Sitzung liest ihre Uhr nicht noch einmal.'
severity: low
hole_number: H124
source: docs/holes/H124.md
limits: 'die Fristenmeldung liest die Uhr der lokalen Maschine einmal je Sitzungsstart
  (`_duties.briefing`, `datetime.date.today()`): eine Sitzung über Mitternacht behält
  die Antwort von gestern, und zwei Maschinen in verschiedenen Zonen antworten im
  selben Moment verschieden. Begrenzt durch: kein Angriff und kein Datenverlust —
  eine Meldung wechselt einen Tag zu früh oder zu spät —, die Tagesgrenze selbst ist
  beidseitig gemessen, und der Nutzer entscheidet ohnehin über jede Frist'
