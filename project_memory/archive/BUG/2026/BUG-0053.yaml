id: BUG-0053
title: Compose foreign-project rule enumerates flag spellings instead of deciding
  the property -- four spellings of the same target pass
related_pr: PR-0001
observed: 'TSK-0069 side check N1 (live, gate_shell_hygiene.py, kit 2026.08.16-8):
  refused are docker compose -p other down and --project-name=other (rc 2). PASSING
  are four spellings of the same target: -pother (attached short form -- _flag_name
  splits only on =, :166-167, so _PROJECT_FLAGS :64 never matches), COMPOSE_PROJECT_NAME=other
  prefix (the env var compose reads is no argument of the line), -f ../other/docker-compose.yml
  and --file ... (names the project via its file), --project-directory ../other (via
  its directory). The _named_projects docstring names ONE limit (the v1 binary) and
  none of these four. That compose derives the project name from the file/directory
  and the env var overrides both is DOCUMENTED compose behaviour, not measured here
  (no daemon on the host) -- measured are the four rc-0 lines.'
expected: Every line that designates a compose stack not this repo's is refused regardless
  of HOW it designates it -- the fix targets the PROPERTY (this line determines another
  compose project name), not a fourth, fifth and sixth flag spelling; the enumeration
  is the defect. R10's founding case was an OOM hunt stopping a neighbour project's
  production database; -pother is plain POSIX short-option syntax.
repro: 'Send the compose lines to `gate_shell_hygiene` as a real hook process. RE-MEASURED
  2026-09-06 (TSK-0131) against b7f282e, four spellings: `docker compose -p other
  down` rc 2 (refused, as intended), but `docker compose -pother down` rc 0, `COMPOSE_PROJECT_NAME=other
  docker compose down` rc 0, `docker compose -f ../other/docker-compose.yml down`
  rc 0 and `docker compose --project-directory ../other down` rc 0. REPRODUCES: the
  rule enumerates one flag spelling and four other routes to a foreign compose project
  stay open.'
severity: high
acceptance_criteria:
- id: AC-1
  text: the foreign-project decision is derived from the property, not a flag list;
    the four measured spellings are refused (red-without-fix, parametrized)
- id: AC-2
  text: -p other and --project-name=other stay refused (counter-probes green)
- id: AC-3
  text: the docstring names exactly the limits that remain, measured
