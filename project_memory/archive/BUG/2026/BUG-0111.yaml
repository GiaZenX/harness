id: BUG-0111
title: Ein Kandidat, der einen VORFAHREN eines geschützten Baums nennt (neu, TSK-0011)
related_pr: PR-0003
observed: '**Mechanismus:** die Zugehörigkeitsprüfung antwortet in **beide** Richtungen,
  und sie muss das:

  `rm -rf team-kits` nennt jede geschützte Datei darunter, ohne eine davon zu buchstabieren.
  Die

  Kehrseite ist, dass ein Kandidat, der einen Vorfahren nennt — ein einzelnes `..`,
  ein bloßer

  Laufwerksbuchstabe, die Repo-Wurzel selbst —, als Schreibzugriff auf **alles darunter**
  gelesen

  wird. Ein `_PATHISH`-Treffer, der nur aus `/` oder `\` besteht, reicht dafür aus.'
severity: low
hole_number: H19
source: docs/holes/H19.md
limits: 'the other half of the same over-refusal, and it is the price of a membership
  test that must answer in BOTH directions: `rm -rf team-kits` names every protected
  file under it without spelling one, so a candidate naming an ANCESTOR -- a bare
  `..`, a drive letter, the repo root -- is read as a write to everything beneath.
  Measured: `cp -r docs ..` is rc 2. Nothing gets through; what it costs is a refused
  line with a relative target above the repo. The way round it: name the target absolutely
  and outside the repo.'
