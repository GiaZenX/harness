id: BUG-0039
title: 'A non-verbatim approval relay mints NOTHING -- silently for the user: the
  click ''Freigeben'' vanishes without any feedback'
related_pr: PR-0003
observed: 'Pilot 3 (TSK-0027, docs/pilot/2026-08-14-pilot-3-rechnungswerkzeug.md B15),
  S3 measured: the PM relayed the approval question ENRICHED (not verbatim), the persona
  clicked ''Freigeben [489405]'', NO approval was minted (correct -- the verbatim
  guard held: no APR file, no audit entry, PR status unchanged), and NO signal reached
  the user that her yes evaporated. Only the PM''s self-check discovered it turns
  later and re-relayed verbatim. The protection is right; the silence is the defect:
  a user''s explicit approval click producing nothing, with no refusal and no prompt
  to retry, is indistinguishable from a granted approval from her seat.'
expected: 'When an AskUserQuestion answer carries an approval-shaped choice (the ''Freigeben
  [<code>]'' label / [APR-REQ:...] context) and the mint hook decides NOT to mint
  (non-verbatim, stale code, wrong revision), the DECISION IS SPOKEN: the hook (or
  the flow it drives) produces an immediate, user-visible message naming that no approval
  was created and why, plus the one next action (the PM re-relays verbatim). A user''s
  yes never vanishes silently.'
repro: 'In a kit project: harness.py request-approval scope <item>; relay the printed
  question with any added words OR with self-worded option labels; answer with assent
  -> today: no APR is created and nothing tells the user. CORRECTED 2026-08-15 (TSK-0061
  STEP-1 measurement): in the pilot''s shape (marker missing from the relayed question)
  the non-mint leaves NO trace at all -- no audit line, no stderr, no state change;
  the earlier sentence ''the audit log alone records the non-mint'' held only for
  the OTHER refusal shapes (marker present but mismatched, stale code, expired), not
  for the measured pilot chain.'
severity: high
acceptance_criteria:
- 'AC-1: a non-minting approval answer produces an immediate user-visible message
  naming the non-mint and the remedy (measured on the running hook)'
- 'AC-2: a minting answer''s behavior is unchanged (no new noise)'
- 'AC-3: red-without-fix on the silent path; the pilot''s S3 chain replayed against
  the fix shows the message'
- 'AC-4: the message follows the report-language rule (plain language, no invented
  ceremony)'
source: TSK-0027 pilot 3, finding B15; verifier round 1 (F-series) established the
  chain from the raw transcripts and audit log
