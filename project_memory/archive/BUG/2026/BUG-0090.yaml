id: BUG-0090
title: 'A BUG cannot reach VERIFIED on an honestly declared regression run: the confirming
  edge reads the merge''s evidence filter, which drops every passing run_scope=selection
  (DEC-0061) -- while the kernel''s own refusal text asks for exactly such a targeted
  run'
related_pr: PR-0005
observed: '2026-09-03, this repo (kernel at e45c0ca): after APR-0001 to APR-0004 the
  lead ran the 12 tools/test_ functions whose docstrings name BUG-0083 to BUG-0086
  (12 passed, 36.85 s) and recorded EVD-0079 with --kind test --result pass --related
  BUG-0083 (and the other three) --run-command <the pytest line> --run-scope selection.
  `transition BUG-0083 VERIFIED` then refuses: ''FIXED -> VERIFIED needs a test Evidence
  that PASSES and covers BUG-0083; there is none'' and its remedy says ''run the test
  that fails before the fix and passes after it, then record the run''. The evidence
  exists and covers the item; state._assert_confirmed routes through report.qa_verdicts,
  whose _delivery_evidence drops every passing Evidence with run_scope == PARTIAL_RUN_SCOPE
  (report.py, the DEC-0061 rule written for the MERGE gate). The same record WITHOUT
  --run-scope would have counted (''a record that declares NO scope is treated exactly
  as before'').'
expected: 'Either (a) the BUG confirming edge reads a regression run for what it is
  -- a selection by nature, passing on the item it names -- and the merge keeps its
  full-run rule (two readers with one shared store, each stating which question it
  answers), or (b) the edge really requires a full-run verdict, and then the refusal
  text and the evidence --help stop asking for a targeted run. What must not stay:
  a reader that rewards the record that says less about its run than the record that
  says more (DEC-0061''s own optional-field caveat H108 names the direction; this
  is its inverse -- honesty penalised).'
repro: 'In a state directory with a BUG at FIXED: run the test that covers it; record
  `evidence --kind test --result pass --related <BUG> --artifact-ref <log> --run-command
  <line> --run-scope selection`; run `transition <BUG> VERIFIED` -> refused ''there
  is none''. Record the same run again without --run-command/--run-scope -> the transition
  walks. Measured on BUG-0083 in this repo (EVD-0079).'
severity: low
acceptance_criteria:
- id: AC-1
  text: a passing test Evidence that names the BUG and declares run_scope selection
    walks FIXED -> VERIFIED, or the refusal text and evidence --help no longer describe
    a targeted run as the remedy -- one of the two, decided in a DEC line beside DEC-0061
- id: AC-2
  text: 'the merge gate''s reading (gate_git / report.qa_verdicts for the delivery
    verdict) is unchanged by the fix: a passing selection still opens no merge (tools/test_report.py::test_a_pass_from_a_partial_run_is_not_merge_evidence_and_a_fail_still_is
    stays green)'
- id: AC-3
  text: 'red-first: a test plants a FIXED BUG with a passing selection-scoped test
    Evidence and asserts the outcome the DEC line chose; it is red on e45c0ca'
