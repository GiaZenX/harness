id: BUG-0038
title: Kernel-written fields outside the contract universe (design_refs, premise_rechecks,
  supersedes) are read shape-assumingly -- freeze-design letter-splits a scalar design_refs
  INTO CANONICAL STATE and validate stays silent
related_pr: PR-0003
observed: 'Measured 2026-08-14 (TSK-0033 verification F6, live over the shipped entry
  point in a dev-team scaffold): capture PR with design_refs as a SCALAR string, then
  freeze-design -> staging.py:319 (list(root.get("design_refs") or [])) splits the
  scalar into 34 one-letter entries and writes them via _update_item_locked into the
  canonical item; cli.py:675 prints the BUG-0015 signature (d, e, s, i, g, n, ...);
  dispatch.py:479 builds the confirmed set from the same field as a gate input for
  UI dispatch (the refusal itself sits at :504-512); validate reports 0 errors. Same
  family, only read so far: report.py:1236/:1270 (supersedes -- indexed per letter,
  a superseded decision keeps counting as in force in _holding_decisions) and report.py:1154/:1170
  (premise_rechecks). Root cause: the TSK-0033 sweep was bounded by the --map universe
  (REQUIRED_FIELDS union OPTIONAL_FIELDS, migrate._item_fields:1177); fields the kernel
  itself writes AND reads but does not declare there fall outside every sweep. (Anchors
  re-measured 2026-08-14 after the round verifier found the first capture already
  stale -- the exact BUG-0015 failure mode.)'
expected: A scalar in a kernel-written list field is either normalised at the write
  site (field_elements, the definition BUG-0015 introduced) or refused at capture
  -- never letter-split into canonical state; validate names the malformed shape instead
  of 0 errors; supersedes/premise_rechecks readers measured the same way.
repro: 'In a dev-team scaffold: python scripts/harness.py capture PR with "design_refs":
  "design/revisions/DSN-0001.r01.html" (scalar), then freeze-design with a staged
  revision -> the PR''s design_refs holds 34 one-letter entries plus the appended
  ref; validate -> 0 errors.'
severity: medium
acceptance_criteria:
- 'AC-1: the measured freeze-design chain no longer letter-splits (red-without-fix
  on the canonical item content)'
- 'AC-2: supersedes and premise_rechecks readers measured for the same class, fixed
  or named'
- 'AC-3: the sweep boundary (contract universe vs kernel-written fields) is derived
  in one place so the next field cannot fall between the two'
- 'AC-4: validate names a scalar in a kernel-written list field instead of 0 errors,
  or the write site refuses it'
source: TSK-0033 round verification F6, 2026-08-14; docs/reviews/2026-08-14-tsk0033-map-field-reader-sweep.md
  (sweep boundary)
