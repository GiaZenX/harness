id: BUG-0084
title: 'Kernel: an approval on a HYP covers NO content and never invalidates -- it
  mints (APR-0003), unlocks dispatch, survives every edit of the HYP, and takes the
  task out of the QA-debt check (H93, security-relevant)'
related_pr: FR-0029
observed: 'Stream D + verifier 2026-09-01: request-approval scope HYP-0001 rc 0, mint
  rc 0 -> APR-0003, dispatch rc 0 afterwards. update HYP-0001 statement -> rev 1,
  approval_ref stays; the same on RQ-0001 -> rev 2, approval gone, DRAFT. Root causes
  measured: (HYP, scope) is NOT in approvals.APPROVAL_TRANSITIONS (approvals.py:148-159)
  yet the mint accepts it; item_subject_manifest(kind=scope) on a HYP intersects _SCOPE_FIELDS
  with the item fields and gets NONE -- the user signs a sha256 over {item, revision}
  and no content; HYP is missing from HASHED_FIELDS so the revision never moves. Additionally
  a task rooted under a HYP drops out of report.accepted_without_a_verdict (report.py:1509-1513
  filters root_type in {PR, RQ}), so the workaround the H92 refusal itself recommends
  (create the task under HYP-0001) both unlocks work on an empty approval and hides
  it from QA debt. The constitution and INVALIDATION_TARGET both say no HYP approval
  exists.'
expected: Either a HYP approval is impossible (request-approval refuses kinds APPROVAL_TRANSITIONS
  does not list, fail-closed) or, if the research kit needs it, HYP joins HASHED_FIELDS
  with a real subject manifest and the QA-debt filter derives root types from ROOT_TYPE_BY_KIT
  instead of enumerating {PR, RQ}. Fixed together with the H92 bug so the recommended
  workaround disappears.
repro: Verifier rig _round-scratch/TSK-0103/vrig/proj; chain in the TSK-0103 verifier
  report.
severity: high
acceptance_criteria:
