id: BUG-0005
title: Der Sitzungsbrief verliert die letzte Nutzerentscheidung
related_pr: PR-0003
severity: high
repro: Eine Entscheidung mit dem Nutzer treffen, die Sitzung beenden, neu starten
  und `generated/session_brief.yaml` lesen.
expected: Der Sitzungsbrief ist die Zusammenfassung, mit der ein PM in die naechste
  Sitzung geht. Die zuletzt getroffene Nutzerentscheidung ist das Wichtigste darin
  -- ohne sie beginnt die Sitzung mit einer Luecke genau an der Stelle, an der die
  vorige aufgehoert hat.
observed: 'Sie taucht nicht auf. Der Brief rollt den Zustand auf, aber die letzte
  Entscheidung geht dabei verloren. Das ist derselbe Verlustmechanismus, der auch
  diesen Befundstapel erzeugt hat, nur eine Ebene hoeher: was nur im Gespraech stand,
  ist nach dem Neustart weg. severity high, weil es genau die Klasse ist, gegen die
  das ganze Harness gebaut ist.'
acceptance_criteria:
- Der Brief traegt die juengsten DEC-Items mit Titel und Entscheidung.
- Ein Test misst, dass eine frisch angelegte Entscheidung im naechsten erzeugten Brief
  steht.
- Der Test wird rot, wenn der Abschnitt entfernt wird.
status: VERIFIED
