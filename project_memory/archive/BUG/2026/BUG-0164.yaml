id: BUG-0164
title: Was die Vier-Augen-Wand NICHT bindet — offen, gemessene Grenzen der Zweitlesungs-Mechanik
  (TSK-0087)
related_pr: PR-0003
observed: '**Anlass:** `FR-0035` verlangte den Vier-Augen-Mechanismus wörtlich („ein
  Hook der das Verschieben

  sperrt …"), `TSK-0087` hat ihn gebaut: kein Eintritt ins Archiv ohne zwei unabhängige,
  an die

  **Bytes** des Dokuments gebundene Lesungen; Uneinigkeit legt beide Lesungen dem
  Nutzer vor. Der

  Prüfer hat die Wand in zwei Runden mit über vierzig Linien angegriffen; was durchlief,
  wurde

  geschlossen (archivinterne Wäsche, Pfad-statt-Dokument-Bindung, `ARCHIVE/`-Faltung,

  Freigabe-als-Waschgang). Diese Grenzen blieben, jede gemessen:'
severity: low
hole_number: H72
source: docs/holes/H72.md
limits: 'Die Vier-Augen-Regel fürs Archiv hält, was sie sagt: kein fremdes oder vertauschtes
  Dokument kommt unter einem doppelt gelesenen Namen durch. Bewusst nicht geprüft
  werden das Aufräumen nach Vorlage (Vorlage und Dateiname statt Ablageort) und das
  Überschreiben eines Posteingangs-Dokuments; deine Entscheidung vom 2026-09-12: so
  lassen, weil strenger jede Umbenennung im Büro-Alltag eine Freigabe kosten würde.'
