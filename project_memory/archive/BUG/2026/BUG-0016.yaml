id: BUG-0016
title: Die Einstiegssitzung sagt die Neustart-Bitte und arbeitet danach weiter, wenn
  der Nutzer weiterredet
related_pr: PR-0001
observed: "Gemessen 2026-08-09/10 in vier Pilotlaeufen ueber die SDK (TSK-0025/0027),\
  \ je eine echte Claude-Code-Sitzung in einem leeren Verzeichnis.\n\nDie globale\
  \ Einstiegsdatei schreibt vor: 'Stop and ask for a restart -- do NOT act as the\
  \ PM in this session. The installed agents and the agent: project-manager setting\
  \ only become active at the NEXT session start. So do not delegate or derive anything\
  \ now.' Und sie gibt den Wortlaut der Bitte vor.\n\nAlle vier Laeufe haben die Bitte\
  \ woertlich geliefert. Drei haben danach trotzdem weitergearbeitet, sobald die Persona\
  \ weiterredete:\n\n  Lauf                          Bitte in Zug   Write/Edit DANACH\n\
  \  rechnung (Persona)                 0               28\n  minispiel (Drehbuch)\
  \               0              148\n  vokabeltrainer (Persona)           1     \
  \           3\n  vokabeltrainer (Drehbuch)          0                0\n\nIm Rechnungs-Piloten\
  \ sind daraus 14 Dateien Anwendungscode mit rund 1000 Zeilen entstanden (app.py,\
  \ db.py, models.py, pdf.py, templates/, static/) -- bei EINEM Item im Zustand (PR-0001)\
  \ und ohne eine einzige SR, TSK, Entscheidung oder Freigabe. Im Minispiel-Piloten\
  \ 31 Dateien mit 2770 Zeilen.\n\nDas ist nicht nur eine verletzte Hoehflichkeitsregel:\
  \ in der Einstiegssitzung ist das Kit zwar installiert, aber seine Hooks, seine\
  \ Verfassung und die agent:-Bindung wirken erst ab der NAECHSTEN Sitzung. Was hier\
  \ geschrieben wird, entsteht also ausserhalb von gate_dispatch, gate_write_scope,\
  \ der Kernel-Pflicht fuer Zustand und jedem Nachweis. Genau dafuer existiert die\
  \ Regel.\n\nDer eine Lauf, der sie einhielt, ist der mit dem starren Drehbuch, dessen\
  \ naechste Nachricht zufaellig keine Aufforderung enthielt -- die Regel haelt also\
  \ heute an der Formulierung der Nutzerantwort, nicht am Apparat."
expected: Nach der Neustart-Bitte fuehrt die Einstiegssitzung keine ableitende oder
  schreibende Arbeit am Produkt mehr aus, auch wenn der Nutzer weiterredet. Sie wiederholt
  die Bitte oder erklaert, warum sie erst nach dem Neustart weiterarbeiten kann. Was
  der Nutzer inzwischen sagt, geht nicht verloren -- es gehoert in den Entwurf, nicht
  in Code.
repro: Leeres Verzeichnis, SDK-Sitzung mit system_prompt preset claude_code und setting_sources
  user/project/local. Projektwunsch aeussern, Interview durchlaufen, Masterplan bestaetigen.
  Nach der Neustart-Bitte einfach weiterschreiben (z. B. 'ja, fang an'). Gemessen
  wird, ob danach Write/Edit auf Produktdateien folgen.
severity: high
acceptance_criteria:
- id: AC-1
  text: Nach der Neustart-Bitte erzeugt eine weitere Nutzernachricht keinen Write/Edit
    auf einer Produktdatei -- gemessen an einem echten Lauf, nicht an der Anweisung
- id: AC-2
  text: Der Fall wird gegen mindestens zwei verschiedene Weiterreden-Formulierungen
    gemessen, darunter eine ausdruckliche Aufforderung wie 'ja, fang an'
- id: AC-3
  text: Was der Nutzer nach der Bitte noch sagt, ist nach dem Neustart auffindbar
    -- es darf nicht verloren gehen, nur weil es nicht in Code wandert
- id: AC-4
  text: 'Geprueft ist, ob dieselbe Schwaeche auch die andere Richtung hat: ob der
    PM der zweiten Sitzung Arbeit der ersten Sitzung uebersieht, die ausserhalb des
    Zustands entstand'
