id: BUG-0137
title: Zwei Grenzen der Arbiter-Härtung der Gate-Suite (neu, TSK-0063)
related_pr: PR-0003
observed: 'Anlass war `BUG-0051`: seit dieser Host ein WSL-Linux trägt, gewann der
  Windows-eigene

  `bash`-Starter die Shell-Auswahl der Suite („läuft `true`" genügte), obwohl er absolut
  benannte

  Pfade in ein fremdes Dateisystem auflöst — die Kontrolle des Sandbox-Tests konnte
  den Unfall

  nicht mehr vorführen. TSK-0063 ersetzt die Auswahl durch eine Eigenschaft: der Schiedsrichter

  muss eine Nonce, die dieser Prozess schreibt, **durch seine eigene Umleitung inhaltlich

  zurücklesen** (der Starter antwortet rc 0 mit leerem stdout — der Exit-Code war
  genau die

  Lücke). Zwei Grenzen der Härtung sind vom Prüfer gemessen und bleiben benannt; die

  Zeilennummern sind der Stand 2026-08-15.'
severity: low
hole_number: H45
source: docs/holes/H45.md
limits: 'zwei gemessene Grenzen der Arbiter-Härtung aus TSK-0063, je im Eintrag: die
  Sitzungswache verlangt die Seh-Eigenschaft auch von shell-freien Registrierungs-Prüfungen
  (fail-closed, auf diesem Host ohne Effekt; Schließrichtung benannt), und `_can_arbitrate`
  ist von keinem Test rot-fähig gedeckt (die entfernte `cd`-Probe ist unbeobachtet
  — H10-Klasse)'
