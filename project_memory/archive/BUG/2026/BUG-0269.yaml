id: BUG-0269
title: 'The radar watcher''s Desktop scheduled task is a mechanism this repository
  can neither ask nor see fire: its day, hour and enabled flag live in the Desktop
  app, it runs only while that app is open, and a week with the app closed is silent
  -- the report cadence in radar/ is the only evidence, read by `--due` (corrected
  under DEC-0089: the task IS the mechanism and its reports DO carry the `-claude`
  suffix; TSK-0130, PR-0010 AC-1)'
related_pr: PR-0010
severity: low
observed: '**Mechanism (DEC-0089, correcting DEC-0085 and the first version of this
  item).** A Claude Desktop LOCAL scheduled task for the radar half has existed on
  this host since 2026-06-30: `C:/Users/zenti/.claude/scheduled-tasks/radar-watcher/SKILL.md`
  (1093 bytes, mtime 2026-06-30 10:53:59, the only entry under `~/.claude/scheduled-tasks/`),
  created by this repository''s session agent. Its body delegates to `.claude/agents/radar-watcher.md`,
  whose step 4 names `radar/<today>-claude.md` -- so the reports it writes DO carry
  the watcher suffix; the first version of this item read the SKILL''s literal `radar/<today
  YYYY-MM-DD>.md` and not the definition it delegates to, and its suffix sentence
  was FALSE. Measured against the artifacts (file mtimes in `radar/`, 2026-09-06):
  2026-07-17 20:10, 07-24 20:12, 07-31 20:16, 08-07 20:47, 08-21 20:16, 08-28 20:12
  -- Friday evenings, the few-minute offset after 20:00 the vendor documentation describes
  -- plus 2026-08-16 20:25, a Sunday catch-up run. The task runs. What the repository
  cannot do is ASK it: per code.claude.com/docs/en/desktop-scheduled-tasks neither
  the schedule nor the enabled flag is in the file (both live in the Desktop app),
  the app checks the schedule only while it is open and the machine is awake, and
  a missed time gets one catch-up run within seven days. There is no task for the
  codex half yet (DEC-0089 (1): the user creates one, Saturday ~20:00).

  **What the merge built for it (TSK-0133):** `radar/routine.json` records the task
  with the schedule as the user stated it and its source; `tools/radar_routine.py`
  derives `starts_itself` per watcher from that record AND the cadence the reports
  show (at least `CADENCE_EVIDENCE_MIN` reports of the watcher on the recorded weekday,
  read off the report names so a clone answers the same), and reports whether the
  task file is present on this host without judging any text by it. The measurement
  error behind the first version -- ''no report was started by a mechanism'', read
  off this repository''s audit log and an empty RemoteTrigger list -- is named in
  DEC-0089 (6): a Desktop task starts its own session and writes no spawn event here.'
expected: 'The limit is documented where the texts are read, not carried as a hole:
  `radar/README.md` names it, `--describe` lists it under `limits`, and `tools/test_radar_trigger.py`
  holds every sentence about the cadence to the per-watcher answer. What stays the
  user''s: the task''s schedule and enabled flag are in the Desktop app, so only a
  person with the app can change or retire it; the codex half''s task is created there
  too (DEC-0089 (1)), and the lead records it in `radar/routine.json` once it exists
  -- `starts_itself` for the codex half turns true only after two of its reports fall
  on the recorded weekday.'
repro: '`python tools/radar_routine.py --describe` on the merged tree: `starts_itself`
  is `{"radar-watcher": true, "codex-watcher": false}`, `desktop_tasks[0].cadence_evidence`
  lists the Friday reports, and `task_file_present_on_this_host` is true on the maintainer''s
  host and false on a clone. The derivation on a directory the test controls: `tools/test_radar_trigger.py::test_the_self_start_reader_answers_off_the_record_and_the_reports`
  (one report on the weekday, reports on other days, the other watcher''s reports
  and an unsuffixed pair each stay False). That an unsuffixed report clears nobody:
  `tools/test_radar_trigger.py::test_the_routine_counts_a_run_per_watcher_and_per_period`.'
acceptance_criteria:
- id: AC-1
  text: DEC-0089 records the task as the mechanism, who created it, its schedule as
    the user stated it, and that the cloud routine is not built -- recorded 2026-09-06
- id: AC-2
  text: '`radar/routine.json` carries the radar task with schedule, source and first/last
    measured report, and `--describe` reports it with its cadence evidence -- built
    in TSK-0133; the codex entry is the lead''s once the user has created that task'
- id: AC-3
  text: the texts about the cadence say the Desktop task starts the radar-watcher
    and say who starts the codex-watcher until its task is recorded, and `starts_itself`
    is derived per watcher from the record and the reports (guarded by `tools/test_radar_trigger.py::test_no_text_claims_a_schedule_the_repo_does_not_build`
    and `tools/test_radar_trigger.py::test_the_self_start_reader_answers_off_the_record_and_the_reports`)
limits: Der Wochenplan für die beiden Beobachter-Agenten liegt in einer App (Claude
  Desktop), die dieses Projekt weder fragen noch beobachten kann. Ob er gelaufen ist,
  sieht man nur an den Berichten, die er hinterlässt.
source: DEC-0089 (supersedes DEC-0085); C:/Users/zenti/.claude/scheduled-tasks/radar-watcher/SKILL.md;
