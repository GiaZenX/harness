id: BUG-0073
title: Approval requests reach the user as a German-English weave -- field VALUES
  the user must judge are written in English because nothing says which language values
  carry (all kits, live find)
related_pr: PR-0003
observed: 'Live use 2026-08-29, the user''s real office project (screenshot): a filing_rule
  approval request whose FRAME is German (kernel/skill text: ''Freigabe erbeten ...
  die Freigabe FUEGT diese eine Regel HINZU, aendert keine bestehende ...'') while
  the EMBEDDED VALUES -- naming pattern (''original supplier filename kept; images
  may carry a dimension suffix as already used''), reason (''Existing Aktenplan node,
  promoted to a machine-readable rule. Needed now for the P6 6900HX media archive
  ...''), retention note -- are English, drafted by the PM because the field vocabulary
  is English and no rule says which language the VALUES carry. The user: ''wirkt unnatuerlich
  und laesst sich schlecht lesen was genau freigegeben werden soll'' -- on the one
  surface where his reading IS the safeguard. The language rule (''an English identifier
  never makes the sentence around it English'') exists for reports; it is not spelled
  out for approval surfaces where field values land inside the German sentence. The
  class covers ALL kits: the request-approval mechanism is shared; office merely hits
  it first because filing rules carry the most prose fields.'
expected: 'Every prose field a user must READ to judge an approval (reason, human-readable
  patterns, retention notes) is written in the user''s report language (German); identifiers,
  keys, paths and technical tokens stay English. Carried in the PM/manager role text
  where the request is drafted (the FR-0052 surface pattern: on the loaded surface,
  with the honest limit that free text has no enforcing gate), and -- where the kernel
  FORMATS the request -- the formatter''s own frame stays one language and labels
  embedded values so the seam is at least visible. Mirrored across the three kits.'
repro: 'Any approval whose rule/scope fields the PM drafts: the field values arrive
  English inside the German frame; visible in every AskUserQuestion approval card.'
severity: medium
acceptance_criteria:
- id: AC-1
  text: 'the role text of every kit lead names the value-language rule for approval
    drafting (values the user judges: German; identifiers/paths: English), byte-identical
    across kits unless a kit names its reason'
- id: AC-2
  text: 'measured on a scaffolded project: a freshly drafted filing_rule approval
    renders with German prose values; the structural reader that already checks the
    lead texts covers the new section'
- id: AC-3
  text: 'the honest limit stated: no gate can read free text; the rule lives in prose
    and the formatter seam, and the round says what remains uncatchable'
