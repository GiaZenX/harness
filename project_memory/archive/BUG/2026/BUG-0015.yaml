id: BUG-0015
title: Die Migration empfiehlt ein Flag, das die Verfahrensdokumentation fuer die
  Steuerberatung buchstabenweise fuellt
related_pr: PR-0001
observed: "Gemessen 2026-08-09 an einer Kopie des echten BuyPlugGo (office-team),\
  \ TSK-0026.\n\nDer Trockenlauf druckt --map PROC.roles=owner als den EINZIGEN Weg\
  \ zur Ausfuehrbarkeit (12 von 16 PROC-Records haengen daran) und sagt dazu: 'the\
  \ run stays unexecutable until you type these back'. Das Flag fuellt roles mit einem\
  \ SKALAR.\n\nDas office-Kit liest dieses Feld selbst: team-kits/office-team/templates/repo/scripts/process_doc.py:125,129\
  \ macht ', '.join(str(r) for r in roles) -- ueber eine Zeichenkette iteriert das\
  \ buchstabenweise. Gemessen in einem selbst gescaffoldeten office-team-Projekt mit\
  \ den 12 Items, die der Import wirklich schrieb:\n\n  RENDERED: - Ausfuehrende Rollen:\
  \ r, e, c, o, r, d, s, -, c, l, e, r, k\n  RENDERED: - Ausfuehrende Rollen: c, o,\
  \ m, p, l, i, a, n, c, e, -, r, e, s, e, a, r, c, h, e, r\n  RENDERED: - Ausfuehrende\
  \ Rollen: o, f, f, i, c, e, -, d, e, v, e, l, o, p, e, r\n\n12 von 12 aktiven PROC-Items.\
  \ Gegenprobe im selben Lauf mit roles als Liste: '- Ausfuehrende Rollen: records-clerk'.\n\
  \nDas Ziel ist docs/verfahrensdokumentation.md -- das GoBD-Dokument fuer die Steuerberatung.\
  \ Die Kette laeuft in EINER Sitzung durch: Trockenlauf druckt das Flag -> Nutzer\
  \ tippt es -> 'imported 16 item(s)' -> process_doc.py schreibt das Dokument. kernel.cli\
  \ validate sagt dazu 0 error(s), 0 warning(s). Nichts faengt es ab.\n\nDazu eine\
  \ Unbedenklichkeitsbehauptung, die der Code des eigenen Kits widerlegt -- migrate.py:2350:\
  \ 'No contract in this kernel declares the shape of roles ... so inventing one here\
  \ would be the kernel deciding something nobody wrote down.' Ueber den KERNEL stimmt\
  \ das; das office-Kit hat die Form sehr wohl aufgeschrieben. Und report.py:821-826\
  \ (_parent_bindings) normalisiert Skalar und Liste bereits ausdruecklich -- das\
  \ Projekt kennt das Muster, process_doc.py wendet es nicht an."
expected: Entweder process_doc.py normalisiert Skalar und Liste wie report._parent_bindings
  es tut, oder die Migration fuellt roles nicht skalar, oder migrate.py:2350 streicht
  seine Unbedenklichkeitsbehauptung und nennt den Leser, der die Form doch liest.
  In jedem Fall darf die eigene Empfehlung der Migration kein Dokument fuer Dritte
  zerschreiben.
repro: '1. office-team-Projekt scaffolden. 2. Ein PROC-Item mit SKALAREM roles anlegen
  (genau das schreibt --map PROC.roles=owner). 3. python scripts/process_doc.py fahren.
  4. docs/verfahrensdokumentation.md lesen: die Rollenzeile ist buchstabenweise.'
severity: high
acceptance_criteria:
- id: AC-1
  text: Ein PROC-Item mit skalarem roles erzeugt in docs/verfahrensdokumentation.md
    dieselbe Zeile wie eines mit einelementiger Liste -- gemessen an der gerenderten
    Ausgabe, nicht am Code
- id: AC-2
  text: Ein Test wird ohne den Fix rot, und er faehrt process_doc.py wirklich, statt
    seinen Quelltext zu durchsuchen
- id: AC-3
  text: Die Aussage in migrate.py:2350 stimmt gegen alle Leser des Feldes, nicht nur
    gegen den Kernel -- oder sie faellt
- id: AC-4
  text: 'Geprueft ist, ob weitere vom --map-Flag gefuellte Felder einen Leser haben,
    der eine Form voraussetzt: roles war der erste gefundene, nicht notwendig der
    einzige'
