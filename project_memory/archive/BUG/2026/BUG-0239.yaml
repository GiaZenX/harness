id: BUG-0239
title: Kein Leser urteilt über den WORTLAUT einer Auftragszeile (neu, TSK-0123, FR-0005/FR-0010)
related_pr: PR-0003
observed: '**Mechanismus.** Die zwei Lesungen, die diese Runde vor den Auftrag setzt
  — der kleinere Plan und

  die fünf Formen, in denen eine Auftragszeile danebengeht — sind Pflichten in einem
  Rollentext. Was

  sie prüfen, ist der WORTLAUT der Zeilen eines Arbeitsauftrags, und den liest kein
  gebauter Leser:

  `gate_dispatch` prüft den Dispatch-Kopf gegen die Lease und sagt das in seinem eigenen
  Kopfkommentar

  („WHAT THIS GATE PARSES: the header, and only the header … Free prompt prose is
  never evidence of

  anything"), Gate 2 dieses Repos verlangt eine Id, die auflöst und nicht terminal
  ist. Ein Auftrag,

  dessen `expected_outputs` einen Baustein nennt, den keine Anforderung nennt — der
  mechanische

  Auslöser des kleineren Plans —, geht also unbeanstandet raus.'
severity: medium
hole_number: H157
source: docs/holes/H157.md
limits: Ob ein Arbeitsauftrag sinnvoll formuliert ist, liest kein Programm nach; das
  bleibt die Aufgabe der Lesung, die im Arbeitsablauf steht.
