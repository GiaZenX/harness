id: BUG-0079
title: 'documents.py''s own remedy line is refused by the code that prints it: the
  document_proposal remedy omits --reason, and the printed command line then fails
  with ''reason is missing'''
related_pr: BUG-0071
observed: 'TSK-0096 verifier measurement 2026-08-30: team-kits/kernel/documents.py:724-728
  prints a remedy naming ''request-approval document_proposal --kit-document ... --proposal
  ...''; running exactly that line returns ''a document_proposal approval question
  must say what it releases, and reason is missing. Remedy: ... --reason <reason>''.
  The role texts that inherited the incomplete line were fixed in the TSK-0096 rework;
  the kernel''s own remedy was deliberately left for its own round because the kernel
  is version-stamped and the fix owes a red-first test.'
expected: Every remedy the kernel prints is a command line the kernel accepts (given
  the approvals it asks for). A test executes the printed remedy shape against the
  running CLI and fails when the line is refused for a missing flag -- the house rule
  'a check must read the part that runs' applied to remedies.
repro: 'In an office project with the kit documents: `request-approval document_proposal
  --kit-document content_guidelines.yaml --proposal staging/TSK-0001/content_guidelines.yaml`
  without `--reason`. RE-MEASURED 2026-09-06 (TSK-0131) against b7f282e, twice: against
  a project WITHOUT the document, rc 1 -- ''content_guidelines.yaml does not exist
  in this project, and this command never CREATES a document''; against a project
  WITH it and an identical proposal, rc 1 -- ''the proposal adds nothing that is not
  already there''. Neither run reached the remedy line the item is about, so the observed
  sentence is not re-measured; what IS measured is that both refusals name a route.
  Kept OPEN with this reading rather than closed on a run that did not reach the case.'
severity: low
acceptance_criteria:
- id: AC-1
  text: the printed remedy carries every required flag; red-first test runs the remedy
    shape against the CLI
- id: AC-2
  text: the round greps documents.py (and, cheaply, the other kernel modules) for
    further remedy lines naming this command surface and fixes the class where found,
    or records the bounded scope
