id: BUG-0308
title: 'Die Buchfuehrung der Sprosse kennt nur Claude: `lease_rung`/`lease_effort`
  am Auftrag und damit die Sprossen-Verteilung und die Runden-bis-PASS je Sprosse
  zaehlen auf einem Codex-Projekt die Claude-Antwort, nicht die, nach der der Codex-Lead
  gearbeitet hat (Rest von TSK-0151 V1)'
related_pr: PR-0012
observed: 'MEASURED 2026-09-25 (TSK-0151 rework 2). **Mechanism.** Since rework 2
  the lease and the dispatch header carry the ladder answer for every provider a project
  is installed for (`kernel.dispatch.PROVIDERS_KEY`, `installed_providers`); the top-level
  `rung`/`effort` of lease and header and the task fields `dispatch.LEASE_RUNG_FIELD`
  / `LEASE_EFFORT_FIELD` stay the REFERENCE platform''s (claude), because that is
  the pair the Claude spawn gate holds and the kernel cannot tell which client ran
  the order (no client marker is measured in this repo). `report.lease_distribution`
  reads only the task fields. **Chain.** A dev project installed for [claude, codex],
  run from Codex: a builder order fails three runs -> its fourth lease carries `by_provider.codex`
  fable = gpt-6-astra and `lease_rung: opus` on the task -> the brief''s lease distribution
  and `runs_to_hand_back_per_rung` count the order under opus. Nothing is dispatched
  or refused on these numbers.'
expected: Either the task records the rung per provider and the distribution says
  which provider's rung it counts, or the distribution names that it counts the reference
  platform's rung; red-first against a Codex-installed project whose order climbed.
repro: PYTHONPATH=team-kits python -m pytest tools/test_ladder.py -k lease_and_the_header_carry
  -- the header's by_provider.codex differs from the top-level rung, which is the
  one the task item records.
severity: low
acceptance_criteria:
- id: AC-1
  text: the lease distribution of a Codex-run project with a climbed order says which
    provider's rung it counts, measured red-first
source: project_memory/staging/TSK-0151/verify-round-1.md V1; project_memory/staging/TSK-0151/protocol.md
  section Rework 2
limits: 'Nur eine Statistik ist auf Codex-Projekten ungenau: welche Stufe ein Auftrag
  bekam, zaehlt der Bericht nach der Claude-Antwort. Welche Stufe gearbeitet hat,
  steht im Kopf des Auftrags richtig; es wird nichts falsch gestartet oder abgelehnt.'
