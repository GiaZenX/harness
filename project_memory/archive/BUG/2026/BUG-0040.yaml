id: BUG-0040
title: gate_dispatch knows only the ROOT item's acceptance criteria -- a task written
  against CR-minted criteria is not dispatchable
related_pr: PR-0003
observed: 'Pilot 3 (B12), audit log 21:54:37: TSK-0005 referenced AC-11/15/17/20/22
  -- criteria minted by APPROVED CRs (CR-0001 brought AC-11..AC-14, CR-0002 AC-15/16/28,
  ...) -- and gate_dispatch refused the spawn: ''references criteria that exist nowhere
  ... not dispatchable (spec II.4). Remedy: reference criteria that exist on PR-0001
  ... (known: AC-1..AC-10)''. TSK-0005 was CANCELLED and re-cut against root criteria.
  The CR machine mints criteria its own dispatch gate cannot read -- the finding sits
  exactly on the mechanism pilot 3 otherwise proved (6 CRs APPROVED).'
expected: 'The criteria universe the dispatch gate accepts is DERIVED from the same
  store the approval machinery writes: root-item ACs plus the ACs of APPROVED CRs
  targeting that root (and their approved revisions). A task against a CR-minted criterion
  dispatches; a task against a truly nonexistent criterion still refuses with the
  full known list.'
repro: 'Kit project: approve a CR that adds AC-11 to the root; create-task with --acceptance-ref
  AC-11; spawn -> gate_dispatch refuses naming only the root''s AC-1..AC-n as known.'
severity: high
acceptance_criteria:
- 'AC-1: a task referencing an approved-CR criterion dispatches (red-without-fix)'
- 'AC-2: a nonexistent criterion still refuses, message lists the derived universe
  honestly'
- 'AC-3: the universe derivation lives in ONE place (kernel), read by the gate --
  no second list'
- 'AC-4: an unapproved/rejected CR''s criteria do NOT count (measured)'
