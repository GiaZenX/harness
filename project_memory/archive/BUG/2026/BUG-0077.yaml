id: BUG-0077
title: 'Circular ordering: the PM skill wants the approved wireframe INSIDE the scope
  manifest, but gate_dispatch refuses the designer spawn that would draw it until
  the scope approval exists'
related_pr: BUG-0075
observed: 'Canyon_3.4.0 audit 2026-08-30: skills/project-manager/SKILL.md:104 requires
  ''For a UI scope the approved WIREFRAME is part of that scope manifest'' and :111-115
  has the designer draw it from class normal upward; but gate_dispatch refused TSK-0001''s
  designer spawn with ''no user approval authorises dispatching TSK-0001 under PR-0001
  -- blocked (spec II.2)'' (session c794dd99 line 287, 14:54Z). The two duties are
  jointly unsatisfiable: APR-0001 was minted 15:27Z, the wireframes were drawn 15:28-20:39Z
  and frozen from 17:21Z -- the scope manifest CANNOT contain their hashes. The kit
  forced the PM into the violating order; the PM behaved correctly at every step.'
expected: The two rules name one consistent order. Either the wireframe phase is explicitly
  BEFORE the scope approval with a sanctioned path (e.g. a design-scoped pre-approval
  or the PM-drawn thin wireframe for that phase), or the skill stops claiming the
  wireframe belongs in the scope manifest and says what binds it instead. Whichever
  way, a project driven by the book never hits an unsatisfiable pair.
repro: Read skills/project-manager/SKILL.md:104 and :111-115 against the dispatch
  gate's refusal condition (spec II.2); Canyon session c794dd99 line 287 is the live
  measurement.
severity: medium
