id: BUG-0080
title: Repairing a freeze bound to the wrong approval needs a staged copy of the artifact
  -- and no role may write it, so the USER hand-copies again (Canyon live find, the
  BUG-0071 class at the freeze input)
related_pr: BUG-0071
observed: 'Canyon_3.4.0 live 2026-08-30: the PM had frozen the architecture diagram
  bound to a wrong approval ref; the repair is a RE-FREEZE which the kernel reads
  from project_memory/staging/<dir>/ -- and the PM told the user ''dorthin durfte
  wegen der Schutzregeln nur deine Hand kopieren'', handing him a copy line for the
  terminal. The user executed it (correctly, by his own account -- an earlier suspicion
  of a misexplained line was cleared by him: the npm line was a separate terminal
  check). The defect that stands: the freeze-repair path has no in-apparatus writer
  for its own input -- who may stage the artifact copy for a re-freeze, and why could
  no specialist with staging scope do it?'
expected: 'A freeze recorded against the wrong approval is repairable inside the apparatus:
  either the kernel''s freeze command can re-read the artifact it already holds (the
  frozen bytes exist in design/architecture revisions) without a fresh staging copy,
  or a role with staging scope stages the copy. The user''s hand is never the copy
  machine, and every terminal line handed to the user carries its one-sentence explanation
  WITH the line.'
repro: 'In a kit project, freeze an architecture diagram with a wrong scope_apr_ref,
  then attempt the repair without user hand-copying: measure which write the gates
  refuse and to whom. Canyon session (c--Offline-Repos-gewerbe-buypluggo-website-Canyon-3-4-0)
  carries the live chain.'
severity: medium
acceptance_criteria:
- id: AC-1
  text: the re-freeze repair path is walkable end to end in a scaffolded project with
    no user file operation; red-first reproduces today's dead end
- id: AC-2
  text: the round measures WHY the staging write was refused to every role in the
    live case (work-order scope? PM-level refusal?) and fixes the actual refusing
    edge, not a symptom
