id: BUG-0190
title: 'Der Umfang eines QS-Laufs ist Prosa: kein Feld und kein Hook zählt, ob die
  Suite einmal oder zehnmal lief (neu, TSK-0105, FR-0057)'
related_pr: PR-0003
observed: '**Mechanismus.** Das Maß aus DEC-0050 — betroffene Tests, solange die Runde
  offen ist; der volle

  Lauf EINMAL vor dem Urteil — steht seit dieser Runde dort, wo die Verdict-Rolle
  es liest: in der

  `description` ihres Frontmatters (was ein Spawn zuerst sieht) und im `## Do` ihres
  Skills, dazu als

  Klausel am GATE-Schritt der Verfassung (§5a.7) und als Leiter im PM-Skill. Nichts
  davon liest ein

  Hook. Der Evidence-Datensatz trägt `--summary` (Freitext) und `--artifact-ref` (einen
  Pfad); ein

  Feld für den Umfang oder die Nummer eines Laufs gibt es nicht, und kein Hook zählt
  Befehlszeilen

  über eine Sitzung.'
severity: low
hole_number: H106
source: docs/holes/H106.md
limits: 'der Umfang eines QS-Laufs ist Prosa: kein Feld im Evidence-Datensatz und
  kein Hook zählt, ob die Suite einmal oder zehnmal lief. Begrenzt durch den Rollentext
  — Beschreibung und Skill, beide Hälften per Test gehalten —, die Verfassungsklausel
  am GATE-Schritt und die Leiter des PM'
