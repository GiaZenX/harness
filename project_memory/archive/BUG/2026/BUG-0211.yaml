id: BUG-0211
title: Eine Handänderung an einem erzeugten Diagramm sieht zwischen zwei Zustandsschreibvorgängen
  niemand (neu, TSK-0115, FR-0080)
related_pr: PR-0003
observed: '**Mechanismus.** `kernel/plan_diagram.py` erzeugt `plan.drawio.svg` und
  `mindmap.drawio.svg` als

  reine Funktion der Items und legt auf die Wurzel ein `data-source-digest`, mit dem

  `plan_diagram.is_pristine` drei Fälle unterscheidet: unberührt, von Hand geändert,
  veraltet. Diese

  Funktion ruft **niemand außer den Tests**. Kein Gate liest sie, `report.validate_state`
  liest sie

  nicht, kein Kommando meldet ihr Urteil. Wer eine der zwei Dateien in draw.io öffnet,
  etwas

  verschiebt und speichert, bekommt von diesem Apparat kein Wort — und verliert die
  Arbeit beim

  nächsten Schreiben.'
severity: medium
hole_number: H127
source: docs/holes/H127.md
limits: 'eine Handänderung an einem erzeugten Diagramm sieht zwischen zwei Zustandsschreibvorgängen
  niemand: `plan_diagram.is_pristine` unterscheidet `pristine`/`hand-edited`/`stale`
  und wird von keinem Gate und keinem Validator gerufen — nur von `tools/test_plan_diagram.py`.
  Gemessen an den zwei Dateien über dem echten Zustand dieses Repos (289 Items): frisch
  `pristine`; ein `<text>` per ElementTree ergänzt → `hand-edited`; dieselben Bytes
  gegen einen verschobenen Status → `stale`; und in einem laufenden Projekt meldet
  das nichts davon. Begrenzt durch: `generated/` ist in jedem Kit ignoriert, also
  erreicht eine Handänderung weder einen Commit noch eine zweite Maschine, und der
  nächste Schreibvorgang überschreibt sie — sobald die Auslöserzeile aus dem Protokoll
  von TSK-0115 in `state._write_board` steht; bis dahin schreibt überhaupt nur dieses
  Modul die zwei Dateien. Naht-Vorschlag an C: `report.validate_state` meldet `stale`/`hand-edited`
  als Warnung'
regression_tests:
- tools/test_plan_diagram.py::test_a_state_write_leaves_both_diagrams_beside_the_board
- tools/test_board.py::test_the_documented_command_names_every_artefact_it_writes
