id: BUG-0076
title: 'The design draft reaches the user UNSEEN: no kit duty renders and reviews
  a DSN before the user sees it, and the product-designer has no tool to look at his
  own work'
related_pr: BUG-0075
observed: 'Canyon_3.4.0 audit 2026-08-30 (session c794dd99, real project at C:/Offline
  Repos/gewerbe/buypluggo/website/Canyon_3.4.0, kit 2026.08.24-7): the PM presented
  DSN-0001.html to the user twice without anyone ever rendering it -- the user rejected
  both rounds (''sieht komplett trash aus'', ''teilweise linksbuendig statt mittig'')
  and then HIMSELF asked for an internal screenshot review against sinlu.de/raycast.com/linear.app.
  The PM recorded in DEC-0012: ''nobody had looked at rendered pixels. That is the
  root cause of two failed review rounds.'' Measured against the shipped kit: the
  constitution''s 283 lines mention screenshots/rendering/visual review ZERO times;
  every screenshot duty in the SKILLs (product-designer Phase 3 fidelity review, quality-engineer
  layout check, PM 5(e)) is conditioned on ''after implementation'' / ''the built
  view'' -- the DRAFT phase says only ''iterate with the user'', making the user the
  first pair of eyes by design. And the product-designer role ships tools: Read, Edit,
  Write, Grep, Glob -- no Bash -- so it CANNOT render its own draft even when asked;
  its own SKILL admits ''your own definition grants no command-running tool''.'
expected: 'The user''s stated requirement, verbatim intent: the screenshot loop runs
  INTERNALLY, without him. Before any design draft (directions preview or DSN detail)
  is presented to the user, it has been rendered at the ambition-relevant viewports,
  sighted, compared against the named style references and the frozen wireframe, and
  the found defects fixed -- by the apparatus, not by the user. The designer (or a
  designated eye) has the tools to do this.'
repro: 'grep -niE ''screenshot|playwright|visuell|visual|render|browser|pixel'' team-kits/dev-team/constitution/AGENTS.md
  -> 0 hits. grep ''after implementation'' in skills/product-designer/SKILL.md:171
  and skills/project-manager/SKILL.md:135. agents/product-designer.md:4 tools line
  lacks Bash. Live chain: Canyon session c794dd99 lines 764-827.'
severity: high
acceptance_criteria:
- id: AC-1
  text: 'a design draft cannot reach the user unreviewed as a PROPERTY of the flow:
    the kit''s draft phases (directions AND detail) carry the internal render-sight-fix
    loop as a duty BEFORE the user presentation, and the round decides measuring what
    can be a gate vs what stays prose (the FR-0035 pattern: provenance measurable,
    blindness not) -- the answer recorded either way'
- id: AC-2
  text: the role that must sight the render has a tool that can produce it; if the
    designer stays Bash-less for security reasons, the round names WHO renders and
    how the images travel, and the reason is recorded
- id: AC-3
  text: the loop includes the reference comparison the user asked for (current shop
    + named style references) when the ambition is exploration, and the review artifacts
    land in staging/<TSK>/ as evidence
- id: AC-4
  text: 'red-first against the live case: on the shipped kit the test/check fails
    exactly where Canyon failed (draft presented with zero render evidence)'
status: VERIFIED
