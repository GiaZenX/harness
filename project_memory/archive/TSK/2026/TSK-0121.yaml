  open.'
- 'PR-0004 AC-2 (FR-0057): every hook entry of every kit settings.json names a timeout
  (the eight office shell hooks first); a shipped test is red on an entry without
  one and the kit''s own deadline reader refuses such an entry with a sentence (the
  shape of _harness.Deadline here); the quality-engineer and implementer skill texts
  state the run-scope rule as a PROCEDURE (affected suites in a round, the full run
  once before delivery), measured against the kit text.'
- 'PR-0004 AC-3 (H139): C1/C2/C3 run in browser_smoke() of kit_browser_checks.py on
