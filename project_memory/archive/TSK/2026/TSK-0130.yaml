expected_outputs:
- 'PR-0010 AC-1 (trigger, DEC-FIRST): a proposal dec-trigger.json to the lead with
  two measured alternatives (a lead session-start routine vs an OS-level weekly task
  running both watchers headless via the CLI) and what each survives (session end,
  host reboot, a missing session); after the user''s answer the mechanism is built
  and measured once end to end (a run started by the mechanism writes a dated report
  into radar/), and a test refuses a watcher definition or README sentence that claims
  a schedule the repo does not build.'
- 'PR-0010 AC-2: the next codex report is produced by the built trigger in the shipped
  shape; the Sol/Terra/Astra effort ceiling (max vs ultra) measured against the Codex
  CLI, not copied; findings triaged into radar/decided.md with items where a change
  follows.'
- 'PR-0010 AC-3 (DEC-0076): model_tiers.yaml = exactly three rungs per provider (claude
  fable/opus/sonnet, codex astra/sol/terra with the measured ids), no `light` alias
  or haiku/luna row; gen_provider_artifacts refuses a light/haiku pin with a sentence
  naming DEC-0076; the .codex overlay and every constitution ladder sentence consistent;
  every pin resolves in a test; red-first.'
- 'PR-0010 AC-4 (BUG-0092): price anchors of both providers reworded to the measured
  current prices, dead watch dates removed, a shipped test red on any past watch date
  in model_tiers.yaml (red-first with today''s file), the MAINTENANCE header names
  the finding-to-item route.'
- 'PR-0010 AC-5: the rollout line in the protocol (stamp -> global store install ->
  update-kit at the next session start) and what a project sees when its pinned model
  no longer exists.'
- 'PR-0010 AC-6 (DEC-0077/DEC-0078, DEC-0034 rules 1-5): EVERY kit declares its OWN
  ladder in team-kits/<kit>/ladder.yaml (rungs, endpoints, effort pair, named exceptions
  -- dev/research high/xhigh climbing to fable, office medium/high with opus as the
  top for every role except office-developer and the sonnet-LOW filing floor); the
  dispatcher READS it at spawn (kernel create_lease + the kit dispatch path) and derives
  RUNG (role pin + kit endpoint) and EFFORT (default / large by the goal''s class)
  from state; a kit without a declaration is refused at dispatch with a sentence;
  rule 2: an order that FAILED climbs one rung per failure with the threshold a config
  value carrying its DEC line and a default measured on a pilot; rules 1/3/4/5 as
  DEC-0034 states them; rung and effort written on the lease and shown in the session
  brief; measured as a PROCESS on a scaffolded pilot per kit; red-first per rule;
  the kernel carries no kit-name branch and no default ladder.'
- 'PR-0010 AC-7: DEC-0034, DEC-0047, DEC-0076, DEC-0077, DEC-0078 cited by the code
  that implements them; the three constitutions'' ladder paragraphs say what is BUILT;
  the model_tiers.yaml header no longer calls the mechanic an open work item; the
  harness roles'' model pins (.claude/agents/harness-*.md, owned by G5-1) receive
  the sentence to write as a SEAM.'
- 'Per absorbed wish or bug its own red-first test measured in a copy outside the
  repo (restore the defect, see red, put it back) and its own acceptance line in the
  protocol; the verifier reports PER acceptance criterion of the goal. Every new property
  claim -- code comment, docstring, docs, hole item -- is MEASURED before handover.
  DEC-0080 (6): every new READER or tripwire this stream writes gets, before the report,
  a mutation in the direction its docstring denies (a reader that reads less than
  it claims was the repeated class of generation 4) -- the mutation and its red line
  stand in the protocol per reader. A named test must be able to fail. Holes: a measured
  gap is a BUG item captured through `PYTHONPATH=team-kits python -B -m kernel.cli
  --root project_memory capture BUG --hole` (kernel-allocated number; `limits` duty;
  module prefix in citations) -- no hand numbers, no document entries. forbidden_scope
  project_memory/** EXCEPTS project_memory/staging/(this task id)/ and the kernel
  command lines this order names. Wherever the truth about a shell can be executed,
  a real shell is the arbiter. Only the READING suites run in the stream -- and DEC-0080
  (2): a stream that changes a DISPATCH, LEASE or VALIDATOR rule runs every suite
  that READS that rule (grep the predicate''s callers, list them in the protocol)
  -- the full suite belongs to the merge; gate 5 is live: a full-surface line is refused,
  the DELIVERY_RUN prefix is the merge''s, never a stream''s. HOST RULE: one pytest
  at a time, every run with a timeout, no CPU-saturating rig (four hard power-offs
  on 2026-09-04). Clock: every protocol time is read, never extrapolated (DEC-0080
  (7)).'
- 'Seams: team-kits/kernel/cli.py (G5-1 and G5-3 add commands too -- your block only);
  the three constitutions and team-kits/*/agents/*.md (G5-1 writes the comment-discipline
  duty and the CR rule, G5-3 the office correspondence role -- you write ONLY ladder
  sentences and model/effort pins, listed per file in the protocol); tools/lead_package_sizes.json
  and docs/reviews/phase0-disposition.md (every stream grows a lead package: record,
  do not overwrite); README.md (command surface); team-kits/*/settings/settings.json
  if the trigger registers a hook (G5-1/G5-3 do not touch settings). Reach seam (DEC-0080
  (1)): the dispatcher change touches every kit -- measure all three pilots, and list
  every suite that reads create_lease / architect_step_owed / the ladder reader before
  handover (DEC-0080 (2)).'
- 'Handover: worktree C:/Offline Repos/v2-testbed/_worktrees/g5-ladders (branch g5/ladders
  off feat/harness-v2 at b7f282e); ALL scratch only under C:/Offline Repos/v2-testbed/_round-scratch/(this
  task id)/; a red-first rig refuses to run outside its own directory and writes binary;
  verifier copies made WITHOUT the .git file of the worktree; patch = the worktree
  diff WITHOUT the VERSION hunks at C:/Offline Repos/v2-testbed/_round-scratch/(this
  task id)/stream-ladders.patch (a patch carrying VERSION hunks is a cut finding);
  protocol at project_memory/staging/(this task id)/stream-protocol.md with: seam
  table (received / expected at merge), per-criterion acceptance line + red-first
  tests, reader mutations, measured lines, what was deliberately not closed but named
  (as hole items), the one-line rejected alternative of the plan (FR-0084 shape, now
  a constitution duty), suites run (reading suites + the suites that read a changed
  rule), provisional VERSION stamp, wall-clock (read) and tokens for the (g) table.
  DEC-first proposals go to the lead as project_memory/staging/(this task id)/dec-*.json
  -- the user decides, the stream waits on that point and works on the rest. No commit,
  no push, no install to the global store.'
