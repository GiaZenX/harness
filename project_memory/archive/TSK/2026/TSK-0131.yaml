  model/effort pin lines as G5-2 hands them); tools/lead_package_sizes.json + docs/reviews/phase0-disposition.md
  (record, not overwrite); README.md. Reach seam (DEC-0080 (1)): the validator lines
  run in every kit -- measure all three pilots; list every suite that reads validate_state
  before handover (DEC-0080 (2)).'
- 'Handover: worktree C:/Offline Repos/v2-testbed/_worktrees/g5-stock (branch g5/stock
  off feat/harness-v2 at b7f282e); ALL scratch only under C:/Offline Repos/v2-testbed/_round-scratch/(this
  task id)/; a red-first rig refuses to run outside its own directory and writes binary;
  verifier copies made WITHOUT the .git file of the worktree; patch = the worktree
  diff WITHOUT the VERSION hunks at C:/Offline Repos/v2-testbed/_round-scratch/(this
  task id)/stream-stock.patch (a patch carrying VERSION hunks is a cut finding); protocol
  at project_memory/staging/(this task id)/stream-protocol.md with: seam table (received
  / expected at merge), per-criterion acceptance line + red-first tests, reader mutations,
  measured lines, what was deliberately not closed but named (as hole items), the
  one-line rejected alternative of the plan (FR-0084 shape, now a constitution duty),
  suites run (reading suites + the suites that read a changed rule), provisional VERSION
