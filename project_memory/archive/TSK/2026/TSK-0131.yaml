expected_outputs:
- 'PR-0008 AC-1 (FR-0058 survey): every one of the active BUGs -- the 89 pre-existing
  and the 155 migrated holes -- measured against b7f282e (observed line re-run or
  test executed, one short run at a time) and given ONE of three verdicts THROUGH
  THE KERNEL: VERIFIED + archived with an Evidence item naming the measurement; OPEN/TRIAGED
  with the re-measured chain and date written by `update`; CANCELLED/superseded naming
  the absorbing item; the protocol tables all of them with verdict and measured line;
  no verdict without a measurement; batches by module so the round can be resumed
  from disk after a crash.'
- 'PR-0008 AC-2 (FR-0058 wishes): the 21 FRs triaged against b7f282e: delivered ->
