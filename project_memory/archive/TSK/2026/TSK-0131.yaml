  (FR-0024, FR-0019, FR-0022, FR-0023, FR-0025, FR-0020) TRIAGED with the user''s
  ''needs planning'' note in the item, no FR left whose source describes something
  built.'
- 'PR-0008 AC-3 (the derivable ''done''): validate names an item standing OPEN while
  its confirming evidence or named regression test exists and passes -- derived from
  items + evidence store + the test tree, no list; red-first; measured on this repo''s
  store (the survey feeds it).'
- 'PR-0008 AC-4 (BUG-0023): create-task and capture TSK refuse an empty expected_outputs
  list naming the field (one rule, both entrances); the validator names existing items
  with an empty list; red-first.'
- 'PR-0008 AC-5 (BUG-0022): the CR type reached in a measured run on a scaffolded
  dev pilot (a change to something built produces a CR through its automaton) with
  the PM texts saying WHEN a CR applies instead of a PR replacement and a test on
  the text-to-behaviour path -- or the type removed with the reasons recorded; the
  PR-replacement path stays and records the replacement.'
- 'PR-0008 AC-6 (generation-4 leftovers): BUG-0025, BUG-0033, BUG-0069 (after the
  user''s push: the hosted run is the evidence -- name it as the one line that waits),
  BUG-0088, BUG-0090, BUG-0091 VERIFIED against b7f282e with their evidence lines;
  BUG-0083..0086, BUG-0089 archived; TSK-0121..TSK-0126 archived; PR-0004..PR-0007
  walked to their delivered status with the merge commit as delivered_commit where
  the automaton asks for it.'
- 'PR-0008 AC-7 (FR-0007 + FR-0012): the comment-discipline duty (a comment carries
  the WHY and points at items; a property claim becomes a test the comment names;
  a named test must resolve; no sentence claims a check the code does not build) in
  the three constitutions'' ''duties that have no gate behind them'' section byte-identical
  x3 and in every implementing role definition; the kits ship the mechanical half
  (a pointer sweep over the project''s own code and role texts, red on a named test
  or item that does not resolve) scaffolded and measured on a pilot per kit; FR-0012:
  a validator line naming a Decision item whose text demands build work while no item
  points at it -- DEC-FIRST proposal dec-decision-catcher.json on how a decision says
  it demands work (a field, a phrase class, or the pointer direction), the user decides;
  then built red-first and shipped to the three kits in the same round.'
- 'Per absorbed wish or bug its own red-first test measured in a copy outside the
  repo (restore the defect, see red, put it back) and its own acceptance line in the
  protocol; the verifier reports PER acceptance criterion of the goal. Every new property
  claim -- code comment, docstring, docs, hole item -- is MEASURED before handover.
  DEC-0080 (6): every new READER or tripwire this stream writes gets, before the report,
  a mutation in the direction its docstring denies (a reader that reads less than
  it claims was the repeated class of generation 4) -- the mutation and its red line
  stand in the protocol per reader. A named test must be able to fail. Holes: a measured
  gap is a BUG item captured through `PYTHONPATH=team-kits python -B -m kernel.cli
  --root project_memory capture BUG --hole` (kernel-allocated number; `limits` duty;
  module prefix in citations) -- no hand numbers, no document entries. forbidden_scope
  project_memory/** EXCEPTS project_memory/staging/(this task id)/ and the kernel
  command lines this order names. Wherever the truth about a shell can be executed,
  a real shell is the arbiter. Only the READING suites run in the stream -- and DEC-0080
  (2): a stream that changes a DISPATCH, LEASE or VALIDATOR rule runs every suite
  that READS that rule (grep the predicate''s callers, list them in the protocol)
  -- the full suite belongs to the merge; gate 5 is live: a full-surface line is refused,
  the DELIVERY_RUN prefix is the merge''s, never a stream''s. HOST RULE: one pytest
  at a time, every run with a timeout, no CPU-saturating rig (four hard power-offs
  on 2026-09-04). Clock: every protocol time is read, never extrapolated (DEC-0080
  (7)).'
- 'Seams: team-kits/kernel/cli.py (G5-2 and G5-3 add commands -- your block only);
  the constitutions and team-kits/*/agents/*.md (G5-2 writes ladder sentences + model/effort
  pins, G5-3 the office correspondence role -- you write the comment-discipline duty
  and the CR rule, per file in the protocol); .claude/agents/harness-*.md are YOURS
