  holds proposals, not state. Protecting it means the write-scope gate scanning the
  migration records in the decision path of EVERY write (H61''s cost class). Put to
  the user 2026-09-12 ~22:2x; answer: leave, named.'
decision: No scan. BUG-0056 closes as an accepted exception with an honest title (the
  recorded-outside case does not arise; the staging copy is a proposal); staging/
  stays open.
alternatives: Scan the migration records on every write -- every write in every project
  slower, for a file that is not state; rejected.
consequences: The exception question (the click); the item's title is corrected at
  the same time.
