id: DEC-0078
title: 'Buero-Kit laeuft bewusst die niedrigere Leiter: kein fable ausser fuer den
  office-developer, sonst opus / sonnet mit Aufwand medium (Standard) / high (grosse
  Ziele) statt high / xhigh -- Verfeinerung von DEC-0047 und DEC-0077'
context: 'USER DECISION 2026-09-05, immediately after DEC-0077 (two axes, escalation
  built): ''nur im buero kit reichen niedrigere stufen bewusst also kein fable (ausser
  fuer den entwickler) und sonst opus und sonnet auf medium/high statt high xhigh''.
  DEC-0047 already made the ladder endpoints per kit (office compressed with opus-high
  as its top rung and a sonnet-LOW reading floor); DEC-0077 set the effort axis high
  / xhigh for every kit. Measured office pins today: office-manager and office-developer
  = lead (opus), every other office role = worker (sonnet), two roles low (the filing
  floor). The office kit''s work is documents, bookkeeping and correspondence -- volume
  over depth; the one role that builds code is the office-developer.'
decision: '(1) office-team endpoints: the top rung is opus for every office role EXCEPT
  the office-developer, which may climb to fable under DEC-0034''s escalation (stuck
  orders, architecture-touching CRs) like a dev-team builder; no other office role
  ever runs on fable. (2) office-team effort axis: `medium` by default, `high` when
  the goal''s class is large; `xhigh` is not an office effort; the sonnet-LOW filing
  floor of DEC-0047 stays as the named exception. (3) NO GENERALISATION (user: ''die
  stufen nicht generalisieren sondern je kit eben definieren''): EVERY kit declares
  its OWN ladder -- rungs, endpoints, effort pair, named exceptions -- in its own
  declaration beside its constitution; dev-team and research-team each declare theirs
  (today both high / xhigh climbing to fable, but two declarations that may diverge,
  not one shared rule); office-team declares the ladder of (1)/(2). (4) The dispatcher
  READS the kit''s declaration; the kernel carries no per-kit branch and no default
  ladder of its own -- a kit without a declaration is refused at dispatch with a sentence,
  a fourth kit declares its own without a kernel change; model_tiers.yaml keeps only
  the provider translation of the rung names (DEC-0076). (5) Built by PR-0010 AC-6
  together with the mechanic; the office constitution''s ladder paragraph says this
  (and only this).'
consequences: 'Office projects cost less per round by design and never escalate a
  bookkeeper onto the top rung; the office-developer keeps the full climb because
  code is where the cheap rung fails. Cost: one more per-kit declaration to keep current;
  the kit''s ladder paragraph must match the declaration (a test reads both). Rejected:
  one global effort pair for all kits (over-pays the office kit''s routine work);
  fable for the office-manager (the user keeps it at opus).'
source: user message 2026-09-05; DEC-0047; DEC-0077; DEC-0034; office role pins read
  2026-09-05; PR-0010
