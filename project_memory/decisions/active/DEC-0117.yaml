id: DEC-0117
title: 'Archiv-Tuer: ein schmaler Kernel-Befehl darf in einer archivierten Akte NUR
  einen Testverweis (regression_tests / Testknoten) auf einen existierenden Nachfolger
  korrigieren, protokolliert; alles andere im Archiv bleibt unantastbar, und der Test
  ''jeder genannte Test existiert'' bleibt scharf'
context: 'USER 2026-09-26 ~07:3x, answer to the lead''s question with three options
  (narrow correction door / stop checking the archive / keep the old name as an alias
  test): ''Schmale Korrektur Tuer''. MEASURED: .claude/hooks/test_gates.py::test_every_test_a_hole_names_is_one_that_exists
  is red because archived BUG-0221 (H138, ACCEPTED_EXCEPTION) and BUG-0237 (H155,
  VERIFIED) name tests that were renamed or replaced after they were archived; the
  kernel has no door to an archived item (handover 2026-09-13).'
decision: '(1) A kernel command (name is the builder''s, e.g. `amend-archived-test-ref`)
  that takes an archived item id, the OLD test node and the NEW test node, and refuses
  unless: the item is archived; the old node is named in that item''s test-reference
  field(s) and resolves NOWHERE; the new node RESOLVES (collectable) now; nothing
  but that reference changes. (2) Every use writes an audit record (who, when, old
  -> new, reason) the index and the hole list can show. (3) No other field of an archived
  item becomes writable -- status, verdict, evidence and approvals stay frozen; a
  test (red-first) proves each refusal. (4) The gate test that every named test exists
  keeps reading archived items: a deleted regression test of a closed bug stays visible.
  (5) First use: H138 (BUG-0221) and H155 (BUG-0237), done by the lead through the
  new command after the verifier''s PASS.'
consequences: 'The archive stays history, but its pointers can follow a rename; the
  gate suite turns green without weakening. Rejected: not checking the archive (a
  deleted regression test would go unnoticed); alias tests under old names (ballast
  in code).'
