# research-team/ladder.yaml -- THIS kit's model ladder, read by `kernel.dispatch.ladder_for_order` at
# every lease (`create_lease`) and again at every spawn (`validate_dispatch`, the kit dispatch path).
#
# WHY A FILE PER KIT (DEC-0078 (3)/(4)): the kernel carries no ladder of its own and no kit-name
# branch -- a kit without this file is refused at dispatch with a sentence, and a fourth kit declares
# its own without a kernel change. research-team and dev-team declare alike today; they are two
# declarations that may diverge, not one shared rule (the user's words in DEC-0078).
#
# WHAT THE TWO AXES ARE (DEC-0077 (1)): the RUNG hangs on the role's pin and this kit's endpoints
# (DEC-0047), the EFFORT on the goal -- `default` unless the goal's `class` is `large`. DEC-0034's
# T2 rung -- opus at the large-goal effort -- is a point on the two axes, not a rung of its own
# (DEC-0076 (2)). Rung and effort are never spelled as ONE hyphenated step in a shipped kit file:
# that spelling is the retired user-gated ladder, and
# `test_no_shipped_kit_text_still_names_the_retired_user_gated_ladder`
# (tools/test_model_ladder.py) reads every shipped kit file for it.
# Rung names are the reference vocabulary of `team-kits/model_tiers.yaml` (DEC-0076); the provider
# translation stays there. `tools/test_ladder.py` measures every rule below against the kernel, and
# `tools/test_model_ladder.py::test_the_constitutions_ladder_paragraph_says_what_the_declaration_says`
# reads this file and the constitution's ladder paragraph together.

rungs: [sonnet, opus, fable]          # ordered low -> high
top: fable                            # DEC-0047: research climbs to fable

effort:
  default: high                       # DEC-0077 (1)
  large: xhigh                        # when the goal's `class` is large

escalation:
  # DEC-0096: EFFORT BEFORE RUNG. What COUNTS as a fail is derived by the kernel
  # (`dispatch.count_failed_run_locked`), not declared here; what the two numbers below BUY is
  # derived by `dispatch.ladder_for_order`. Of the failed runs inside one rung's cycle the first
  # two raise the effort on the same rung, and the third raises the rung (DEC-0034 rule 2), from
  # where the effort starts over at this kit's default. The measurement behind the move away from
  # the user's 2026-08-10 rule of one rung per fail is in DEC-0096: every stream of generations
  # 3-5 and both goal packages of generations 5-6 failed their FIRST verification round, so a rung
  # per fail put an Opus builder on the top rung at the start of nearly every goal -- the standing
  # top-rung cost DEC-0095 had just removed.
  # THIS KIT'S PAIR HAS ONE STEP OF HEADROOM (high -> xhigh), so the second effort step lands on
  # the ceiling and changes nothing; the rung is what moves at the third fail.
  # THE RESET IS PAID FOR BY THE RUNG STEP, and that matters at the END of the ladder: at the top
  # rung no further step is granted, so the effort STAYS at the ceiling instead of falling back to
  # the default -- an order that has run out of ladder never comes back on a weaker pair than the
  # run before it (verifier round 1, F1; the kernel counts the GRANTED steps, not the derived ones).
  effort_steps_before_rung: 2           # DEC-0096 (2)
  failed_runs_per_rung: 3               # DEC-0096 (2), replacing the 1 of DEC-0034 rule 2

# DEC-0034 rules 1 / 4 / 5 as the rung a CLASS starts on: `top` is this kit's top rung, `pin` the
# role's own pin, anything else a rung name. The method design (this kit's architecture step, owned
# by the methodologist) starts on the top rung (rule 1); the reviewer is this kit's QA
# and never runs below opus (rule 5). This kit has no design class (rule 4 has no holder here). That
# the BUILD is dispatched only after the scope approval and the accepted method is not declared
# here: the kernel refuses a build order before that moment, and
# `test_a_build_order_reaches_the_ladder_only_after_the_phase_its_class_assumes`
# (tools/test_ladder.py) measures it instead of this sentence claiming it.
# Rule 3 (a change touching the method lifts back to the top for that change) is the architecture
# class on the top rung: the rung is derived per ORDER at every lease and stored nowhere else, so the
# fall back afterwards is what happens by itself.
#
# DEC-0095 (1)/(2) MOVED TWO OF THESE off `top` and off the pin, on cost measured by the user: the
# top rung is not bearable as a STANDING tier, so the build starts on opus rather than on the
# researcher's `worker` pin, and planning starts on opus rather than on the top rung. The
# architecture class keeps `top` -- DEC-0095 (4a) names it as one of the two occasions the top rung
# is bought: one call, a document as output, the freeze the build falls from (DEC-0034 rule 1). The
# other occasion is the escalation above, and nothing else reaches the top rung.
#
# A CLASS START MAY BE A BAND (DEC-0097 (1)): `default` is where an order of that class starts when
# it asks for nothing, `floor` how far down an order's own `rung` ask may take it -- and a bare
# rung, which every other class below writes, is the pair whose two ends coincide and therefore has
# no band at all. The build is the one class with a band here, and DEC-0097 measured why: with
# `build: opus` as a single value, `create-task --rung sonnet` on a mechanical slice came back opus,
# so the cheapest rung was unreachable for every builder -- against the user's own rule ("Sonnet nur
# fuer ganz kleine Sachen") and against Anthropic's guidance for edits you can describe precisely.
# The ask is granted only when the order's ACCEPTANCE NAMES A TEST, and since DEC-0112 only in the
# SHAPED form: the ADDRESS of a test -- a test module (`test_x.py`, `x_test.go`, `x.test.ts`,
# `x_spec.rb`) or a file in a `test`/`tests` tray, with or without the `::node` a runner appends --
# standing in an expected output or in a referenced criterion. A DESCRIPTION counts for nothing,
# and so does a document merely named after tests (`docs/test-plan.md`): the reader judged prose
# until 2026-09-13 and four verification rounds found four holes in that judgement, all of them
# granting the cheap rung. The reader is `dispatch.acceptance_is_test_shaped` and it, not this
# comment, is the authority (FR-0091 precision 2); the lease's `why` names the shaped form.
classes:
  planning: opus                        # DEC-0095 (2): the orchestrator is a standing cost
  architecture: top                     # DEC-0095 (4a): the one bought call per large goal
  qa: opus
  build:                                # DEC-0095 (1) default, DEC-0097 (1) floor
    default: opus                       # the builder default, not the worker pin
    floor: pin                          # a test-carrying slice may be asked down to it

# Every spawnable role of this kit and its class. Both ends are measured by
# `tools/test_ladder.py::test_every_kit_role_has_a_class_and_every_classed_role_ships`: a role
# without a class is refused at dispatch, a class for a role the kit does not ship is a dead line.
roles:
  project-manager: planning
  methodologist: architecture
  reviewer: qa
  project-auditor: qa
  researcher: build
  research-engineer: build
  data-analyst: build
  report-writer: build

# Named per-role exceptions: `top` (a higher or lower endpoint for one role), `effort` (a fixed
# effort that replaces the pair -- floor AND ceiling, an order's `effort` ask cannot move it,
# DEC-0091 (2) with DEC-0047's reason), `rung` (the floor the start is taken from instead of class
# and pin; an order's `rung` ask may lift it, never lower it). None in this kit.
exceptions: {}
