# model_tiers.yaml -- provider-neutral model RUNGS for ALL kits.
#
# The kits' model_map values and role pins use the CLAUDE names as the canonical rung vocabulary
# (Claude Code is the reference platform); `lead`/`worker` are accepted ALIASES everywhere a model
# name is read (scaffold stamping, session_status drift check, provider generators). Provider
# generators translate a rung to that provider's concrete model id via this table.
#
# WHICH RUNG IS A STANDING TIER AND WHICH IS BOUGHT PER OCCASION IS NOT THIS TABLE'S BUSINESS
# (DEC-0095, beside DEC-0076): this file translates three rungs per provider and says nothing about
# who runs on which. DEC-0095 answered the "who" on cost -- builder, orchestrator and verifier on
# opus, the TOP rung only for the named architecture step of a large goal and as the escalation
# target after a failed run -- and it did so by moving the `classes:` of the kits' `ladder.yaml`
# and the role pins, not by changing a row here. A reader who came looking for the answer in this
# table is in the wrong file: the kit's declaration is the one that decides, and DEC-0096 says in
# which ORDER a failed run climbs the two axes.
#
# THREE RUNGS PER PROVIDER, NO MORE (DEC-0076): fable / opus / sonnet in the reference vocabulary,
# and the same three positions for every other provider. There is no `light` alias and no haiku or
# luna row; a pin this table cannot place is refused by `gen_provider_artifacts.provider_neutral_model`
# with a sentence naming that decision, and
# `tools/test_model_ladder.py::test_every_provider_declares_exactly_the_three_rungs` reads this file
# for the count. What a kit DOES with the rungs -- its endpoints, its effort pair, the escalation --
# is that kit's own `ladder.yaml` beside its constitution (DEC-0078), read by `kernel.dispatch` at
# every lease and every spawn (DEC-0077); this table carries only the provider translation.
#
# MAINTENANCE: the radar-watcher (Claude side) and the codex-watcher (OpenAI side) REPORT what moved
# (new models, price moves, deprecations) into radar/. A finding becomes a change by exactly one
# route: at triage the lead captures an item under the open goal (`capture BUG` or `capture FR`,
# `related_pr` set) and a stream edits this file under that item. Never a line in radar/decided.md
# on its own, and never the watcher itself, which may not write kit files -- BUG-0092 measured three
# reports naming the same dead line while nothing changed, because no item carried it. Changing a
# rung's model here re-tiers every project on the next restamp: always a USER-approved proposal,
# never an automatic bump.
#
# Price anchors, read 2026-09-05 off the vendors' pages (per 1M tokens in/out; sources
# radar/2026-09-05-codex.md items 1-2 and radar/2026-09-04-claude.md) -- for a reader, not for code:
#   claude: Opus-class $15/$75 . Sonnet 5 $2/$10 standard (the 2026-08-31 increase was cancelled,
#           radar/decided.md radar-0821-sonnet5-price-trigger) . Opus 4.1 was shut down 2026-08-05
#   openai: gpt-6-astra $10/$50 (GA 2026-09-03) . gpt-5.6-sol $4/$20 promotional, $5/$30 standard .
#           gpt-5.6-terra $2/$12 (since 2026-07-30)
# Watch dates -- a date in the past on this list is a defect,
# `tools/test_model_ladder.py::test_no_watch_date_in_the_tiers_table_lies_in_the_past` is red on it;
# a date that passed is removed, and what it was about becomes a fact above or an item:
#   2026-11-21 gpt-5.6-sol promotional pricing is guaranteed until at least this date

# THE ORDER OF THE RUNGS, low -> high (DEC-0076 (1): worker < lead < top). The rows under `tiers:`
# are mappings and carry no order; `kernel.dispatch._reference_rungs` reads THIS line for the
# vocabulary a kit-less project places an order's `rung` against, and refuses a line that does not
# name exactly the reference row's rungs -- so the two cannot drift apart.
rungs: [sonnet, opus, fable]

aliases:            # alias -> canonical (claude) rung name used in model_map and role pins
  lead: opus
  worker: sonnet
# `fable` (the top rung) is accepted as a Claude-side model_map pin and in a kit source's agent
# frontmatter; Claude keeps it literally, every other provider maps it to its own top row below. It
# has no `aliases:` entry on purpose -- an alias names a rung this table translates, and fable IS
# the translation on the reference platform; an alias here would also be one the scaffold's
# frontmatter rewrite does not know. What decides whether a kit source may carry a value is
# `gen_provider_artifacts.provider_neutral_model`, which reads THIS file rather than a list of names.

tiers:              # provider -> rung name -> that provider's model id
  claude:           # reference platform -- rung names ARE the model ids, values pass through
    fable: fable
    opus: opus
    sonnet: sonnet
    effort_field: effort              # agent frontmatter key; values low|medium|high|xhigh|max
  codex:
    fable: gpt-6-astra
    opus: gpt-5.6-sol
    sonnet: gpt-5.6-terra
    effort_field: model_reasoning_effort   # .codex/agents/*.toml; shared vocabulary low|medium|high|xhigh|max
    # The Codex effort CEILING is not stated here on purpose (DEC-0076 (3)): the vendor's model pages
    # say `max` and its CLI agent-config page says `ultra` (radar/2026-09-05-codex.md item 3), and
    # nothing in this repo has measured a `.codex/agents/*.toml` against the CLI yet. A provider-only
    # value goes through the `codex:` frontmatter overlay when a round has measured it.
