# chart_of_accounts.yaml — owned by: Bookkeeper
# THE CHART OF ACCOUNTS (Kontenrahmen) AND ITS MAPPING TO THE ANLAGE EÜR (FR-0081). One document,
# three readers: `scripts/ledger_add.py` names the account a booking's category maps to and refuses
# a category the active framework has no account for; `scripts/euer_report.py` sums per account and
# takes a category's form line from the ACCOUNT while a framework is active; `apply-proposal` is the
# writer that grows it (an account added, a category mapped) and `revise-document` the one that
# corrects it — both on a user-minted approval, never a text editor (constitution §6).
#
# LEGAL SPACE AND YEAR, because both are facts about the numbers below and not about this kit:
# the frameworks are the two standard German chart-of-accounts numberings SKR03 and SKR04 (the kit
# names no bookkeeping vendor: FR-0028, and `tools/test_kit_neutrality.py::
# test_no_shipped_office_template_names_a_platform_or_the_pilot_business` measures that over every
# shipped template), and `euer_line` is a line of
# the German Anlage EÜR for the form year named here — the same year `master_data.yaml` names in
# `euer_form.year`, and the report reads BOTH files, so the two must agree
# (`tools/test_office_package.py::test_the_chart_of_accounts_and_the_vocabulary_name_one_form_year`).
# A business outside Germany, or one that keeps books (a GmbH, see `business_profile.yaml`), is not
# served by this file at all; `legal_space` says so rather than letting the numbers travel.
#
# WHAT THE KIT READ, STATED AS WHAT IT IS. The account numbers were taken from public overviews of
# the two charts on 2026-09-05; no publisher's own list was read and none is shipped, and the line numbers
# are the ones `master_data.yaml` carries for the same categories, read from public filling aids —
# not from the official form. So this is a STARTING POINT for the conversation with the
# Steuerberatung, exactly like the retention spans in `filing_plan.yaml`: correct an account or a
# line here and both scripts follow; nothing in the kit has to change.
#
# HOW IT IS USED. `active` names the framework this business books against, or `null` — shipped
# `null`, because which chart a business uses is the Steuerberatung's answer and a guessed one would
# stand under every booking. With `null` the ledger takes any category the vocabulary knows and the
# report prints no account. With a framework named, EVERY booked category must map to exactly one
# account of that framework (`categories:` on the account); one that maps to none, or to two, is
# refused at the booking with the account list named. A category's `euer_line` in
# `master_data.yaml` and its account's `euer_line` here are two statements of one fact: where they
# differ the report prints both and the account's wins in the per-line table, so a disagreement is
# visible in the document the Steuerberatung reads instead of being averaged away.
#
# `account` is a STRING, deliberately: a leading zero is part of an account number, and YAML would
# read a bare 0800 as an octal literal or a plain 800.

