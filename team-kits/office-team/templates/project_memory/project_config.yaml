# project_config.yaml — owned by: Manager
# Created once at init. Preset + model map. Preset and any model change MUST be user-confirmed.
# Presets are MECHANICAL: the scaffold installs only the preset's roles (kit presets.yaml is the
# authority on which; the office manager can read it out to you). Changing the preset later is the
# manager's to do from the chat — it asks you first and then asks for a session restart.

project:
  name: ""                  # set at init
  preset: core              # core | commerce | full — user-confirmed

# Agent CLIs this repo is generated for: claude | codex. With codex listed, every scaffold run
# generates the Codex artifacts from the installed kit state — single source, never hand-cloned.
# BOTH by default so a mid-project CLI switch needs no config edit. Claude is the reference
# platform; Codex is BETA (one-time project trust + /hooks trust required).
providers: [claude, codex]

# Three rungs, sonnet < opus < fable (DEC-0076); this kit's own ladder is `ladder.yaml` beside its
# constitution: its top rung is opus for every role but the office-developer, which climbs to fable
# (DEC-0078) -- on Codex; on Claude the top is capped at opus for every role (DEC-0114 (4)).
# Specialists DEFAULT to sonnet. Accepted values: the aliases `lead`/`worker` (= opus/sonnet on
# Claude), the rung names, or the top-rung pin `fable`; `light`/haiku are retired and the generator
# refuses them with a sentence naming DEC-0076. Provider generators translate a value to the
# concrete model via team-kits/model_tiers.yaml. What is pinned here is the rung an order STARTS
# on; which rung it RUNS on is derived by the kernel at every dispatch (constitution §7, the ladder
# paragraph -- DEC-0077/DEC-0078). Down-scaling the manager MAY do itself but MUST report it with a
# reason; growing the team stays user-confirmed.
# The manager is the FOREGROUND agent on opus (kit settings + frontmatter) — NOT listed here.
# The scaffold re-stamps each installed agent's model:/effort: from these maps on every update;
# session_status nags on drift. Keys cover the FULL roster — entries for roles the preset did not
# install are inert until an upgrade installs them.
model_map:
  records-clerk: worker
  filing-reviewer: worker      # the second pair of eyes on every filing (FR-0049): it READS
                               # documents and answers per file, so it needs the reading tier and
                               # nothing above it — the wall (gate_filing) is what it stands in
                               # front of, not what it replaces.
  bookkeeper: worker
  product-editor: worker
  shop-curator: worker
  compliance-researcher: worker
  marketing-planner: worker
  office-developer: lead       # the only coding role and the kit has no QA/CI net — judgment
                               # errors in its tools go uncaught, so it gets the strong tier.
  project-auditor: worker

# Reasoning effort per specialist (low | medium | high | xhigh | max). Default high. FACTS
# (official effort doc, verified 2026-07): Sonnet 5 supports xhigh AND max. The ladder DERIVES an
# effort per order as well (`ladder.yaml`: medium, high for a `large` goal) and shows it on the
# lease and in the brief -- but what a child RUNS on is the value stamped from THIS map, because
# the platform has no per-spawn effort parameter (measured 2026-09-05, BUG-0251: the stamped
# `high` and the declared `medium` disagree today). There is no user-gated escalation ladder any
# more (DEC-0077).
# THE FILING PAIR IS THE ONE EXCEPTION AND IT IS A USER DECISION, not a saving found here: DEC-0047
# gives the DEC-0034 ladder per-kit endpoints and puts the clerk+reviewer pipeline BELOW the dev
# floor at `low`, because two roles read every document and gate_filing still refuses every move no
# rule covers ("reine Auslese, kein starkes Modell noetig", FR-0049).
effort_map:
  records-clerk: low
  filing-reviewer: low
  bookkeeper: high
  product-editor: high
  shop-curator: high
  compliance-researcher: high
  marketing-planner: high
  office-developer: high
  project-auditor: high
